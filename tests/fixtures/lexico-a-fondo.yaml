# LÉXICO OBLIGATORIO — las palabras con las que preguntan desde afuera.
#
# El buscador del chat es LÉXICO (MiniSearch sobre el corpus, sin embeddings):
# una palabra que el documento no escribe no existe para quien pregunta. La
# reescritura de 2026-09 subió el volumen ×6,5 y, al hacerlo, cambió términos
# concretos por sinónimos abstractos: «contenedores» por «empaquetado», «BPMN»
# por «modelado de procesos», «ETL» por «integración de información». El corpus
# creció y el buscador empeoró.
#
# Cada lista sale de dos sitios verificables, no de la intuición:
#   · `tests/fixtures/banco-de-preguntas.es.yaml` — las preguntas que declaran
#     a ese documento como fuente esperada;
#   · `data/cv.es.yaml` — las skills y herramientas que el sitio ya publica.
#
# Un término se compara SIN TILDES y en minúsculas, y basta con que aparezca
# una vez en el cuerpo. No es una cuota de densidad: es la garantía de que la
# palabra existe. Si un término deja de ser cierto, se BORRA de aquí y se
# explica — jamás se escribe en el documento para que el gate pase.

