# CIFRAS DEL SITIO — los conteos que el corpus no puede contradecir (a fondo v2).
#
# Por qué existe: el visitante PUEDE CONTAR. Si el chat dice «siete aplicaciones»
# y la vitrina muestra seis, la cifra no es un detalle de redacción: es la única
# afirmación del sitio que cualquiera desmiente en diez segundos, y se lleva por
# delante la credibilidad de las otras treinta.
#
# Aquí NO se escribe ningún número. La verdad se DERIVA del repositorio
# (`verdadesDelSitio()` en scripts/a-fondo-coherencia.mjs): las piezas se cuentan
# en `content/`, las credenciales en `data/cv.es.yaml`. Si mañana entra una pieza
# nueva, el gate se mueve solo y nombra a los documentos que se quedaron atrás.
#
# Lo que sí se escribe es el PATRÓN, y se escribe estrecho a propósito: se
# prefiere no cazar una frase a cazarla mal.
#   · `sustantivos`: el sustantivo que sigue al número.
#   · `contexto`:    si está, alguna de estas frases tiene que aparecer cerca —
#                    es como se separa «credenciales de IBM» de «credenciales».
#   · `salvedades`:  si alguna aparece cerca, la frase no se juzga, y la razón
#                    va escrita al lado.
#
# LO QUE ESTE GATE NO VIGILA, y por qué: «veintisiete agentes» de Vesting. Es un
# inventario de una empresa que no está en este repositorio, así que no hay
# verdad que derivar — vigilarlo sería congelar a mano un número, que es
# exactamente lo que este gate existe para evitar. Su fuente vive en la hoja de
# ruta de la auditoría, fuera del repo, y su control es la lectura del dueño.

conceptos:
  - id: apps
    etiqueta: "las apps hermanas de la vitrina"
    fuente: "content/vitrina/*.json"
    sustantivos: [aplicaciones, apps]
    salvedades:
      - frase: "aplicaciones de power bi"
        razon: "un conteo de informes, no del pipeline"
      - frase: "aplicaciones empresariales"
        razon: "categoría de software, no piezas de la vitrina"

  - id: piezas
    etiqueta: "las piezas publicadas en la vitrina"
    fuente: "content/vitrina + agentes + investigaciones + tableros"
    sustantivos: [piezas]

  - id: agentes-vitrina
    etiqueta: "los agentes publicados en la vitrina"
    fuente: "content/agentes/*.json"
    sustantivos: [agentes]
    contexto:
      - publicados
      - "de la vitrina"
      - "en la vitrina"
      - "del portafolio"
      - "en el portafolio"

  - id: investigaciones
    etiqueta: "las investigaciones publicadas"
    fuente: "content/investigaciones/*.json"
    sustantivos: [investigaciones, "lineas de investigacion", "líneas de investigación"]

  - id: tableros
    etiqueta: "los tableros publicados"
    fuente: "content/tableros/*.json"
    sustantivos: [tableros]
    # Un tablero es también lo que se construye en un empleo («más de 20 tableros de control» en
    # CTIC): solo se juzga el conteo cuando cerca se habla de la vitrina o de datos públicos.
    contexto:
      - publicados
      - "de la vitrina"
      - "en la vitrina"
      - "del portafolio"
      - "en el portafolio"
      - "datos publicos"
      - "datos públicos"
      - "datos abiertos"
    salvedades:
      - frase: "tableros de control"
        razon: "habla del oficio, no del inventario de la vitrina"
      - frase: "tableros de bi"
        razon: "habla del oficio, no del inventario de la vitrina"

  - id: credenciales-obtenidas
    etiqueta: "las credenciales obtenidas"
    fuente: "cv.es.yaml · certificaciones sin «estado»"
    sustantivos: [credenciales, certificaciones]
    salvedades:
      - frase: "de ibm"
        razon: "las de IBM tienen su propio concepto"
      - frase: "en curso"
        razon: "las que están en preparación no son obtenidas"

  - id: credenciales-ibm
    etiqueta: "las credenciales de IBM"
    fuente: "cv.es.yaml · certificaciones cuyo nombre empieza por IBM"
    sustantivos: [credenciales, certificaciones]
    contexto: ["de ibm"]
    ventana: 12   # «de IBM» pegado al sustantivo, o no es este conteo

  - id: credenciales-en-curso
    etiqueta: "las credenciales en curso"
    fuente: "cv.es.yaml · certificaciones con «estado: en curso»"
    sustantivos: [credenciales, certificaciones, rutas]
    contexto: ["en curso", "en desarrollo", "en preparacion", "en preparación"]
    ventana: 20

# ───────────────────────────────────────────────────────────────────────────
# LAS CIFRAS DEL PROPIO REPOSITORIO (2026-09-21)
#
# Por qué nacen. Los ocho conceptos de arriba vigilan lo que el corpus dice del
# CONTENIDO del sitio: cuántas piezas, cuántas credenciales. Ninguno vigilaba lo
# que el corpus dice DEL SITIO COMO OBRA — cuántas decisiones lleva registradas,
# cuántos sprints cerró, de cuántos fragmentos es su índice. Y esas cifras
# envejecen sin que nadie toque el corpus: basta mergear un ADR.
#
# Se descubrió leyendo, no fallando: el 2026-09-21 el corpus afirmaba «21
# decisiones de arquitectura» cuando ya había 24, y afirmaba un índice «de 494
# fragmentos» cuando ya eran 1.437. Dos afirmaciones falsas que seis gates verdes
# no vieron, porque ninguno tenía ese sujeto.
# ───────────────────────────────────────────────────────────────────────────

  - id: decisiones-arquitectura
    etiqueta: "las decisiones de arquitectura registradas en este repositorio"
    fuente: "decisions/NNN-*.md"
    sustantivos: [decisiones]
    # «registradas» entra por un caso real: «25 decisiones registradas solo en este
    # sitio» no lleva «de arquitectura» al lado y se le escapaba al gate, que sí
    # cazó la otra mención del mismo documento. Un gate que caza una de dos deja
    # el corpus contradiciéndose consigo mismo.
    contexto: ["de arquitectura", "arquitectonicas", "registradas"]
    ventana: 22   # el contexto pegado al sustantivo, o habla de otras decisiones

  - id: sprints-cerrados
    etiqueta: "los sprints cerrados de este sitio"
    fuente: "sprints/SPRINT_NNN-summary.md"
    sustantivos: [sprints]
    contexto: ["cerrados"]
    ventana: 16
    # El sujeto tiene que ser ESTE sitio, y se nombra por delante: «este sitio lleva
    # ocho sprints cerrados». Sin esto, el concepto cazaría «24 sprints cerrados»,
    # que son los del PIPELINE ENTERO —las siete casas— y no tienen verdad derivable
    # en este repositorio: su fuente es la planeadora, que es privada.
    contexto_previo: ["este sitio", "este repositorio", "esta aplicacion"]
    ventana_previa: 60
    salvedades:
      - frase: "pipeline"
        razon: "los sprints del pipeline entero se cuentan en la planeadora, no aquí"
      - frase: "fabrica"
        razon: "la Fábrica de AI-APPs coordina las siete casas; su conteo no es el de este repo"

  - id: jobs-ci
    etiqueta: "los jobs de integración continua de este repositorio"
    fuente: ".github/workflows/ci.yml · claves de `jobs:`"
    sustantivos: [jobs, trabajos]
    contexto: ["de integracion continua", "de ci"]
    ventana: 30

  - id: fragmentos-indice
    etiqueta: "los fragmentos del índice del chat en español"
    fuente: "el índice que construye scripts/build-chat-index.mjs"
    sustantivos: [fragmentos]
    # EL SUJETO VA POR DELANTE: «el índice de 1.437 fragmentos». Sin esto, el
    # concepto caza «la recuperación de los cuatro fragmentos», que es el top-k
    # —cuántas fuentes entran a UNA respuesta— y no el tamaño del índice. Mismo
    # sustantivo, tres órdenes de magnitud de diferencia.
    contexto_previo: ["indice de", "indice en", "indice con", "indice tiene", "indice suma"]
    ventana_previa: 24
    salvedades:
      - frase: "fragmentos relevantes"
        razon: "el top-k de una respuesta, no el tamaño del índice"
      - frase: "por respuesta"
        razon: "el top-k de una respuesta, no el tamaño del índice"
      - frase: "recuperacion de los"
        razon: "el top-k de una respuesta, no el tamaño del índice"
    # TOLERANCIA, y por qué. Este número se mueve con CADA edición del corpus:
    # añadir un párrafo lo cambia. Exigirlo exacto haría el gate circular —
    # corriges la cifra, y corregirla mueve la cifra. Con una banda del 5 %, una
    # afirmación honesta del orden de magnitud pasa y una cifra de otra época no.
    tolerancia: 0.05
    # HITOS: la serie histórica del índice es parte del argumento del dueño sobre
    # cómo creció el conocimiento del chat, y es verdad. Se declara para que el
    # gate no la confunda con una afirmación sobre hoy.
    hitos:
      - valor: 28
        razon: "el índice al nacer, solo con los YAML, antes del corpus a fondo"
      - valor: 226
        razon: "lo que aportan las 32 fichas de la vitrina al entrar (ADR-023)"
      - valor: 494
        razon: "el índice con el corpus v2, antes de que v3 ampliara los documentos"
      - valor: 162
        razon: "el índice simulado del sprint 8 (la base en borrador forzada a aprobado), donde se midieron las stopwords"
      - valor: 159
        razon: "el índice del sprint 8 en la primera medición del top-k"

  # ───────────────────────────────────────────────────────────────────────────
  # LAS DOS SUITES DEL CHAT (2026-09-27)
  #
  # El documento del chat se evalúa «con 75 preguntas propias y 136 de afuera», y
  # el banco crece con cada revisión del corpus —una fila nueva por pregunta que
  # el corpus no contestaba— sin que nadie vuelva a ese documento. Lo vio de
  # afuera el harness de hiring: el corpus decía 136 cuando el banco llevaba 146.
  # La verdad sale de los fixtures que corren en la CI. Las cifras de las
  # mediciones fechadas (131 y 48 en el sprint 8; 136 el 20 de septiembre de
  # 2026) son historia y se declaran como hitos.
  # ───────────────────────────────────────────────────────────────────────────

  - id: preguntas-de-afuera
    etiqueta: "las preguntas del banco escritas desde afuera"
    fuente: "tests/fixtures/banco-de-preguntas.es.yaml · lista `preguntas`"
    sustantivos: ["preguntas de afuera", "preguntas escritas desde afuera", "preguntas legitimas", "de afuera"]
    # 136 NO es un hito: es el número que envejeció, y como hito el gate lo
    # habría admitido en presente para siempre. La medición del 20 de septiembre
    # de 2026 que lo usa —la tabla del top-k y su lectura— se salva por su
    # contexto, no por su valor.
    salvedades:
      - frase: "fuentes por respuesta"
        razon: "la tabla del top-k, medida el 20 de septiembre de 2026 sobre el banco de entonces"
      - frase: "con tres fuentes"
        razon: "la lectura de esa misma tabla"
      - frase: "entre esos dos numeros"
        razon: "un subconjunto del banco entre dos puntajes, no el banco entero"
      - frase: "con el umbral en"
        razon: "cuántas bloquearía otro umbral, no el tamaño del banco"
    hitos:
      - valor: 131
        razon: "el banco del sprint 8, con el que se midió el top-k la primera vez"

  - id: preguntas-propias
    etiqueta: "las preguntas de prueba propias del corpus (el golden set)"
    fuente: "data/a-fondo/*.es.md · `preguntas_de_prueba`"
    sustantivos: ["preguntas propias"]
    hitos:
      - valor: 48
        razon: "el golden set del sprint 8, antes de que el corpus creciera a 25 documentos"
