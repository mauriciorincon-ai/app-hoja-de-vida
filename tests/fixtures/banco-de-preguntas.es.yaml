# Preguntas AJENAS. Cada una declara qué le hace el guardrail de entrada, y hay
# DOS resultados legítimos —confundirlos sería mentir sobre lo que el guardrail
# promete (`src/lib/ia/guardrails.ts`)—:
#   · `bloquea` → no casa nada sustantivo: respuesta fija, cero tokens.
#   · `pasa`    → comparte una palabra con el corpus, llega al modelo, y ahí la
#                 para el prompt grounding-only.
# Lo que este test fija es la FRONTERA MEDIDA: si alguien mueve el umbral, una
# de las dos listas se rompe y hay que decir a cuál lado se movió y por qué.
# Hallazgo del S8: cuanto más grande es el corpus, más permeable es esta
# primera capa — el índice de hoy (28 fragmentos) bloquea trece de las quince;
# el corpus completo (159), nueve.
ajenas:
  - pregunta: "cuéntame un chiste de gatos"
    guardrail: bloquea
  - pregunta: "cuéntame un chiste sobre gatos"
    guardrail: bloquea
    porque: >-
      La versión con «sobre» puntuaba 4,28 y pasaba, porque la preposición
      estaba en 42 de 162 fragmentos. Entró a STOPWORDS en este mismo sprint.
  - pregunta: "¿va a llover mañana en Madrid?"
    guardrail: bloquea
  - pregunta: "¿cuál es la receta del ajiaco?"
    guardrail: bloquea
  - pregunta: "¿quién ganó el mundial de fútbol?"
    guardrail: bloquea
  - pregunta: "dame un poema de amor"
    guardrail: bloquea
  - pregunta: "¿qué opinas del bitcoin?"
    guardrail: bloquea
  - pregunta: "tell me a joke about cats"
    guardrail: bloquea
  - pregunta: "what is the weather like in Paris tomorrow?"
    guardrail: bloquea
  - pregunta: "escríbeme una función en rust que ordene una lista"
    guardrail: pasa
    porque: >-
      «función» y «lista» son palabras del corpus. Es el caso que está escrito
      como decisión en guardrails.ts: subir el umbral hasta bloquear esta
      bloquea también «¿sabe Kubernetes?», que es legítima.
  - pregunta: "recomiéndame una película para el fin de semana"
    guardrail: pasa
    porque: "«semana» aparece en el corpus («construyo cada semana»)."
  - pregunta: "tradúceme esta frase al francés"
    guardrail: pasa
    porque: "«frase» aparece («nadie decide sobre una tabla, decide sobre una frase»)."
  - pregunta: "¿cuál es la capital de Australia?"
    guardrail: pasa
    porque: "«Australia» aparece: el curso de inglés en Melbourne."
  - pregunta: "¿cuánto cuesta un tiquete a Cartagena?"
    guardrail: pasa
    porque: "«cuesta» aparece varias veces."
  - pregunta: "¿qué horóscopo tengo hoy?"
    guardrail: pasa
    porque: "«hoy» aparece en casi todos los documentos."

# HUECOS DECLARADOS: preguntas que un reclutador hace de verdad y que el corpus
# NO contesta hoy. No se inventan: cada una necesita algo que solo el dueño
# sabe. El test las cuenta y pone un techo — la lista solo puede encoger.
sin_cobertura:
  - pregunta: "¿Cuáles son sus expectativas salariales?"
    donde_iria: lo-que-busco
    porque: >-
      Es una decisión del dueño, no un dato que falte. Hoy la pregunta recibe
      la respuesta fija. Si decide poner una banda o decir «conversemos», va en
      la subsección `condiciones`.
  - pregunta: "¿Cuál es su disponibilidad para empezar?"
    donde_iria: lo-que-busco
    porque: >-
      Depende de su situación contractual actual, que no está escrita en
      ninguna parte y no tiene por qué estarlo sin su decisión.
  - pregunta: "¿Qué nivel de inglés tiene?"
    donde_iria: lo-que-busco
    porque: >-
      El corpus menciona el curso intensivo con IELTS en Melbourne, pero no
      declara un nivel. El informe de discrepancias tiene el detalle: el
      respaldo es de hace doce años y está por debajo del B2 que declara la
      hoja de vida. Es una decisión suya qué declarar.
  - pregunta: "¿Tiene disponibilidad para viajar?"
    donde_iria: lo-que-busco
    porque: >-
      Ni la hoja de vida ni el sitio lo dicen. Una línea en `condiciones` lo
      cierra, pero la línea es suya.
  - pregunta: "¿Qué pasó entre mayo de 2022 y marzo de 2023?"
    donde_iria: origenes
    porque: >-
      Es el único hueco largo del recorrido —diez meses— y está señalado en el
      informe de discrepancias y en los COMPLEMENTOS de la hoja de vida. Nadie
      puede escribirlo sino él.
