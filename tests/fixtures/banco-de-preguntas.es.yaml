      prefijo trae «reglas», «resultado», «recuperación»… y el fragmento que sí
      habla de R pierde. Se probó y se revirtió. Una pregunta cuya única
      palabra con contenido es una letra suelta es invisible para este chat, y
      está declarado como límite conocido de ADR-010.
