# BANCO DE PREGUNTAS — la prueba del contenido (S8, fase 4b)
#
# Preguntas que hace ALGUIEN DE AFUERA: quien recluta, quien entrevista, quien
# visita el sitio. Cada una declara `espera`: las fuentes que la contestarían
# bien. Con que UNA entre en el top-4 del retriever, la pregunta acierta.
#
# Qué se escribe en `espera`:
#   · el slug de un documento a fondo  → `vesting` casa con a-fondo-vesting-*
#   · el id de un fragmento de los YAML → `estudios`, `perfil`, `contacto`,
#     `skills`, `logros`, `certificaciones`, `trayectoria` (cualquier hito),
#     `casestudy-vesting`, `proyecto-cafam`, `app-velo`…
#
# CÓMO SE AMPLÍA: se agrega la pregunta aquí y se corre `pnpm test`. Si falla,
# hay dos salidas honestas y ninguna es aflojar la expectativa:
#   1. el corpus no dice eso con las palabras de quien pregunta → se corrige el
#      CONTENIDO (la recuperación es léxica: la palabra tiene que existir);
#   2. la pregunta la contesta mejor otro documento → se corrige `espera`.
# Inventar contenido para que pase el gate es la tercera, y está prohibida.
#
# Lo que este banco NO es: no reemplaza al golden set (`a-fondo-golden.test.ts`),
# que exige que cada documento conteste SUS propias preguntas. Aquel usa las
# palabras del documento; este usa las de afuera, y por eso encuentra lo que
# aquel no puede.
#
# El gemelo en inglés (`banco-de-preguntas.en.yaml`) nace cuando existan los
# documentos `.en.md`, es decir cuando el dueño apruebe.

