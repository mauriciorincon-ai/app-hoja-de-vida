# BANCO DE PREGUNTAS EN INGLÉS — el gemelo de banco-de-preguntas.es.yaml (a fondo v2, F5)
#
# Las mismas 136 preguntas de afuera, con las mismas fuentes esperadas (`espera`)
# y las mismas familias, traducidas. Se miden contra el índice INGLÉS simulado —los
# documentos .en.md forzados a aprobado, los YAML en inglés y las fichas— en
# `tests/unit/banco-de-preguntas.test.ts`. Las reglas para ampliarlo son las del
# banco en español: el contenido se corrige, la expectativa no se afloja.
#
# Las ajenas se declaran igual que en español y se miden aparte: el vocabulario
# inglés del corpus es otro, así que «pasa» y «bloquea» pueden diferir.

