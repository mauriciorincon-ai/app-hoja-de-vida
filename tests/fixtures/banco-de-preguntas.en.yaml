ajenas:
  - pregunta: "tell me a joke about cats"
    guardrail: bloquea
  - pregunta: "tell me a joke on cats"
    guardrail: bloquea
  - pregunta: "will it rain in Madrid tomorrow?"
    guardrail: pasa
    porque: >-
      Medida sobre el índice inglés; la nota se completa con la palabra que
      casa.
  - pregunta: "what is the recipe for ajiaco?"
    guardrail: bloquea
    porque: >-
      En español pasa por «receta» en una ficha; las fichas son español-solo y
      «recipe» no aparece en el índice inglés.
  - pregunta: "who won the football world cup?"
    guardrail: pasa
  - pregunta: "write me a love poem"
    guardrail: bloquea
  - pregunta: "what do you think about bitcoin?"
    guardrail: bloquea
  - pregunta: "cuéntame un chiste de gatos"
    guardrail: bloquea
  - pregunta: "¿qué tiempo hará mañana en París?"
    guardrail: pasa
    porque: >-
      Una ajena en español contra el índice inglés: «mañana» está en la ficha
      de Hablemos San, que es español-solo y vive en los dos índices.
  - pregunta: "write a rust function that sorts a list"
    guardrail: pasa
  - pregunta: "recommend me a movie for the weekend"
    guardrail: pasa
  - pregunta: "translate this sentence into French"
    guardrail: pasa
  - pregunta: "what is the capital of Australia?"
    guardrail: pasa
  - pregunta: "how much is a ticket to Cartagena?"
    guardrail: pasa
  - pregunta: "what is my horoscope today?"
    guardrail: pasa

sin_cobertura:
  - pregunta: "What are his salary expectations?"
    donde_iria: lo-que-busco
    porque: "A decision of the owner, not a missing datum: the fixed reply answers it today."
  - pregunta: "When is he available to start?"
    donde_iria: lo-que-busco
    porque: "Depends on his contractual situation today, which is written nowhere and need not be unless he decides so."
  - pregunta: "Is he available to travel?"
    donde_iria: lo-que-busco
    porque: "Neither the CV nor the site says it; one line in `condiciones` closes it, and the line is his."
