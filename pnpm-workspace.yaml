# Overrides de SEGURIDAD (regla 17: van aquí, jamás en package.json).
#
# Todas son dependencias TRANSITIVAS de herramienta —eslint, @sentry/nextjs y
# el CLI de shadcn—: ninguna la declara esta app. Se fijan a la primera versión
# parcheada DENTRO DE SU MISMA MAYOR, para no cambiar de API por la puerta de
# atrás. `brace-expansion`, `js-yaml` y `nanoid` conviven en dos mayores en el
# árbol, así que cada una se ancla por separado.
#
# Al tocar esto: leer la salida de `pnpm install` y comprobar dependencia por
# dependencia que quedó la versión MÁS NUEVA — pnpm degrada en silencio y la CI
# pasa verde porque ninguna puerta compara el resultado contra la INTENCIÓN.
overrides:
  'brace-expansion@1': ^1.1.20
  'brace-expansion@>=4': ^5.0.11
  fast-uri: ^3.1.6
  sharp: ^0.35.0
  postcss: ^8.5.18
  undici: ^7.29.1
  ip-address: ^10.3.1
  'js-yaml@4': ^4.3.2
  'nanoid@3': ^3.3.18
  browserslist: ^4.28.7

# Aviso SIN PARCHE publicado, ignorado por decisión del dueño (2026-10-04).
# `braces` <=3.0.3, GHSA-vfj7-8cjw-p6xm (actualizado 2026-10-02): GitHub declara
# `first_patched_version: null` y npm no tiene 3.0.4, así que no cabe override.
# Llega solo por herramienta (shadcn CLI y eslint-plugin-next, vía fast-glob →
# micromatch) y su entrada son patrones que escribe el repo, nunca un visitante.
# Se quita en cuanto exista `braces@3.0.4`: entonces va como override
# `'braces@3': ^3.0.4`, igual que los de arriba.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm

allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  sharp: true
  unrs-resolver: true
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
