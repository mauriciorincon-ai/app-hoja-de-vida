# CI del kit-app — corre en cada PR y en push a main.
# Gates: typecheck, lint, tests+cobertura, build, audit de deps, e2e, Lighthouse
# vs perf-budget.json, e integración con Postgres real (Supabase) para la votación.
name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 11 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm peers check    # único gate que ve un peer insatisfecho (kit v1.24.0)
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test            # vitest run --coverage (umbral 70% en vitest.config)
      - run: pnpm build
      - run: pnpm audit --audit-level high

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 11 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e        # incluye scans axe (@axe-core/playwright); la
                                  # votación corre en modo "no disponible" sin BD
                                  # (el gate real-vote vive en el job integration)
      # Un rojo en CI que no se reproduce local es ciego sin sus trazas: el
      # primer reintento graba trace (playwright.config `on-first-retry`) con
      # consola, errores y DOM — se sube solo cuando algo falla (2026-09-10).
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Votación con Postgres REAL (S4): la única capa de datos de la app.
  # Patrón wiki/patterns/supabase-en-ci-y-cloud.md (impuesto K1–K6 ya pagado).
  integration:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 11 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v3
        with: { version: latest }
      - name: Supabase local (aplica migraciones al arrancar)
        run: supabase start
      - name: Exportar env de Supabase al job
        # `supabase status -o env` ENTRECOMILLA los valores: el sed los quita o
        # createClient rechaza la URL con error opaco (antídoto K3).
        run: |
          supabase status -o env | sed 's/="/=/; s/"$//' > /tmp/sb.env
          source /tmp/sb.env
          echo "SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
      - name: Humo de la credencial (una URL/key inválida se descubre YA)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "$SUPABASE_URL/rest/v1/" \
            -H "apikey: $SUPABASE_ANON_KEY")
          echo "REST → $code"; test "$code" = "200"
      - name: Tests contra Postgres real (route + cliente)
        env:
          DISABLE_RATE_LIMIT: "1"   # en CI todo sale de localhost
        run: pnpm test:db
      - run: pnpm exec playwright install --with-deps chromium
      - name: e2e de votación en el navegador contra Postgres real
        # SUPABASE_URL/ANON_KEY viajan por process.env al webServer de Playwright;
        # el gate "votar sube el contador real" corre de verdad (no se salta).
        run: pnpm exec playwright test votacion.spec.ts

  lighthouse:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 11 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Lighthouse CI — recolección (3 corridas por URL)
        # Solo páginas PÚBLICAS (wiki: lighthouse-solo-paginas-publicas). La lista
        # vive en lighthouse-urls.json y NO en este YAML: las dos aserciones de abajo
        # juzgan lo recolectado, así que una sola lista evita que se desincronicen.
        # El budget (ADR-006) cubre las rutas del S4 (roadmap en /es/vitrina/apps,
        # brochures) y del S7 (un escaparate no-app y una de sus fichas — son
        # plantillas, basta una de cada).
        # S8: la raíz «/» salió de la lista y entró «/es». La raíz es un 307 que
        # resuelve el Accept-Language del runner, así que medía /en unas veces y el
        # salto otras — la única fila que variaba de la tabla (89 en una corrida suelta,
        # 90/91/91 en tres). Un presupuesto de performance no es el sitio para vigilar
        # un redirect; que HOY no lo vigile nadie más queda inventariado en la bitácora
        # del S8 (fase 0) como superficie sin prueba, no disimulado aquí.
        # TRES corridas y aserción sobre la MEDIANA (kit v1.26.0): una corrida no mide.
        run: |
          npm i -g @lhci/cli
          URLS=$(jq -r '.[] | "--url=http://localhost:3000" + .' lighthouse-urls.json)
          lhci collect --startServerCommand="pnpm start" --numberOfRuns=3 $URLS
      - name: Aserción contra perf-budget.json (mediana de 3)
        run: lhci assert --config=./lighthouse-budget.json
      - name: Aserción de categorías >=90 (mediana de 3)
        # La casilla «>=90 en las cuatro categorías» de /deploy-check §8 se afirmaba
        # desde el S1 sin que NADIE la midiera: el budget mide tiempos y pesos, que es
        # otra cosa. Este paso es el que la paga.
        run: lhci assert --config=./lighthouse-categorias.json
