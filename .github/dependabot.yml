# Estampado del kit-app (kit v1.23.1) — adoptado en el Sprint 005.
# REGLA DEL USUARIO (2026-08-22, regla 18 del CLAUDE.md): máximo DOS PRs de dependencias
# abiertos a la vez — jamás una lista de merges pendientes. Un PR agrupado por ecosistema.
# (Un limit 5 POR ecosistema daría hasta 10 abiertos, y la primera activación vuelca el
# atraso entero de golpe: produjo una cola de 6 en Innmobiliaria.)
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      todo-npm:
        patterns: ["*"]
    # Mayores que el ecosistema aún no alcanza (2026-09-05, PR #10): ESLint 10
    # no lo soportan eslint-plugin-import/react/jsx-a11y, y TypeScript 7 queda
    # fuera del rango de typescript-eslint 8.x (<6.1). Metidos en el grupo,
    # `pnpm peers check` pone rojo el PR entero y bloquea los otros 36 bumps.
    # Se retira cada ignore cuando sus plugins publiquen soporte.
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      todo-actions:
        patterns: ["*"]
