# Capturas de Nutrikids — pedido 026 (planeadora, 2026-10-27). Build de producción de
# origin/main 69538dc, viewport 1024×640 a DPR 1,5 (archivo 1536×960), con el tema propio de la app: el claro
# (crema y terracota) de su design-system, el único que declara; ya sin tema-cv-viva.mjs. Pantallas reales de la app corriendo.
# Retomadas el 2026-10-28 por decisión del dueño («3a»): la portada y las 17 capturas, en los mismos estados.
# Datos 100 % sintéticos: la «Dieta demo» inventada del repo y un plan sintético derivado
# de ella; el registro y las notas son de ejemplo. Reloj fijo en lunes 2026-09-21,
# dentro de la ventana de la restricción demo. F18 va en inglés a propósito: es el cambio de idioma.
# Reentrega 2026-10-28: F3 con el mismo plan sintético, corto en rojo (1 restringido, 1 «también evitar»,
# los 3 aditivos), para que la pestaña Rojo y los aditivos quepan en un cuadro; F16 en la demo, sin dieta cargada.
