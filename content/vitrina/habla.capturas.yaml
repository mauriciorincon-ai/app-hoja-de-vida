# Capturas de Habla San (pedido 026, planeadora, 2026-10-27). Build de producción de 6c4d113 en
# una copia aislada; viewport 1024×640 a deviceScaleFactor 1.5 (WebP de 1536×960), tema claro de la
# app e interfaz en español. Perfil 100 % sintético («Pipo», temas genéricos), historial y sesiones
# fabricados, banco de voz = WAV de silencio inyectado; el micrófono es el falso de Chromium con los
# WAV sintéticos de las pruebas e2e. Ningún nombre, voz, foto ni audio de un niño real.
# Los pictogramas de 06, 07 y 11 son de ARASAAC (Sergio Palao, Gobierno de Aragón, CC BY-NC-SA):
# su pie lleva la atribución.
portada: entrada.webp
