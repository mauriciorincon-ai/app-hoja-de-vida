# Capturas de CV Viva — entrega 028 (planeadora, 2026-10-31). Build de producción de una copia aislada de `b9acf15`
# (main tras el #106), servida en local con el entorno de sus e2e: sin Supabase, sin correo y con el chat simulado;
# el modo mantenimiento (CV-24), de otra build de la misma copia con MANTENIMIENTO=on. Tomas con propósito: cada
# pieza completa, centrada sobre el fondo de la app, con margen, y ampliada hasta llenar el lienzo (a DPR 3, en el
# ancho de ventana que más llena); interfaz en español, tema claro. Contenido real del sitio público del dueño; los
# votos del roadmap, con la base vacía (sin votos). El botón flotante del chat se oculta: tiene su propia entrega.
