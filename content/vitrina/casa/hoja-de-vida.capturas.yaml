# Capturas de CV Viva — entrega 028 (planeadora, 2026-10-31). Build de producción de una copia aislada de `b9acf15`
# (main tras el #106), servida en local con el entorno de sus e2e: sin Supabase, sin correo y con el chat simulado;
# el modo mantenimiento (CV-24), de otra build de la misma copia con MANTENIMIENTO=on. Tomas con propósito: cada
# pieza completa, centrada sobre el fondo de la app, con margen, y ampliada hasta llenar el lienzo (a DPR 3, en el
# ancho de ventana que más llena); interfaz en español, tema claro. Contenido real del sitio público del dueño; los
# votos del roadmap, con la base vacía (sin votos). El botón flotante del chat se oculta: tiene su propia entrega.
# Reentrega 2026-11-01 (tras el 028 y el 029): CV-02, CV-03, CV-05, CV-09, CV-10 y CV-13 se retomaron de una copia aislada
# de `c3e4d2c` (main tras el #108), con el mismo entorno y el mismo ancho de ventana de cada una; Skills (CV-05) con el
# azar sembrado y el movimiento reducido, para que salga igual cada vez. Las demás salen iguales píxel a píxel en c3e4d2c.
# Segunda reentrega 2026-11-01 (tras el 030 y el 031): CV-10, CV-11, CV-12, CV-16, CV-17 y CV-18 se retomaron de una copia aislada
# de `5ead9d6` (main tras el #111), con el mismo entorno: la página de cada app es su brochure, y el roadmap, las propuestas y
# la lista de espera viven en «Úsala», su cierre. Las demás salen iguales en 5ead9d6 (CV-04 y CV-06, corridas 2 px por la
# animación de entrada, con el mismo contenido).
