# Capturas del chat de CV Viva — entrega 028 (planeadora, 2026-10-31). Build de producción de una copia aislada de
# `b9acf15` (main tras el #106), servida en local con el entorno de sus e2e: el proveedor simulado (`CHAT_PROVIDER=mock`,
# src/lib/ia/mock-model.ts), la puerta en memoria con código fijo y sin correo ni Supabase. Cero llamadas a un modelo
# real: el texto de las respuestas de CH-01 y CH-03 es el del proveedor simulado; las fuentes, las que recupera el índice
# real del build; las respuestas fijas (CH-04, CH-05, CH-06), las del código. CH-07, con el proveedor caído
# (CHAT_MOCK_MODE=error); CH-12, con CHAT_TOPE_DIARIO=1. Quien pregunta se registra como «Visitante». El panel es fijo:
# se toma en coordenadas de la ventana (1280 × 800, donde llega a su alto máximo) y se compone a DPR 3 sobre el fondo
# de la app, con margen; interfaz en español, tema claro. La portada es la ventana entera, con el panel sobre la HOME.
portada: entrada.webp
