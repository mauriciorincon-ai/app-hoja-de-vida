  - { funcionalidad: E4, archivo: E4.webp, pie: { es: "Solo audio: la banda se reduce a una línea mientras te lee la ficha", en: "Audio only: the band shrinks to one line while it reads you the card" } }
  - { funcionalidad: V1, archivo: V1.webp, pie: { es: "La banda abajo, protegida en Meet, mientras tomas notas", en: "The band at the bottom, protected in Meet, while you take notes" } }
