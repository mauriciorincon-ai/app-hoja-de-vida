# Capturas del pedido 026 de AngelGhost: el build del frontend (vite preview) con los datos sintéticos de la app
# (clientes «Páramo Azul» y «Sur del Valle», del kit de muestra), sin Rust, sin audio y sin modelo. Viewport 1024×640 a
# DPR 1.5 (archivo 1536×960), tema claro, interfaz en español; macOS salvo L4 (la muestra de Windows de la app).
# Las que muestran la banda la ponen a su alto real sobre el cuaderno, que va a escala sobre el escritorio: son dos
# ventanas reales del build en una misma imagen.
portada: entrada.webp
capturas:
  - { funcionalidad: N1, archivo: N1.webp, pie: { es: "Honestidad: qué vive en memoria ahora y cuántos bytes salieron: cero", en: "Honesty: what lives in memory right now and how many bytes left: zero" } }
  - { funcionalidad: N2, archivo: N2.webp, pie: { es: "Tus reuniones guardadas: cifradas y con fecha de borrado", en: "Your saved meetings: encrypted and with a deletion date" } }
  - { funcionalidad: N3, archivo: N3.webp, pie: { es: "La bandeja: decides qué guardar antes de que la cuenta llegue a cero", en: "The tray: you decide what to keep before the countdown hits zero" } }
