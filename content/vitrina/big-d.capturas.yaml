# Capturas de Big-D para CV Viva — pedido 026, planeadora, 2026-10-27. Base: app-big-d origin/main 84aa911, export
# estático (build de producción) servido en la copia aislada. Tomas con propósito (2026-10-31): cada pieza completa, centrada sobre el fondo de la app, con margen, y ampliada hasta llenar el lienzo de 1536×960 (a DPR 3, en el ancho de ventana que más llena); la portada, página arriba;
# tema claro, interfaz en español. Datos: los del repo (documentación pública de los fabricantes y el hospital
# ficticio); F11 sale de la base sembrada de la app (plataformas ficticias Norte, Sur y Ejemplo); F6, de la propuesta real
# de evidencias de Snowflake del 2026-10-05 reabierta como pendiente en la copia (carpeta «-ensayo»).
# F15–F21 (2026-11-14, para el PR de contenido del S10): base app-big-d 4299759 en copia aislada (git archive), build con
# BIGD_FECHA_CONSULTA=2026-11-12, 1024×640 a DPR 1,5 (1536×960), solo el área visible, tema claro, en español. F15 sale de la
# base sembrada (la única con dos instantáneas; ficticia); F21, del paquete de la demo (huella inicial c0633ab23044). F19 no
# tiene pantalla propia: es un comando que una persona corre y su resultado se ve dentro de la propuesta de F6.
