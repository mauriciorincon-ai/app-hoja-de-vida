# Las simulaciones de las apps (2026-10-12).
#
# Algunas apps del pipeline no se publican como producto (la app es privada),
# pero su casa entrega una SIMULACIÓN estática que CV Viva publica: un paquete
# de páginas que se copia tal cual a `public/piezas/<carpeta>/` y se muestra
# dentro de este sitio, en `/vitrina/apps/<slug>/simulacion`, en un marco.
# La planeadora lo pidió así para planlang (SPRINT_002) y Big-D (C21): «página
# SSG en iframe del mismo sitio».
#
# Reglas (las hace cumplir src/lib/vitrina/simulaciones.ts y su test):
#  · `slug` es el de una app con export en content/vitrina/; si no, el build
#    falla nombrándolo.
#  · `entrada` es el archivo .html con el que abre, por idioma, relativo a
#    `public/piezas/<carpeta>/`; si no existe, el build falla nombrándolo.
#    Siempre un .html: el enrutador de idiomas manda a 404 cualquier ruta sin
#    punto, así que una carpeta suelta no se sirve.
#  · `nota` es una frase de CV Viva sobre lo que el visitante va a ver.
#
# Agregar una simulación = copiar el paquete a public/piezas/<carpeta>/ y una
# entrada aquí. Sin tocar código: la ficha gana su botón y la ruta existe sola.

simulaciones:
  - slug: planlang
    carpeta: planlang
    entrada:
      es: es.html
      en: en.html
    nota:
      es: "La vitrina de planlang tal como la entrega su casa: el plan, el agente y la brecha de dos demos, caso por caso, y un playground para mover umbrales. Las decisiones humanas se simularon en lote; nada se ejecuta al visitarla."
      en: "planlang's showcase as its house delivers it: the plan, the agent and the gap of two demos, case by case, and a playground to move thresholds. Human decisions were simulated in batch; nothing runs when you visit it."
