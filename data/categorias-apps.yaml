# Las dos categorías de las apps del portafolio (Sprint 009, 2026-10-06).
#
# /portafolio/apps las muestra en dos bloques: PROFESIONALES primero (encabezado
# mayor) y PERSONALES después. Cada app se clasifica aquí por su `slug`, que es
# el de su `content/vitrina/<slug>.brochure-export.json`.
#
# Reglas (las hace cumplir src/lib/vitrina/categorias-apps.ts y su test):
#  · El ORDEN de cada lista es el orden en la página. El de las profesionales es el
#    que pidió el dueño en la revisión del H-2 (OM-27, 2026-10-29); lo fija su test.
#  · Un export SIN categoría rompe el build y nombra el slug: una app nueva se
#    clasifica el mismo día que llega, o no se publica.
#  · Un slug declarado SIN export se ignora: aparece solo el día que llega su
#    export (así entraron AngelGhost, planlang, Big-D y HackGuard el 2026-10-11).
#  · Un slug no puede estar en las dos listas.
#
# `nombre` es el NOMBRE OFICIAL de la app, UNO solo, igual en español y en inglés
# y en todo el sitio (ADR-028). El export no se edita (regla de content/), así
# que el alias vive aquí y el loader del portafolio lo aplica al leerlo: de ahí lo
# heredan el escaparate, la ficha, el detalle, las vecinas, el manifest, el chat,
# los correos y el PDF. Los textos propios (`data/**`) usan este mismo nombre, y
# un test falla si vuelve a colarse el del export.

profesionales:
  - slug: ds
    nombre: "Probeta DS"
  - slug: planlang
    nombre: "planlang"
  - slug: hackguard
    nombre: "HackGuard"
  - slug: anonimizador
    nombre: "Anonimizador Velo"
  - slug: big-d
    nombre: "Big-D"
  - slug: dash-agent-ai
    nombre: "Dash Agent"
  - slug: copiloto-consultor
    nombre: "AngelGhost"

personales:
  - slug: habla
    nombre: "Habla San"
  - slug: inmobiliaria
    nombre: "Innmobiliaria"
  - slug: nutri-kids
    nombre: "Nutrikids"
