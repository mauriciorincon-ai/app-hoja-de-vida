        nivel: uso-real
        texto:
          es: "Se definió, documentó y validó el proceso core de once etapas con el que una startup construyó 27 agentes para 12 clientes sobre n8n, y se diseñó en Microsoft Fabric la plataforma que llegó a vigilar 23 a la vez, en tiempo real."
          en: "The eleven-stage core process that a startup used to build 27 agents for 12 clients on n8n was defined, documented and validated, and the platform that came to watch 23 at once, in real time, was designed in Microsoft Fabric."
