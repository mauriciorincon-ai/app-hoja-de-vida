          en: "Creates measures, columns and relationships through the modeling MCP server, testing every measure in DAX, and writes the report in Power BI’s native JSON; 20 criteria and 5 human gates, and no run closes without a person approving the render."
        corpus: [los-agentes-de-la-vitrina]
        href: /vitrina/agentes/constructor-tableros-powerbi
      - nombre: { es: "Experto ISO 42001", en: "ISO 42001 Expert" }
