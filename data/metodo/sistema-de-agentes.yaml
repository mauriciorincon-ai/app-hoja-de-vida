  # ─── 9 · Lo que haría distinto y lo que no he hecho ─────────────────────────
  - n: 9
    limites:
      - voz: hice
        texto:
          es: "La palabra «producción» se reserva para los 27 agentes de Vesting. Los de ARKHÉ y los de la vitrina son sistemas de trabajo de uso personal: no han tenido usuarios distintos de su autor."
          en: "The word “production” is reserved for the 27 agents at Vesting. The ones in ARKHÉ and in the showcase are personal-use work systems: they have had no users other than their author."
        corpus: [agentes-en-produccion, los-agentes-de-la-vitrina]
      - voz: hice
        texto:
          es: "Las cifras de ARKHÉ son cálculos propios del autor, sin un artefacto publicado: miden menos contexto inútil y más obediencia a la especificación, no la calidad en abstracto, y no sirven para comparar con otro ecosistema sin repetir los mismos escenarios."
          en: "The ARKHÉ figures are the author’s own calculations, with no published artifact: they measure less useless context and more adherence to the specification, not quality in the abstract, and they cannot be compared with another ecosystem without rerunning the same scenarios."
        corpus: [agentes-en-produccion]
      - voz: hice
        texto:
          es: "Con Microsoft Agent Framework y Claude Agent SDK hay experimentación y prototipos, no producción. El autor trabaja con el ecosistema de LangChain en la Fundación CTIC, sin un entregable publicado aquí."
          en: "With Microsoft Agent Framework and the Claude Agent SDK there has been experimentation and prototypes, not production. The author works with the LangChain ecosystem at Fundación CTIC, with no deliverable published here."
        corpus: [fundacion-ctic]
      - voz: hice
        texto:
          es: "El autor no ha operado agentes en contenedores: Docker y Kubernetes en producción no están en su experiencia profesional."
          en: "The author has not run agents in containers: Docker and Kubernetes in production are not part of the author’s professional experience."
        corpus: [plataforma-y-despliegue]
      - voz: hice
        texto:
          es: "Con Microsoft Foundry, la experiencia es el adaptador de proveedor del chat de este sitio y el estudio del AI-103, que está en curso; un sistema de agentes alojado allí no forma parte de la experiencia del autor."
          en: "With Microsoft Foundry, the experience is the provider adapter in this site’s chat and studying for the AI-103, which is in progress; an agent system hosted there is not part of the author’s experience."
        corpus: [rag-y-el-chat, certificaciones]
      - voz: hice
        texto:
          es: "FORJA tiene su demostrador —compilador, cinco procesos, línea base y compuertas de aprobación—, pero que los profesionales lo usen se demuestra con profesionales, y esa prueba falta."
          en: "FORJA has its demonstrator —compiler, five processes, baseline and approval gates—, but whether professionals use it can only be shown with professionals, and that test is still missing."
        corpus: [las-investigaciones]
      - voz: posicion
        texto:
          es: "Lo que conviene hacer distinto hoy: trazas con un estándar abierto desde el primer agente, para seguir una sesión aunque cruce frameworks, y la conversación entera evaluada en línea, no solo antes de publicar."
          en: "What should be done differently today: traces on an open standard from the very first agent, so a session can be followed even when it crosses frameworks, and the whole conversation evaluated online, not only before release."
      - voz: posicion
        texto:
          es: "Y no conviene empezar por un grafo de muchos agentes: mejor empezar con uno, medirlo contra una línea base y solo repartir el trabajo donde el contexto o el paralelismo lo justifiquen."
          en: "And it is better not to start with a graph of many agents: start with one, measure it against a baseline and only split the work where context or parallelism justify it."

