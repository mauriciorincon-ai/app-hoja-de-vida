# «MI MÉTODO» · T3 — Cómo hago que un LLM responda con los datos de la empresa y no invente (S11, 2026-10-18).
#
# Tres voces, separadas por el esquema (src/lib/metodo/schema.ts):
#   · voz: hice      → solo lo que dice el corpus del sitio; `corpus:` nombra el documento de data/a-fondo/.
#   · voz: campo     → lo que el campo hace en 2025–2026; `fuentes:` numera la fuente del bloque 10.
#   · voz: posicion  → mi criterio, rotulado como tal; sin fuente ni corpus.
# Lo que va sin voz (bloques 1, 2, 6, 7 y la base de las fases) es el método mismo: mi posición sobre cómo se hace.
#
# Investigación del 2026-10-18: documentación oficial primero (Microsoft Learn, Anthropic, OWASP), solo contenido
# público servido al navegador, sin credenciales ajenas ni endpoints de terceros. Un resultado de búsqueda de la
# documentación de LangSmith traía por título texto dirigido a agentes («Documentation Index»): no se abrió, se ignora y
# queda anotado en el cierre del sprint. La evidencia sale solo de `rag-y-el-chat` (y de `certificaciones` para el
# AI-103) y del propio chat, que se puede abrir y probar. Límites con las palabras del corpus: sin embeddings ni base
# vectorial por decisión escrita (un argumento, no una experiencia), sin juez automático de la respuesta, sin validador
# de citas por frase. Ninguna cifra que se mueva sola con el corpus (el tamaño del índice, el tamaño del banco): las de
# aquí son mediciones fechadas o configuración, y el gate de cifras las ata a su documento.

id: T3
slug: rag-sin-inventar
nombre:
  es: "Cómo hago que un LLM responda con los datos de la empresa y no invente"
  en: "How I make an LLM answer with the company’s data, and not make things up"
bloques:
  # ─── 1 · La pregunta ────────────────────────────────────────────────────────
  - n: 1
    pregunta:
      es: "¿Cómo garantizas que el modelo responda con nuestros datos y no alucine, y cómo lo mides?"
      en: "How do you make sure the model answers with our data and does not hallucinate, and how do you measure it?"
    respuesta:
      - es: "No le pido al modelo que recuerde: el conocimiento vive en contenido versionado que se indexa antes de la pregunta, y el modelo solo recibe los pocos fragmentos que la recuperación eligió, cada uno con su procedencia."
        en: "I do not ask the model to remember: the knowledge lives in versioned content that is indexed before the question, and the model only receives the few passages that retrieval picked, each with its provenance."
      - es: "Pongo controles en capas, los baratos primero —alcance, validación, recuperación, instrucciones—, y cada respuesta cita fuentes que navegan a algo visible, para que quien lee pueda comprobarla."
        en: "I put controls in layers, the cheap ones first —scope, validation, retrieval, instructions—, and every answer cites sources that lead to something visible, so whoever reads it can check it."
      - es: "Lo mido en cada cambio con dos conjuntos de preguntas, uno propio y otro escrito desde afuera, contra el mismo buscador que corre en producción: hasta cuántas fuentes entran a una respuesta sale de esa medición, no del gusto."
        en: "I measure it on every change with two sets of questions, one of my own and one written from the outside, against the same search that runs in production: even how many sources go into an answer comes from that measurement, not from taste."

  # ─── 2 · El mapa ────────────────────────────────────────────────────────────
  - n: 2
    titulo:
      es: "De lo publicado a una respuesta que se puede verificar"
      en: "From what is published to an answer that can be checked"
    resumen:
      es: "El contenido versionado del sitio se compila en el build a un índice por idioma, con fragmentos acotados y destinos que existen. Una pregunta pasa primero por controles baratos —frecuencia, esquema, puerta— y por un filtro de alcance: si no casa nada sustantivo, recibe un mensaje fijo sin llamar al modelo. Si casa, la recuperación toma del índice los fragmentos más relevantes y el servidor se los entrega numerados, junto con sus propias instrucciones, a un modelo que se elige por configuración. La respuesta cita esas fuentes y quien lee las abre a un clic. Si el proveedor falla, el navegador busca en el mismo índice y lo dice. Dos conjuntos de preguntas evalúan la recuperación en cada cambio y fijan cuántas fuentes entran."
      en: "The site’s versioned content is compiled at build time into one index per language, with bounded passages and destinations that exist. A question first goes through cheap controls —rate, schema, gate— and a scope filter: if nothing substantive matches, it gets a fixed message without calling the model. If something matches, retrieval takes the most relevant passages from the index and the server hands them over, numbered, together with its own instructions, to a model chosen by configuration. The answer cites those sources and whoever reads opens them in one click. If the provider fails, the browser searches the same index and says so. Two sets of questions evaluate retrieval on every change and set how many sources go in."
    nodos:
      - n: 1
        etiqueta: { es: "Contenido versionado", en: "Versioned content" }
        tipo: dato
        col: 0
        fila: 0
        detalle:
          es: "Lo que el sitio publica: datos del currículum, documentos aprobados, fichas. Lo que no está publicado no existe para el chat."
          en: "What the site publishes: résumé data, approved documents, showcase sheets. What is not published does not exist for the chat."
      - n: 2
        etiqueta: { es: "Índice del build", en: "Build-time index" }
        tipo: dato
        col: 1
        fila: 0
        detalle:
          es: "Fragmentos acotados, con título, idioma y destino navegable. Si un destino no existe o un documento no valida, el build falla."
          en: "Bounded passages, with title, language and a navigable destination. If a destination does not exist or a document fails validation, the build fails."
      - n: 3
        etiqueta: { es: "Evaluación en cada cambio", en: "Evaluation on every change" }
        tipo: control
        col: 3
        fila: 0
        detalle:
          es: "Preguntas propias y preguntas escritas desde afuera, contra el índice real y el mismo buscador de producción."
          en: "Questions of my own and questions written from the outside, against the real index and the same search used in production."
      - n: 4
        etiqueta: { es: "Pregunta", en: "Question" }
        tipo: externo
        col: 0
        fila: 2
        detalle:
          es: "Lo que escribe quien visita, en español o en inglés."
          en: "What the visitor writes, in Spanish or in English."
      - n: 5
        etiqueta: { es: "Controles de entrada", en: "Input controls" }
        tipo: control
        col: 1
        fila: 2
        detalle:
          es: "Límite de frecuencia, esquema estricto del mensaje y la puerta: cuestan casi nada y van primero."
          en: "Rate limit, a strict message schema and the gate: they cost almost nothing and go first."
      - n: 6
        etiqueta: { es: "Filtro de alcance", en: "Scope filter" }
        tipo: control
        col: 2
        fila: 2
        detalle:
          es: "Una búsqueda estricta en el índice: si nada sustantivo casa, responde un mensaje fijo sin llamar al modelo."
          en: "A strict search over the index: if nothing substantive matches, it replies with a fixed message without calling the model."
      - n: 7
        etiqueta: { es: "Recuperación", en: "Retrieval" }
        tipo: actor
        col: 3
        fila: 1
        detalle:
          es: "Toma los fragmentos más relevantes, numerados, y nada más del sitio."
          en: "Takes the most relevant passages, numbered, and nothing else from the site."
      - n: 8
        etiqueta: { es: "Instrucciones del servidor", en: "Server instructions" }
        tipo: control
        col: 3
        fila: 3
        detalle:
          es: "Compuestas fuera del alcance de quien pregunta: usar solo las fuentes, no inventar fechas ni resultados, rechazar los intentos de cambiar las reglas."
          en: "Composed out of the asker’s reach: use only the sources, never make up dates or results, refuse attempts to change the rules."
      - n: 9
        etiqueta: { es: "Modelo intercambiable", en: "Swappable model" }
        tipo: externo
        col: 4
        fila: 1
        detalle:
          es: "Un proveedor elegido por configuración —Groq, Gemini, Azure a través de Microsoft Foundry (antes Azure AI Foundry), Claude o uno compatible con OpenAI—: cambia quien redacta, no los hechos."
          en: "A provider chosen by configuration —Groq, Gemini, Azure through Microsoft Foundry (formerly Azure AI Foundry), Claude or an OpenAI-compatible one—: who writes changes, the facts do not."
      - n: 10
        etiqueta: { es: "Respuesta con citas", en: "Answer with citations" }
        tipo: dato
        col: 5
        fila: 1
        detalle:
          es: "Dos o tres párrafos y las fuentes que el modelo tuvo delante, cada una con su destino."
          en: "Two or three paragraphs and the sources the model had in front of it, each with its destination."
      - n: 11
        etiqueta: { es: "Búsqueda local", en: "Local search" }
        tipo: control
        col: 4
        fila: 3
        detalle:
          es: "Si el proveedor falla, el navegador busca en el mismo índice y rotula el resultado como búsqueda local, no como respuesta del modelo."
          en: "If the provider fails, the browser searches the same index and labels the result as a local search, not as the model’s answer."
      - n: 12
        etiqueta: { es: "Quien lee", en: "The reader" }
        tipo: humano
        col: 5
        fila: 3
        detalle:
          es: "Abre cada fuente a un clic y juzga si respalda lo que se dijo."
          en: "Opens each source in one click and judges whether it backs what was said."
    aristas:
      - { de: 1, a: 2, etiqueta: { es: "se compila", en: "compiled" } }
      - { de: 2, a: 7, etiqueta: { es: "fragmentos con destino", en: "passages with destinations" } }
      - { de: 3, a: 7, etiqueta: { es: "fija cuántas fuentes", en: "sets how many sources" } }
      - { de: 4, a: 5 }
      - { de: 5, a: 6 }
      - { de: 6, a: 7, etiqueta: { es: "casó algo", en: "something matched" } }
      - { de: 7, a: 9, etiqueta: { es: "fragmentos numerados", en: "numbered passages" } }
      - { de: 8, a: 9, etiqueta: { es: "reglas", en: "rules" } }
      - { de: 9, a: 10, etiqueta: { es: "redacta y cita", en: "writes and cites" } }
      - { de: 10, a: 12, etiqueta: { es: "verifica", en: "checks" } }
      - { de: 9, a: 11, etiqueta: { es: "si falla", en: "if it fails" } }
      - { de: 11, a: 12, etiqueta: { es: "lo dice", en: "says so" } }

  # ─── 3 · Las fases ──────────────────────────────────────────────────────────
  - n: 3
    fases:
      - nombre: { es: "Decidir qué sabe el sistema", en: "Decide what the system knows" }
        entradas:
          - { es: "El contenido que la organización ya publica o aprueba.", en: "The content the organization already publishes or approves." }
          - { es: "Quién puede ver cada cosa.", en: "Who is allowed to see each thing." }
        actividades:
          - es: "Listar las fuentes autorizadas y dejar fuera lo que no lo está."
            en: "List the authorized sources and leave out whatever is not."
          - es: "Dar a cada documento un estado: un borrador no se indexa."
            en: "Give every document a status: a draft is not indexed."
          - es: "Escribir cada hecho con su fuente; lo que falta se pregunta, no se rellena."
            en: "Write every fact with its source; what is missing gets asked, not filled in."
        artefactos:
          - { es: "El corpus versionado, con estado por documento.", en: "The versioned corpus, with a status per document." }
          - { es: "La lista de fuentes autorizadas.", en: "The list of authorized sources." }
        decide: { es: "Quien es dueño del contenido.", en: "Whoever owns the content." }
        control: { es: "Un documento en borrador no entra al índice; uno aprobado exige su gemelo en el otro idioma.", en: "A draft document does not enter the index; an approved one requires its twin in the other language." }
        nota:
          voz: campo
          texto:
            es: "Para los sistemas de recuperación, OWASP recomienda controles de acceso finos con almacenes que respeten los permisos, y canales robustos de validación para las fuentes de conocimiento."
            en: "For retrieval systems, OWASP recommends fine-grained access controls with permission-aware stores, and robust validation pipelines for knowledge sources."
          fuentes: [13]
      - nombre: { es: "Fragmentar e indexar por estructura", en: "Chunk and index by structure" }
        entradas:
          - { es: "El corpus aprobado.", en: "The approved corpus." }
        actividades:
          - es: "Cortar por la estructura del documento —la subsección—, con un tope de tamaño medido sobre el corpus real."
            en: "Cut along the document’s structure —the subsection—, with a size cap measured on the real corpus."
          - es: "Partir lo que pasa del tope en ventanas que conservan la misma ancla."
            en: "Split whatever exceeds the cap into windows that keep the same anchor."
          - es: "Guardar con cada fragmento su título, su idioma y el destino visible al que lleva."
            en: "Store with each passage its title, its language and the visible destination it leads to."
          - es: "Comprobar cada destino contra las rutas reales del sitio."
            en: "Check every destination against the site’s real routes."
        artefactos:
          - { es: "Un índice por idioma, inspeccionable y regenerado en cada build.", en: "One index per language, inspectable and regenerated on every build." }
        decide: { es: "Quien construye, con la medición al lado.", en: "Whoever builds, with the measurement alongside." }
        control: { es: "El build falla si un documento no valida, si un identificador se repite o si un destino no existe.", en: "The build fails if a document does not validate, an identifier repeats or a destination does not exist." }
        nota:
          voz: hice
          texto:
            es: "El tope de 180 palabras por fragmento lo medí sobre el corpus real: la subsección típica tenía 143 palabras y la más larga 247, y con ese tope solo se parte el 4 % de las subsecciones."
            en: "I measured the 180-word cap per passage on the real corpus: the typical subsection had 143 words and the longest 247, and with that cap only 4% of the subsections get split."
          corpus: [rag-y-el-chat]
      - nombre: { es: "Recuperar y medir cuántas fuentes entran", en: "Retrieve, and measure how many sources go in" }
        entradas:
          - { es: "El índice.", en: "The index." }
          - { es: "Un conjunto de preguntas con la fuente que cada una espera.", en: "A set of questions, each with the source it expects." }
        actividades:
          - es: "Elegir el tipo de búsqueda midiendo, no por costumbre."
            en: "Choose the type of search by measuring, not by habit."
          - es: "Fijar con el conjunto de preguntas cuántas fuentes entran y cuánto pesa cada tipo de fragmento."
            en: "Use the question set to fix how many sources go in and how much each kind of passage weighs."
          - es: "Separar dos modos: uno amplio para responder y uno estricto para decidir si se responde."
            en: "Separate two modes: a broad one to answer and a strict one to decide whether to answer at all."
        artefactos:
          - { es: "La configuración de la búsqueda, versionada y con su medición al lado.", en: "The search configuration, versioned and with its measurement alongside." }
        decide: { es: "Quien construye, con los dos conjuntos de preguntas delante.", en: "Whoever builds, with both question sets in front of them." }
        control: { es: "Ninguna pregunta del conjunto se queda sin su fuente entre las que entran.", en: "No question in the set is left without its source among those that go in." }
        nota:
          voz: hice
          texto:
            es: "Con tres fuentes por respuesta, seis preguntas del banco se quedaban sin la suya; con cuatro, ninguna, y con cinco el contexto crecía un 25 % sin rescatar a nadie: por eso entran cuatro."
            en: "With three sources per answer, six questions in the bank were left without theirs; with four, none, and with five the context grew by 25% without rescuing anyone: that is why four go in."
          corpus: [rag-y-el-chat]
      - nombre: { es: "Controlar antes y después del modelo", en: "Control before and after the model" }
        entradas:
          - { es: "La pregunta.", en: "The question." }
          - { es: "Los fragmentos recuperados.", en: "The retrieved passages." }
        actividades:
          - es: "Cortar lo ajeno antes de llamar al proveedor."
            en: "Stop off-topic questions before calling the provider."
          - es: "Componer las instrucciones en el servidor, fuera del alcance de quien pregunta."
            en: "Compose the instructions on the server, out of the asker’s reach."
          - es: "Acotar la entrada, el historial y la salida con números, no con intenciones."
            en: "Bound the input, the history and the output with numbers, not intentions."
          - es: "Convertir cada fuente usada en una cita que navega."
            en: "Turn every source used into a citation that navigates."
          - es: "Degradar a búsqueda local, y decirlo, si el proveedor falla."
            en: "Fall back to local search, and say so, if the provider fails."
        artefactos:
          - { es: "Las defensas del servidor, en orden y cada una con su prueba de falla provocada.", en: "The server’s defenses, in order, each with its provoked-failure test." }
        decide: { es: "Quien responde por el producto.", en: "Whoever answers for the product." }
        control: { es: "Cada control se ve fallar en la suite antes de darse por bueno.", en: "Every control is seen failing in the suite before it is accepted." }
        nota:
          voz: hice
          texto:
            es: "En el servidor de este chat hay nueve defensas en orden; solo la última —el proveedor— tiene factura, y llega cuando las ocho anteriores ya hicieron su trabajo."
            en: "This chat’s server has nine defenses in order; only the last one —the provider— comes with a bill, and it is reached once the eight before it have done their job."
          corpus: [rag-y-el-chat]
      - nombre: { es: "Evaluar la recuperación antes de publicar un cambio", en: "Evaluate retrieval before publishing a change" }
        entradas:
          - { es: "El cambio: contenido, configuración o código.", en: "The change: content, configuration or code." }
          - { es: "Los dos conjuntos de preguntas.", en: "The two question sets." }
        actividades:
          - es: "Correr las preguntas propias de cada documento y las escritas desde afuera contra el índice real, con el mismo módulo de búsqueda que usa producción."
            en: "Run each document’s own questions and those written from the outside against the real index, with the same search module production uses."
          - es: "Comprobar que las preguntas ajenas se comportan como está declarado."
            en: "Check that off-topic questions behave as declared."
          - es: "Leer las respuestas de las preguntas propias: cada afirmación sostenida, nada ajeno al corpus."
            en: "Read the answers to my own questions: every claim supported, nothing from outside the corpus."
          - es: "Tratar una palabra que el corpus no dice como un hallazgo de contenido, no de la prueba."
            en: "Treat a word the corpus does not say as a content finding, not a test problem."
        artefactos:
          - { es: "El resultado de las dos suites en la integración continua.", en: "The result of both suites in continuous integration." }
          - { es: "Un léxico obligatorio por documento.", en: "A required vocabulary per document." }
        decide: { es: "Quien es dueño del contenido, con la integración continua delante.", en: "Whoever owns the content, with continuous integration in front of them." }
        control: { es: "Un cambio que deja una pregunta sin su fuente no se publica.", en: "A change that leaves a question without its source does not get published." }
        nota:
          voz: hice
          texto:
            es: "Cuando el banco descubrió que «ETL» y «lakehouse» no aparecían en mis documentos —yo había escrito «integración de información»—, se corrigió el contenido, no la expectativa."
            en: "When the bank found that “ETL” and “lakehouse” did not appear in my documents —I had written “information integration”—, the content was fixed, not the expectation."
          corpus: [rag-y-el-chat]
      - nombre: { es: "Operar, degradar y volver a medir", en: "Operate, degrade and measure again" }
        entradas:
          - { es: "El chat publicado.", en: "The released chat." }
          - { es: "El registro de cada respuesta.", en: "The record of every answer." }
        actividades:
          - es: "Vigilar costo, latencia y modo de cada respuesta: modelo, mensaje fijo o búsqueda local."
            en: "Watch the cost, latency and mode of every answer: model, fixed message or local search."
          - es: "Volver a medir el umbral y cuántas fuentes entran cada vez que el corpus crece."
            en: "Measure the threshold and how many sources go in again every time the corpus grows."
          - es: "Convertir cada pregunta mal contestada en una fila nueva del banco."
            en: "Turn every badly answered question into a new row in the bank."
        artefactos:
          - { es: "Una fila por respuesta: fuentes, proveedor, tokens y milisegundos.", en: "One row per answer: sources, provider, tokens and milliseconds." }
        decide: { es: "Quien paga la operación y quien es dueño del contenido.", en: "Whoever pays for the operation and whoever owns the content." }
        control: { es: "Un techo de gasto escrito; si se acerca, se recorta contexto o extensión antes de cambiar de modelo.", en: "A written spending ceiling; if it gets close, context or length is trimmed before switching models." }
        nota:
          voz: hice
          texto:
            es: "Opera con un techo de US$20 al mes y un costo real observado de US$0: el uso cabe en la cuota gratuita del proveedor inicial y las preguntas ajenas no lo llaman."
            en: "It runs under a ceiling of US$20 a month with an observed real cost of US$0: usage fits in the initial provider’s free quota and off-topic questions never call it."
          corpus: [rag-y-el-chat]

  # ─── 4 · Las decisiones de diseño ───────────────────────────────────────────
  - n: 4
    decisiones:
      - titulo: { es: "Por qué el RAG no usa embeddings: léxica, vectorial o híbrida", en: "Why the RAG does not use embeddings: lexical, vector or hybrid" }
        cuandoSi:
          es: "Léxica, cuando el contenido está lleno de nombres, fechas, siglas y términos técnicos, y las preguntas de prueba no muestran paráfrasis perdidas."
          en: "Lexical, when the content is full of names, dates, acronyms and technical terms, and the test questions show no lost paraphrases."
        cuandoNo:
          es: "Cuando una familia de preguntas que el contenido no escribe con esas palabras —sinónimos, paráfrasis— se pierde de forma sistemática: ahí la vectorial o la híbrida pagan lo que cuestan."
          en: "When a family of questions phrased in words the content does not use —synonyms, paraphrases— is lost systematically: that is where vector or hybrid search pays for what it costs."
        porQue:
          voz: campo
          texto:
            es: "Microsoft documenta que la búsqueda por palabras clave rinde mejor con códigos de producto, jerga muy especializada, fechas y nombres de personas, porque encuentra coincidencias exactas, mientras la vectorial encuentra lo conceptualmente parecido aunque no comparta palabras; la híbrida corre las dos en paralelo y funde los resultados."
            en: "Microsoft documents that keyword search performs better on product codes, highly specialized jargon, dates and people’s names because it finds exact matches, while vector search finds what is conceptually similar even without shared words; hybrid search runs both in parallel and merges the results."
          fuentes: [1]
        nota:
          voz: hice
          texto:
            es: "Mi chat busca con BM25, sin embeddings ni base vectorial, por una decisión escrita: entran el día que el banco muestre una familia de preguntas que la léxica pierde de forma sistemática, y hoy ninguna se queda sin su fuente entre las cuatro primeras."
            en: "My chat searches with BM25, without embeddings or a vector database, by a written decision: they come in the day the bank shows a family of questions that lexical search loses systematically, and today none is left without its source among the first four."
          corpus: [rag-y-el-chat]
      - titulo: { es: "Reordenar o no los resultados", en: "Whether to rerank the results" }
        cuandoSi:
          es: "Cuando la primera búsqueda trae lo correcto, pero no en los primeros puestos, y al contexto solo caben unos pocos fragmentos."
          en: "When the first search brings back the right thing, but not near the top, and only a few passages fit in the context."
        cuandoNo:
          es: "Cuando lo correcto ya llega arriba en la medición: un reordenador suma latencia y costo en cada pregunta sin mover nada."
          en: "When the right thing already comes out on top in the measurement: a reranker adds latency and cost to every question without moving anything."
        porQue:
          voz: campo
          texto:
            es: "En Azure AI Search el ranker semántico reordena solo los 50 primeros resultados de la búsqueda léxica o híbrida, con modelos de lenguaje adaptados de Bing; no vuelve a buscar en todo el corpus, así que no rescata lo que la primera búsqueda no trajo."
            en: "In Azure AI Search the semantic ranker reranks only the top 50 results of the keyword or hybrid search, using language models adapted from Bing; it does not search the whole corpus again, so it cannot rescue what the first search missed."
          fuentes: [2]
        nota:
          voz: posicion
          texto:
            es: "Antes de añadir un reordenador miro dónde cae la fuente correcta: si ya llega entre las primeras, el reordenador es gasto."
            en: "Before adding a reranker I look at where the right source lands: if it already comes in among the first ones, the reranker is just spending."
      - titulo: { es: "Cuántas fuentes entran a una respuesta", en: "How many sources go into an answer" }
        cuandoSi:
          es: "Más fuentes, cuando la medición muestra preguntas que se quedan sin la suya."
          en: "More sources, when the measurement shows questions left without theirs."
        cuandoNo:
          es: "Cuando subir el número ya no rescata ninguna pregunta: solo agranda el contexto, la factura y el ruido que el modelo tiene que ignorar."
          en: "When raising the number no longer rescues any question: it only grows the context, the bill and the noise the model has to ignore."
        porQue:
          voz: campo
          texto:
            es: "Microsoft propone calibrar los parámetros de la búsqueda —el algoritmo, el top_k, el tamaño de los fragmentos— con un barrido: generar resultados con valores distintos y quedarse con los que dan la mejor calidad de recuperación, medida contra relevancias etiquetadas por personas."
            en: "Microsoft suggests calibrating search parameters —the algorithm, top_k, passage size— with a sweep: generate results with different values and keep the ones that give the best retrieval quality, measured against human-labeled relevance."
          fuentes: [7]
        nota:
          voz: hice
          texto:
            es: "En mi chat lo midieron dos conjuntos independientes, dos veces: con cuatro fuentes por respuesta, el golden set dio 75 de 75 y el banco 136 de 136; con cinco no se rescató ninguna más."
            en: "In my chat two independent sets measured it, twice: with four sources per answer, the golden set scored 75 out of 75 and the bank 136 out of 136; with five, not one more was rescued."
          corpus: [rag-y-el-chat]
      - titulo: { es: "Qué hace el chat cuando la pregunta no es suya: el umbral de alcance", en: "What the chat does when the question is not its business: the scope threshold" }
        cuandoSi:
          es: "Un filtro antes del modelo, para las preguntas que no comparten una sola palabra sustantiva con el contenido: se responden sin gastar un token."
          en: "A filter before the model, for questions that share not a single substantive word with the content: they are answered without spending a token."
        cuandoNo:
          es: "Como garantía de corrección: si el umbral sube para bloquear más preguntas ajenas, empieza a rechazar las legítimas."
          en: "As a guarantee of correctness: if the threshold rises to block more off-topic questions, it starts rejecting legitimate ones."
        porQue:
          voz: hice
          texto:
            es: "Lo medí y el hallazgo fue negativo: la pregunta legítima que peor puntúa da 5,92 y la ajena que mejor puntúa, 16,90; con el umbral en 7, diez legítimas recibían «eso se me escapa» a cambio de bloquear tres ajenas más. Por eso el umbral es 1 —«casó algo sustantivo»— y la corrección la garantiza el prompt."
            en: "I measured it and the finding was negative: the lowest-scoring legitimate question gets 5.92 and the highest-scoring off-topic one, 16.90; with the threshold at 7, ten legitimate questions got “that one escapes me” in exchange for blocking three more off-topic ones. That is why the threshold is 1 —“something substantive matched”— and correctness is guaranteed by the prompt."
          corpus: [rag-y-el-chat]
        nota:
          voz: posicion
          texto:
            es: "El peor fallo de un chat así no es gastar tokens en una pregunta ajena: es contestar «no sé» a una pregunta legítima."
            en: "The worst failure for a chat like this is not spending tokens on an off-topic question: it is answering “I don’t know” to a legitimate one."
      - titulo: { es: "Cómo evita el chat inventar respuestas: fuentes que se citan y se pueden abrir", en: "How the chat avoids making up answers: sources that are cited and can be opened" }
        cuandoSi:
          es: "Siempre: cada fuente que entra a la respuesta navega a una sección visible, y un destino roto detiene el build."
          en: "Always: every source that goes into the answer leads to a visible section, and a broken destination stops the build."
        cuandoNo:
          es: "No basta cuando la respuesta tiene consecuencias: ahí hace falta además comprobar por máquina que cada afirmación se apoya en la fuente que cita."
          en: "It is not enough when the answer has consequences: there you also need a machine check that every claim rests on the source it cites."
        porQue:
          voz: campo
          texto:
            es: "OWASP cuenta la desinformación entre los riesgos de las aplicaciones con LLM y recomienda, entre otras medidas, usar generación aumentada por recuperación para hacer más confiables las salidas, animar a quien usa el sistema a contrastarlas con fuentes confiables y validar automáticamente las salidas clave, sobre todo en entornos de alto riesgo."
            en: "OWASP lists misinformation among the risks of LLM applications and recommends, among other measures, using retrieval-augmented generation to make outputs more reliable, encouraging users to cross-check them against trusted sources, and automatically validating key outputs, especially in high-stakes settings."
          fuentes: [14]
        nota:
          voz: hice
          texto:
            es: "En mi chat las fuentes que el modelo tuvo delante aparecen junto a la respuesta y cada una navega a su sección; no existe todavía un validador que compruebe que el modelo usó cada fuente en cada frase, y lo digo así: esa relación la verifica hoy quien lee."
            en: "In my chat, the sources the model had in front of it appear next to the answer and each one leads to its section; there is no validator yet that checks the model used each source in each sentence, and I say so: today that relationship is checked by whoever reads."
          corpus: [rag-y-el-chat]
      - titulo: { es: "Mandarlo todo en el contexto o recuperar: cuándo no usar RAG", en: "Send everything in the context, or retrieve: when not to use RAG" }
        cuandoSi:
          es: "Mandar el contenido entero cuando cabe holgado en la ventana del modelo y cambia poco: no hay índice que mantener."
          en: "Send the whole content when it fits comfortably in the model’s window and changes little: there is no index to maintain."
        cuandoNo:
          es: "Cuando el contenido crece, cambia seguido o mezcla temas: con más texto delante el modelo rinde peor y cada pregunta cuesta más."
          en: "When the content grows, changes often or mixes topics: with more text in front of it the model performs worse and every question costs more."
        porQue:
          voz: campo
          texto:
            es: "Anthropic dice que si la base de conocimiento tiene menos de 200.000 tokens —unas 500 páginas— se puede incluir entera en el prompt; Chroma midió 18 modelos y encontró que su rendimiento cae a medida que crece la entrada, aun en tareas simples."
            en: "Anthropic says that if the knowledge base is smaller than 200,000 tokens —about 500 pages— it can simply be included whole in the prompt; Chroma measured 18 models and found that their performance degrades as input grows, even on simple tasks."
          fuentes: [4, 9]
        nota:
          voz: hice
          texto:
            es: "Con cuatro fuentes de hasta 180 palabras, el contexto de una respuesta de mi chat ronda las 540 palabras —del orden de 800 tokens—, aunque la base haya crecido de unas 30.000 a unas 158.000 palabras por idioma."
            en: "With four sources of up to 180 words, the context of an answer in my chat stays around 540 words —on the order of 800 tokens—, even though the knowledge base has grown from about 30,000 to about 158,000 words per language."
          corpus: [rag-y-el-chat]
      - titulo: { es: "Caché de prompt sí; caché semántica, no en un chat de hechos", en: "Prompt caching yes; semantic caching, not in a chat about facts" }
        cuandoSi:
          es: "Caché de prompt, cuando muchas llamadas comparten el mismo comienzo —instrucciones, contexto fijo—: baja costo y latencia sin tocar la respuesta."
          en: "Prompt caching, when many calls share the same beginning —instructions, fixed context—: it lowers cost and latency without touching the answer."
        cuandoNo:
          es: "Caché semántica, cuando la respuesta depende de hechos que cambian o de matices de la pregunta: devuelve la respuesta de otra pregunta parecida."
          en: "Semantic caching, when the answer depends on facts that change or on the nuances of the question: it returns the answer to a different, similar question."
        porQue:
          voz: campo
          texto:
            es: "Microsoft documenta que la caché de prompt no cambia el contenido de la respuesta, solo reduce latencia y costo, y que exige un comienzo idéntico de al menos 1.024 tokens; de la caché semántica advierte que, como responde por parecido y no por coincidencia exacta, puede devolver respuestas incorrectas, desactualizadas o inseguras para la pregunta del momento."
            en: "Microsoft documents that prompt caching does not change the content of the answer, it only reduces latency and cost, and that it requires an identical beginning of at least 1,024 tokens; about semantic caching it warns that, because it answers by similarity rather than exact match, it can return responses that are incorrect, outdated or unsafe for the current request."
          fuentes: [10, 11]
        nota:
          voz: posicion
          texto:
            es: "No pondría una caché semántica en un chat que responde por hechos sin un registro que muestre preguntas repetidas: devolver por parecido la respuesta de otra pregunta es una forma elegante de inventar."
            en: "I would not put a semantic cache in a chat that answers about facts without a log showing repeated questions: returning another question’s answer because it looks similar is an elegant way of making things up."

  # ─── 5 · Lo innovador en 2026 ───────────────────────────────────────────────
  - n: 5
    elementos:
      - titulo: { es: "Búsqueda híbrida con reordenamiento semántico", en: "Hybrid search with semantic reranking" }
        queCambia:
          es: "En vez de elegir entre palabras y significado, la búsqueda corre la léxica y la vectorial en paralelo, funde las dos listas por rango recíproco y un modelo de lenguaje reordena los primeros resultados. Microsoft documenta que, en pruebas con datos reales y de referencia, la híbrida con ranker semántico da beneficios significativos de relevancia."
          en: "Instead of choosing between words and meaning, search runs lexical and vector retrieval in parallel, fuses both lists by reciprocal rank and a language model reranks the top results. Microsoft documents that, in tests on real-world and benchmark data, hybrid retrieval with the semantic ranker offers significant relevance gains."
        fuentes: [1, 2]
        nota:
          voz: posicion
          texto:
            es: "Si un día el banco muestra paráfrasis perdidas, este es mi siguiente paso, no un reemplazo: la léxica seguiría ahí para los nombres y las siglas."
            en: "If one day the bank shows lost paraphrases, this is my next step, not a replacement: lexical search would stay for names and acronyms."
      - titulo: { es: "Recuperación agéntica: la pregunta se planea antes de buscar", en: "Agentic retrieval: the question is planned before searching" }
        queCambia:
          es: "Para preguntas con varias partes o que dependen de la conversación, un modelo las parte en subconsultas que corren en paralelo, cada una se reordena y el resultado se funde con referencias para citar. Microsoft advierte que agrega latencia frente a una sola consulta, y en Azure AI Search la planificación con modelo sigue en vista previa."
          en: "For questions with several parts, or that depend on the conversation, a model splits them into subqueries that run in parallel, each one is reranked and the result is merged with references for citation. Microsoft warns that it adds latency compared with a single query, and in Azure AI Search model-based query planning is still in preview."
        fuentes: [3]
        nota:
          voz: posicion
          texto:
            es: "Para preguntas cortas y directas pagaría esa latencia solo si la medición mostrara preguntas compuestas que se quedan sin su fuente."
            en: "For short, direct questions I would pay that latency only if the measurement showed compound questions left without their source."
      - titulo: { es: "Contexto añadido a cada fragmento antes de indexarlo", en: "Context added to each passage before indexing it" }
        queCambia:
          es: "Un fragmento suelto pierde de qué documento y de qué sección viene. La recuperación contextual le antepone una explicación breve, generada a partir del documento entero, antes de los embeddings y del índice BM25: en las pruebas de Anthropic, los fallos de recuperación entre los 20 primeros fragmentos bajaron un 49 %, y un 67 % al sumar reordenamiento."
          en: "A loose passage loses which document and which section it came from. Contextual retrieval prepends a short explanation, generated from the whole document, before the embeddings and the BM25 index: in Anthropic’s tests, retrieval failures among the top 20 passages fell by 49%, and by 67% with reranking added."
        fuentes: [4]
        nota:
          voz: hice
          texto:
            es: "En mi índice cada fragmento conserva el título de su sección, el título pesa el doble que el cuerpo, y cada documento declara además cuándo usarlo: es contexto escrito a mano, sin un modelo de por medio."
            en: "In my index every passage keeps its section title, the title weighs twice as much as the body, and every document also declares when to use it: it is context written by hand, with no model in between."
          corpus: [rag-y-el-chat]
      - titulo: { es: "GraphRAG para preguntas sobre el conjunto entero", en: "GraphRAG for questions about the whole dataset" }
        queCambia:
          es: "La RAG vectorial rinde con preguntas locales —quién, qué, cuándo, dónde—; responder preguntas globales sobre todo un conjunto de datos es la ventaja de GraphRAG. Su variante LazyGraphRAG bajó el costo de indexar al de la RAG vectorial: el 0,1 % del de GraphRAG completo."
          en: "Vector RAG excels at local questions —who, what, when, where—; answering global questions about an entire dataset is GraphRAG’s advantage. Its LazyGraphRAG variant brought indexing cost down to that of vector RAG: 0.1% of full GraphRAG’s."
        fuentes: [5]
        nota:
          voz: posicion
          texto:
            es: "Mis preguntas son locales —una empresa, una cifra, una decisión—; un grafo pagaría si me preguntaran por patrones de toda la trayectoria y el banco mostrara que no los contesto."
            en: "My questions are local —a company, a figure, a decision—; a graph would pay off if I were asked about patterns across my whole career and the bank showed I cannot answer them."
      - titulo: { es: "Citas ancladas a la frase exacta", en: "Citations anchored to the exact sentence" }
        queCambia:
          es: "La API de citas de Anthropic parte los documentos en frases y devuelve, con la respuesta, las frases exactas que la sostienen; según sus evaluaciones internas, supera a la mayoría de las implementaciones propias, con hasta un 15 % más de exactitud de recuperación."
          en: "Anthropic’s citations API splits documents into sentences and returns, with the answer, the exact sentences that support it; according to its internal evaluations it outperforms most custom implementations, with up to 15% better recall accuracy."
        fuentes: [6]
        nota:
          voz: hice
          texto:
            es: "Mis citas llegan a la sección, no a la frase: el destino está garantizado en cada build; la relación con cada frase, no."
            en: "My citations reach the section, not the sentence: the destination is guaranteed on every build; the link to each sentence is not."
          corpus: [rag-y-el-chat]
      - titulo: { es: "Evaluar la recuperación y la respuesta por separado, con un juez calibrado contra personas", en: "Evaluating retrieval and the answer separately, with a judge calibrated against people" }
        queCambia:
          es: "Microsoft separa la evaluación del proceso —si la recuperación trajo lo relevante, medido contra etiquetas humanas— de la del sistema: si la respuesta se apoya en el contexto sin inventar, que es la precisión, y si no deja fuera lo esencial, que es la exhaustividad. Cuando el juez es un modelo, LangSmith propone calificar primero una muestra a mano y ajustar las instrucciones del juez hasta que coincida con esas notas."
          en: "Microsoft separates process evaluation —whether retrieval brought back what is relevant, measured against human labels— from system evaluation: whether the answer rests on the context without making things up, which is precision, and whether it leaves nothing essential out, which is recall. When the judge is a model, LangSmith proposes grading a sample by hand first and adjusting the judge’s instructions until it agrees with those grades."
        fuentes: [7, 8]
        nota:
          voz: hice
          texto:
            es: "En mi chat la recuperación se evalúa en cada cambio con dos conjuntos, contra el índice real y con el mismo módulo de búsqueda que corre en producción."
            en: "In my chat retrieval is evaluated on every change with two sets, against the real index and with the same search module that runs in production."
          corpus: [rag-y-el-chat]
      - titulo: { es: "El contexto largo no reemplaza la recuperación", en: "Long context does not replace retrieval" }
        queCambia:
          es: "Las ventanas de contexto grandes invitan a mandarlo todo. Chroma midió 18 modelos y vio que el rendimiento cae al crecer la entrada, que un solo distractor ya lo baja y que importa cómo se presenta la información: elegir qué entra sigue siendo el trabajo."
          en: "Large context windows invite you to send everything. Chroma measured 18 models and saw that performance drops as input grows, that a single distractor already lowers it and that how the information is presented matters: choosing what goes in is still the job."
        fuentes: [9]
        nota:
          voz: hice
          texto:
            es: "Mi chat le entrega al modelo solo los fragmentos recuperados, numerados, y no el contenido entero del sitio."
            en: "My chat hands the model only the retrieved passages, numbered, and not the site’s whole content."
          corpus: [rag-y-el-chat]
      - titulo: { es: "Salidas que siguen un esquema exacto", en: "Outputs that follow an exact schema" }
        queCambia:
          es: "Las salidas estructuradas obligan al modelo a seguir el esquema JSON que se le da en la llamada; el modo JSON anterior garantizaba JSON válido, pero no que respetara el esquema."
          en: "Structured outputs make the model follow the JSON schema provided in the call; the older JSON mode guaranteed valid JSON, but not that it respected the schema."
        fuentes: [12]
        nota:
          voz: posicion
          texto:
            es: "Es la pieza que usaría para un validador de citas: que el modelo devuelva en un esquema qué fuente sostiene cada afirmación, y que el código lo compruebe."
            en: "It is the piece I would use for a citation validator: the model returns, in a schema, which source supports each claim, and code checks it."

  # ─── 6 · Modos de falla y cómo se ven venir ─────────────────────────────────
  - n: 6
    fallas:
      - falla: { es: "El chat inventa respuestas: contesta con lo que el modelo sabe y no con lo que recuperó", en: "The chat makes up answers: it replies with what the model knows, not with what it retrieved" }
        senal: { es: "Una afirmación verificable que no está en ninguna de las fuentes que el modelo tuvo delante.", en: "A verifiable claim that is in none of the sources the model had in front of it." }
        control: { es: "Instrucciones del servidor que obligan a usar solo las fuentes, fuentes numeradas y la lectura de las respuestas de prueba.", en: "Server instructions that require using only the sources, numbered sources, and reading the test answers." }
      - falla: { es: "La recuperación no trae la fuente correcta", en: "Retrieval does not bring back the right source" }
        senal: { es: "Una pregunta de prueba sin su documento entre las fuentes que entran.", en: "A test question without its document among the sources that go in." }
        control: { es: "Los dos conjuntos de preguntas en cada cambio, contra el índice real.", en: "Both question sets on every change, against the real index." }
      - falla: { es: "Una palabra que el contenido no dice", en: "A word the content does not say" }
        senal: { es: "Preguntas con una sigla o un sinónimo que ningún documento escribe.", en: "Questions with an acronym or a synonym that no document uses." }
        control: { es: "El banco como auditoría de vocabulario y un léxico obligatorio por documento.", en: "The bank as a vocabulary audit and a required vocabulary per document." }
      - falla: { es: "Una pregunta ajena llega al modelo y gasta", en: "An off-topic question reaches the model and spends" }
        senal: { es: "Respuestas del proveedor a preguntas sin un tema del sitio.", en: "Provider answers to questions about nothing on the site." }
        control: { es: "Filtro de alcance antes del modelo e instrucciones que prohíben responder fuera de las fuentes.", en: "A scope filter before the model and instructions that forbid answering outside the sources." }
      - falla: { es: "Una pregunta legítima recibe «no sé»", en: "A legitimate question gets “I don’t know”" }
        senal: { es: "Una pregunta del banco bloqueada por el filtro de alcance.", en: "A bank question blocked by the scope filter." }
        control: { es: "Un umbral medido con el banco entero y vuelto a medir cuando el contenido crece.", en: "A threshold measured on the whole bank and measured again when the content grows." }
      - falla: { es: "Una cita lleva a algo que no existe", en: "A citation leads to something that does not exist" }
        senal: { es: "Un destino que no resuelve a una sección visible.", en: "A destination that does not resolve to a visible section." }
        control: { es: "El build compara cada destino con el catálogo de rutas reales y falla.", en: "The build checks every destination against the catalog of real routes and fails." }
      - falla: { es: "El proveedor se cae o se queda sin cuota", en: "The provider goes down or runs out of quota" }
        senal: { es: "Fallas seguidas, tiempos vencidos, una credencial rechazada.", en: "Consecutive failures, timeouts, a rejected credential." }
        control: { es: "Un circuit breaker y la búsqueda local sobre el mismo índice, rotulada como tal.", en: "A circuit breaker and local search over the same index, labeled as such." }
      - falla: { es: "Una instrucción escondida en el contenido", en: "An instruction hidden in the content" }
        senal: { es: "Un texto del corpus o de una fuente que le pide algo al modelo.", en: "A text in the corpus or in a source that asks the model to do something." }
        control: { es: "Solo entra contenido publicado y versionado, y las instrucciones del servidor ordenan rechazar los intentos de cambiar las reglas.", en: "Only published, versioned content goes in, and the server instructions order the model to refuse attempts to change the rules." }

  # ─── 7 · Métricas y controles ───────────────────────────────────────────────
  - n: 7
    metricas:
      - metrica: { es: "Preguntas de afuera con su fuente entre las que entran", en: "Outside questions with their source among those that go in" }
        umbral: { es: "Todas.", en: "All of them." }
        aprueba: { es: "Quien es dueño del contenido, con la integración continua delante.", en: "Whoever owns the content, with continuous integration in front of them." }
      - metrica: { es: "Fuente esperada en el primer lugar", en: "Expected source in first place" }
        umbral: { es: "Al menos el 60 % del banco.", en: "At least 60% of the bank." }
        aprueba: { es: "Quien es dueño del contenido.", en: "Whoever owns the content." }
      - metrica: { es: "Preguntas propias de cada documento", en: "Each document’s own questions" }
        umbral: { es: "Todas con su documento entre las primeras fuentes.", en: "All with their document among the first sources." }
        aprueba: { es: "La integración continua, en cada cambio.", en: "Continuous integration, on every change." }
      - metrica: { es: "Preguntas ajenas que se comportan como se declaró", en: "Off-topic questions that behave as declared" }
        umbral: { es: "Todas: las que deben cortarse sin gastar un token, se cortan.", en: "All of them: the ones that must be stopped without spending a token are stopped." }
        aprueba: { es: "Quien responde por el producto.", en: "Whoever answers for the product." }
      - metrica: { es: "Afirmaciones sin respaldo en las fuentes", en: "Claims with no backing in the sources" }
        umbral: { es: "Cero en la muestra revisada; una sola detiene el cambio.", en: "Zero in the reviewed sample; a single one stops the change." }
        aprueba: { es: "Quien responde por el producto, leyendo.", en: "Whoever answers for the product, by reading." }
      - metrica: { es: "Citas a destinos que no existen", en: "Citations to destinations that do not exist" }
        umbral: { es: "Cero: el build no publica.", en: "Zero: the build does not publish." }
        aprueba: { es: "El build, sin excepciones.", en: "The build, with no exceptions." }
      - metrica: { es: "Costo y latencia por respuesta", en: "Cost and latency per answer" }
        umbral: { es: "Dentro del techo mensual escrito; si se acerca, se recorta contexto o extensión antes de cambiar de modelo.", en: "Within the written monthly ceiling; if it gets close, context or length is trimmed before switching models." }
        aprueba: { es: "Quien paga la operación.", en: "Whoever pays for the operation." }
      - metrica: { es: "Servicio con el proveedor caído", en: "Service with the provider down" }
        umbral: { es: "Quien pregunta sigue recibiendo fragmentos relevantes, rotulados como búsqueda local.", en: "Whoever asks still gets relevant passages, labeled as a local search." }
        aprueba: { es: "Quien responde por el producto.", en: "Whoever answers for the product." }

  # ─── 8 · Mi evidencia ───────────────────────────────────────────────────────
