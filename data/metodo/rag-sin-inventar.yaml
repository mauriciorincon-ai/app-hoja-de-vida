          en: "A build script assembles one index per language with passages of up to 180 words, titles and destinations; if a document fails its schema, an identifier repeats or a destination does not exist, the site is not published."
        corpus: [rag-y-el-chat]
        href: /apps/hoja-de-vida
      - nombre: { es: "Dos suites de preguntas en cada cambio", en: "Two question suites on every change" }
        nivel: uso-real
        texto:
          es: "Cada documento declara las preguntas que debe contestar y la prueba exige su documento entre los cuatro primeros resultados; el banco, escrito como pregunta quien recluta, exige además la fuente esperada de primera en al menos el 60 % de los casos."
          en: "Every document declares the questions it must answer and the test requires its document among the first four results; the bank, written the way a recruiter asks, also requires the expected source in first place in at least 60% of the cases."
        corpus: [rag-y-el-chat]
      - nombre: { es: "Cuántas fuentes y cuánto pesa cada una, medido", en: "How many sources and how much each weighs, measured" }
        nivel: uso-real
        texto:
          es: "Las cuatro fuentes por respuesta salieron de dos mediciones con dos conjuntos independientes —con cuatro, 75 de 75 y 136 de 136—, y el peso de 0,5 de las fichas de la vitrina devolvió el banco de 94 a 102 aciertos de 131."
          en: "The four sources per answer came from two measurements with two independent sets —with four, 75 out of 75 and 136 out of 136—, and the 0.5 weight on the showcase sheets brought the bank back from 94 to 102 hits out of 131."
        corpus: [rag-y-el-chat]
      - nombre: { es: "Cinco proveedores, una variable de entorno", en: "Five providers, one environment variable" }
        nivel: uso-real
        texto:
          es: "Groq en producción desde julio de 2026 —con gpt-oss-120b desde agosto—, y Gemini 2.5 Flash, Azure a través de Microsoft Foundry, Claude con Haiku 4.5 y cualquier servicio compatible con la API de OpenAI, adaptados e integrados sobre el Vercel AI SDK: se cambia con una variable de entorno, y el índice y las defensas no cambian."
          en: "Groq in production since July 2026 —running gpt-oss-120b since August—, and Gemini 2.5 Flash, Azure through Microsoft Foundry, Claude with Haiku 4.5 and any service compatible with the OpenAI API, adapted and integrated on the Vercel AI SDK: it is switched with an environment variable, and the index and the defenses do not change."
        corpus: [rag-y-el-chat]
      - nombre: { es: "La degradación, probada en una falla real", en: "Degradation, tested by a real failure" }
        nivel: uso-real
        texto:
          es: "En el sprint 3 una credencial del proveedor devolvió un 401 en la integración, el circuito se abrió y la búsqueda local respondió sobre el mismo índice, diciendo que no era una respuesta del modelo."
          en: "In sprint 3 a provider credential returned a 401 in integration, the circuit opened and local search answered over the same index, saying it was not the model’s answer."
        corpus: [rag-y-el-chat]

  # ─── 9 · Lo que haría distinto y lo que no he hecho ─────────────────────────
  - n: 9
    limites:
      - voz: hice
        texto:
          es: "Embeddings y base vectorial son, en este chat, una decisión escrita de no usarlos mientras una medición no lo justifique: es un argumento con su medición del lado léxico, no una experiencia con embeddings."
          en: "Embeddings and a vector database are, in this chat, a written decision not to use them until a measurement justifies it: it is an argument backed by measurement on the lexical side, not an experience with embeddings."
        corpus: [rag-y-el-chat]
      - voz: hice
        texto:
          es: "No existe todavía un validador que compruebe que el modelo usó cada fuente citada en cada frase: es trabajo futuro declarado."
          en: "There is no validator yet that checks the model used each cited source in each sentence: it is declared future work."
        corpus: [rag-y-el-chat]
      - voz: hice
        texto:
          es: "Para la respuesta no tengo un juez automático: las respuestas de prueba se revisan leyendo."
          en: "For the answer I have no automatic judge: the test answers are reviewed by reading them."
        corpus: [rag-y-el-chat]
      - voz: hice
        texto:
          es: "El chat no ajusta ni reentrena ningún modelo: cuando algo de mi trayectoria cambia, cambia en la fuente y entra al índice en el siguiente build."
          en: "The chat does not fine-tune or retrain any model: when something in my career changes, it changes at the source and enters the index on the next build."
        corpus: [rag-y-el-chat]
      - voz: hice
        texto:
          es: "Con Microsoft Foundry, mi experiencia es el adaptador de proveedor de este chat y el estudio del AI-103, que está en curso."
          en: "With Microsoft Foundry, my experience is this chat’s provider adapter and studying for the AI-103, which is in progress."
        corpus: [rag-y-el-chat, certificaciones]
      - voz: posicion
        texto:
          es: "Lo que haría distinto hoy: un validador de citas desde el primer día —el modelo dice en un esquema qué fuente sostiene cada afirmación y el código lo comprueba— y un juez de la respuesta calibrado contra una muestra calificada a mano."
          en: "What I would do differently today: a citation validator from day one —the model states in a schema which source supports each claim and code checks it— and a judge for the answer calibrated against a sample graded by hand."
      - voz: posicion
        texto:
          es: "Y no empezaría por la arquitectura más sofisticada: empezaría por un índice que se pueda abrir y un banco de preguntas escritas desde afuera; la búsqueda vectorial, el reordenador o el grafo entran cuando ese banco muestre qué falla."
          en: "And I would not start with the most sophisticated architecture: I would start with an index you can open and a bank of questions written from the outside; vector search, the reranker or the graph come in when that bank shows what fails."

