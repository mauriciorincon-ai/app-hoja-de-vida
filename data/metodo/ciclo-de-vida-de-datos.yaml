# «MÉTODOS» · T6 — Cómo se debe estructurar el ciclo de vida de un proyecto de datos a escala (S13, 2026-10-18; voz
# impersonal desde el S14).
#
# Tres voces, separadas por el esquema (src/lib/metodo/schema.ts); en la página: Evidencia · Estado del campo · Criterio.
#   · voz: hice      → la evidencia: solo lo que dice el corpus del sitio, con el proyecto como sujeto;
#                      `corpus:` nombra el documento de data/a-fondo/.
#   · voz: campo     → lo que el campo hace en 2025–2026; `fuentes:` numera la fuente del bloque 10.
#   · voz: posicion  → el criterio del autor, rotulado como tal; sin fuente ni corpus.
# Lo que va sin voz (bloques 1, 2, 6, 7 y la base de las fases) es el método mismo. Desde el S14 todo el texto
# publicado va en voz impersonal —ni primera persona ni «entrevista»—; lo vigila tests/unit/metodo-voz-piezas.test.ts.
#
# Investigación del 2026-10-18: documentación oficial (Microsoft Learn: Fabric y Azure Databricks), solo contenido
# público servido al navegador, sin credenciales ajenas ni endpoints de terceros; ninguna página leída traía texto
# dirigido a agentes. La evidencia sale de `vesting`, `fabric-en-la-practica`, `plataforma-y-despliegue` y
# `certificaciones`. Límites con las palabras del corpus: Eventhouse y KQL a nivel de consulta, como SQL (respuesta
# del dueño, 2026-10-18), Databricks y Snowflake prototipo, Airflow y PySpark en estudio, dbt e Iceberg fuera de sus
# herramientas, la pieza pública de Fabric en exploración. El bloque 7 no lleva cifras propias. Los títulos de la fase 5 y de la evidencia de Vesting
# llevan las palabras de las preguntas del banco, medidas antes de escribirlos.

id: T6
slug: ciclo-de-vida-de-datos
nombre:
  es: "Cómo se debe estructurar el ciclo de vida de un proyecto de datos a escala"
  en: "How the life cycle of a data project at scale should be structured"
bloques:
  # ─── 1 · La pregunta ────────────────────────────────────────────────────────
  - n: 1
    pregunta:
      es: "Diseñar una plataforma de datos y el ciclo de vida de lo que corre en ella para que crezca por integraciones sin multiplicar copias, sin mezclar clientes y sin llevar a producción cambios que nadie probó."
      en: "Designing a data platform and the life cycle of what runs on it so that it grows through integrations without multiplying copies, without mixing clients and without taking untested changes to production."
    respuesta:
      - es: "Se empieza por el recorrido del dato y sus consumidores, no por los componentes: de dónde llega, qué transformación le falta para ser confiable y quién lo consume, con qué motor —personas, aplicaciones o agentes—. Así se diseñó desde cero la plataforma de datos de Vesting en Microsoft Fabric."
        en: "The starting point is the data’s path and its consumers, not the components: where it comes from, what transformation it still needs to be trustworthy and who consumes it, with which engine —people, applications or agents—. That is how Vesting’s data platform was designed from scratch on Microsoft Fabric."
      - es: "Lo común se separa de lo configurable: un contrato de eventos y una normalización temprana para que todo hable el mismo idioma, capas que avanzan de la recepción al consumo, una sola copia del dato en formato abierto y el aislamiento como propiedad de la arquitectura —un workspace por cliente—, no como un filtro."
        en: "What is common is kept apart from what is configurable: an event contract and early normalization so everything speaks the same language, layers that move from intake to consumption, a single copy of the data in an open format and isolation as a property of the architecture —one workspace per client—, not as a filter."
      - es: "El ciclo de vida no termina al publicar: desarrollo, prueba y producción separados, cambios versionados y promovidos entre ambientes, una conciliación que detiene la publicación si una cifra no cuadra y el retiro de lo que dejó de responder a una necesidad."
        en: "The life cycle does not end at publishing: development, test and production kept apart, changes versioned and promoted between environments, a reconciliation that stops publishing when a figure does not add up, and retiring whatever no longer answers a need."

  # ─── 2 · El mapa ────────────────────────────────────────────────────────────
  - n: 2
    titulo:
      es: "De la fuente a quien decide, y del cambio a producción"
      en: "From the source to whoever decides, and from the change to production"
    resumen:
      es: "Las integraciones entregan eventos que deben cumplir un contrato: campos obligatorios, identificadores de contexto y estados comunes. La recepción conserva el evento crudo, la preparación lo valida y lo normaliza, y las tablas de consumo lo sirven en una sola copia, en formato abierto. El modelo semántico gobernado es la definición que leen quienes deciden y también las aplicaciones y los agentes, que consultan la medida en vez de reinterpretar la tabla cruda. Cada cliente tiene su propio workspace sobre las mismas estructuras. Lo que no cuadra al usar el dato llega a la observación y al linaje, que piden un cambio: el cambio nace en desarrollo, pasa una prueba de conciliación y un pipeline de despliegue lo promueve a producción."
      en: "Integrations deliver events that must meet a contract: required fields, context identifiers and common states. Intake keeps the raw event, preparation validates and normalizes it, and the consumption tables serve it as a single copy, in an open format. The governed semantic model is the definition read by whoever decides and also by applications and agents, which query the measure instead of reinterpreting the raw table. Each client has its own workspace on top of the same structures. Whatever does not add up when the data is used reaches observation and lineage, which ask for a change: the change is born in development, passes a reconciliation test and a deployment pipeline promotes it to production."
    nodos:
      - n: 1
        etiqueta: { es: "Fuentes e integraciones", en: "Sources and integrations" }
        tipo: externo
        col: 0
        fila: 0
        detalle:
          es: "Lo que produce los eventos: en Vesting, las integraciones de los agentes y los flujos que los orquestaban."
          en: "Whatever produces the events: at Vesting, the agents’ integrations and the flows that orchestrated them."
      - n: 2
        etiqueta: { es: "Contrato de eventos", en: "Event contract" }
        tipo: control
        col: 1
        fila: 0
        detalle:
          es: "Campos obligatorios, identificadores de contexto y estados comunes; lo que no cumple se ve en el ingreso."
          en: "Required fields, context identifiers and common states; whatever fails it shows up at intake."
      - n: 3
        etiqueta: { es: "Recepción: el evento crudo", en: "Intake: the raw event" }
        tipo: dato
        col: 2
        fila: 0
        detalle:
          es: "El lakehouse conserva el detalle de cada sesión para reconstruir lo que pasó."
          en: "The lakehouse keeps every session’s detail so what happened can be rebuilt."
      - n: 4
        etiqueta: { es: "Preparación y calidad", en: "Preparation and quality" }
        tipo: control
        col: 3
        fila: 0
        detalle:
          es: "Validaciones dentro del pipeline: faltantes, tipos inesperados, duplicados y relaciones que no cierran."
          en: "Validations inside the pipeline: missing values, unexpected types, duplicates and relationships that do not close."
      - n: 5
        etiqueta: { es: "Tablas para el consumo", en: "Consumption tables" }
        tipo: dato
        col: 4
        fila: 0
        detalle:
          es: "Estructuras relacionales y agregados para preguntas predecibles, en una sola copia y en formato abierto."
          en: "Relational structures and aggregates for predictable questions, as a single copy and in an open format."
      - n: 6
        etiqueta: { es: "Semántica gobernada", en: "Governed semantics" }
        tipo: dato
        col: 5
        fila: 0
        detalle:
          es: "Relaciones, medidas y seguridad por fila: la definición que todos consumen."
          en: "Relationships, measures and row-level security: the definition everyone consumes."
      - n: 7
        etiqueta: { es: "Quien decide", en: "Whoever decides" }
        tipo: humano
        col: 5
        fila: 1
        detalle:
          es: "Producto, operaciones y líderes de proceso: leen tableros sobre el mismo significado."
          en: "Product, operations and process leaders: they read dashboards built on the same meaning."
      - n: 8
        etiqueta: { es: "Aplicaciones y agentes", en: "Applications and agents" }
        tipo: actor
        col: 4
        fila: 1
        detalle:
          es: "Consumidores nuevos: leen la medida gobernada en vez de reinterpretar la tabla cruda."
          en: "New consumers: they read the governed measure instead of reinterpreting the raw table."
      - n: 9
        etiqueta: { es: "Un workspace por cliente", en: "One workspace per client" }
        tipo: control
        col: 2
        fila: 1
        detalle:
          es: "El límite de acceso coincide con el límite del cliente, sobre las mismas estructuras comunes."
          en: "The access boundary matches the client’s boundary, on top of the same common structures."
      - n: 10
        etiqueta: { es: "Cambio en desarrollo", en: "Change in development" }
        tipo: dato
        col: 5
        fila: 3
        detalle:
          es: "Toda modificación nace en su ambiente de desarrollo, versionada."
          en: "Every change is born in its development environment, versioned."
      - n: 11
        etiqueta: { es: "Prueba y conciliación", en: "Test and reconciliation" }
        tipo: control
        col: 4
        fila: 3
        detalle:
          es: "La cifra clave del modelo nuevo debe coincidir con la del vigente y con la fuente."
          en: "The key figure in the new model must match the current model’s and the source’s."
      - n: 12
        etiqueta: { es: "Pipeline de despliegue", en: "Deployment pipeline" }
        tipo: control
        col: 3
        fila: 3
        detalle:
          es: "Promueve el cambio de un ambiente al siguiente, con una forma de volver a la versión anterior."
          en: "Promotes the change from one environment to the next, with a way back to the previous version."
      - n: 13
        etiqueta: { es: "Observación y linaje", en: "Observation and lineage" }
        tipo: control
        col: 5
        fila: 2
        detalle:
          es: "Del tablero al modelo, a la tabla y al pipeline: quién responde por cada activo, qué depende de él y qué ya no responde a una necesidad y se retira."
          en: "From the dashboard to the model, the table and the pipeline: who answers for each asset, what depends on it and what no longer answers a need and gets retired."
    aristas:
      - { de: 1, a: 2, etiqueta: { es: "entrega", en: "delivers" } }
      - { de: 2, a: 3, etiqueta: { es: "cumple", en: "complies" } }
      - { de: 3, a: 4 }
      - { de: 4, a: 5, etiqueta: { es: "normaliza", en: "normalizes" } }
      - { de: 5, a: 6 }
      - { de: 6, a: 7, etiqueta: { es: "decide", en: "decides" } }
      - { de: 6, a: 8, etiqueta: { es: "consulta", en: "queries" } }
      - { de: 9, a: 3, etiqueta: { es: "aísla", en: "isolates" } }
      - { de: 7, a: 13, etiqueta: { es: "lo que no cuadra", en: "what does not add up" } }
      - { de: 13, a: 10, etiqueta: { es: "pide un cambio", en: "asks for a change" } }
      - { de: 10, a: 11 }
      - { de: 11, a: 12, etiqueta: { es: "cuadra", en: "adds up" } }
      - { de: 12, a: 4, etiqueta: { es: "promueve", en: "promotes" } }

  # ─── 3 · Las fases ──────────────────────────────────────────────────────────
  - n: 3
    fases:
      - nombre: { es: "Mapear el recorrido del dato y sus consumidores", en: "Map the data’s path and its consumers" }
        entradas:
          - { es: "El proceso, las preguntas y las decisiones que el dato debe sostener.", en: "The process, the questions and the decisions the data must support." }
          - { es: "Las fuentes y sus integraciones.", en: "The sources and their integrations." }
        actividades:
          - es: "Identificar quién consume cada dato y con qué motor: SQL, Spark, el modelo semántico o un agente."
            en: "Identify who consumes each piece of data and with which engine: SQL, Spark, the semantic model or an agent."
          - es: "Decidir qué nivel de detalle se conserva y con qué frecuencia se necesita."
            en: "Decide what level of detail is kept and how often it is needed."
          - es: "Nombrar, para cada dato, la copia que será la referencia."
            en: "Name, for each piece of data, the copy that will be the reference."
        artefactos:
          - { es: "El mapa del recorrido, de la fuente a cada consumidor.", en: "The map of the path, from the source to each consumer." }
        decide: { es: "Quien responde por la plataforma de datos.", en: "Whoever answers for the data platform." }
        control: { es: "Si la respuesta a «cuál copia es la referencia» es «varias», la arquitectura todavía no está terminada.", en: "If the answer to “which copy is the reference” is “several”, the architecture is not finished yet." }
        nota:
          voz: hice
          texto:
            es: "Antes de crear un artefacto en Fabric, la práctica del autor es responder tres preguntas: quién va a consumir este dato y con qué motor, qué transformación le falta para ser confiable y cuál de las copias posibles será la referencia."
            en: "Before creating an artifact in Fabric, the author’s practice is to answer three questions: who is going to consume this data and with which engine, what transformation it still needs to be trustworthy, and which of the possible copies will be the reference."
          corpus: [fabric-en-la-practica]
      - nombre: { es: "Fijar el contrato de eventos y normalizar en el ingreso", en: "Set the event contract and normalize at intake" }
        entradas:
          - { es: "Los eventos que trae cada integración.", en: "The events each integration brings." }
          - { es: "Las entidades comunes: sesión, solicitud, respuesta, estado.", en: "The common entities: session, request, response, state." }
        actividades:
          - es: "Definir campos obligatorios e identificadores de contexto que viajan desde el primer evento."
            en: "Define required fields and context identifiers that travel from the very first event."
          - es: "Validar la estructura en el ingreso y hacer visibles las excepciones."
            en: "Validate the structure at intake and make the exceptions visible."
          - es: "Separar lo común, que permite comparar, de lo configurable, que permite no frenar."
            en: "Separate what is common, which makes comparison possible, from what is configurable, which keeps things moving."
        artefactos:
          - { es: "El contrato de eventos.", en: "The event contract." }
          - { es: "Una representación común de los eventos.", en: "A common representation of the events." }
        decide: { es: "Quien diseña la plataforma, con producto.", en: "Whoever designs the platform, together with product." }
        control: { es: "Un cambio en la estructura de eventos se valida en la recepción antes de tocar un modelo semántico.", en: "A change in the event structure is validated at intake before it can touch a semantic model." }
        nota:
          voz: hice
          texto:
            es: "En Vesting, un agente o un cliente nuevo no podía requerir una tabla nueva para lo que ya tenía nombre en la plataforma; con 27 agentes y 12 clientes, la normalización temprana fue la decisión clave de la arquitectura."
            en: "At Vesting, a new agent or a new client could not require a new table for something that already had a name on the platform; with 27 agents and 12 clients, early normalization was the key decision of the architecture."
          corpus: [vesting]
      - nombre: { es: "Diseñar las capas y servir una sola copia", en: "Design the layers and serve a single copy" }
        entradas:
          - { es: "Los eventos normalizados.", en: "The normalized events." }
          - { es: "Las cargas de trabajo: Spark, SQL y el modelo semántico.", en: "The workloads: Spark, SQL and the semantic model." }
        actividades:
          - es: "Conservar el detalle en la recepción y avanzar por capas cada vez más confiables, con reglas de calidad."
            en: "Keep the detail at intake and move through increasingly trustworthy layers, with quality rules."
          - es: "Asignar cada carga al motor adecuado: el lakehouse para ingeniería y Spark, el warehouse para lo relacional y T-SQL."
            en: "Assign each workload to the right engine: the lakehouse for engineering and Spark, the warehouse for relational work and T-SQL."
          - es: "Aislar por cliente con workspaces separados sobre las mismas estructuras."
            en: "Isolate by client with separate workspaces on top of the same structures."
        artefactos:
          - { es: "El lakehouse con el detalle y las tablas de consumo.", en: "The lakehouse with the detail and the consumption tables." }
          - { es: "Un workspace por cliente.", en: "One workspace per client." }
        decide: { es: "Quien diseña la plataforma.", en: "Whoever designs the platform." }
        control: { es: "Cada transformación tiene un lugar y una referencia: ni el dato ni la lógica se duplican sin razón.", en: "Every transformation has a place and a reference: neither the data nor the logic is duplicated without a reason." }
        nota:
          voz: hice
          texto:
            es: "En Vesting, separar recepción, preparación y consumo permitía que una integración nueva entrara sin tocar las anteriores: la recepción absorbía la variación de cada agente y, desde la preparación, todo hablaba el mismo idioma."
            en: "At Vesting, separating intake, preparation and consumption let a new integration come in without touching the previous ones: intake absorbed each agent’s variation and, from preparation onward, everything spoke the same language."
          corpus: [fabric-en-la-practica]
      - nombre: { es: "Modelar el significado para personas, aplicaciones y agentes", en: "Model the meaning for people, applications and agents" }
        entradas:
          - { es: "Las tablas de consumo.", en: "The consumption tables." }
          - { es: "Las definiciones acordadas con el negocio.", en: "The definitions agreed with the business." }
        actividades:
          - es: "Construir el esquema en estrella, las medidas y la seguridad por fila, probada suplantando roles antes de publicar."
            en: "Build the star schema, the measures and row-level security, tested by impersonating roles before publishing."
          - es: "Elegir el modo de almacenamiento por la frescura, el volumen y el costo que pide cada uso."
            en: "Choose the storage mode by the freshness, volume and cost each use needs."
          - es: "Decidir qué lee un agente: la medida gobernada o la tabla, con su interpretación escrita."
            en: "Decide what an agent reads: the governed measure, or the table with its interpretation written down."
        artefactos:
          - { es: "El modelo semántico gobernado.", en: "The governed semantic model." }
        decide: { es: "El negocio acuerda la definición; la plataforma la convierte en regla.", en: "The business agrees on the definition; the platform turns it into a rule." }
        control: { es: "Una medida crítica no se recalcula libremente: quien la consume la lee del modelo.", en: "A critical measure is not freely recalculated: whoever consumes it reads it from the model." }
        nota:
          voz: hice
          texto:
            es: "Cuando dos personas llegan con cifras distintas para el mismo indicador, el problema se resuelve en la semántica y en la definición acordada, no en la visualización; en Banco Pichincha un indicador con dos definiciones era un problema de gobierno antes que de DAX."
            en: "When two people arrive with different figures for the same indicator, the problem is solved in the semantics and in the agreed definition, not in the visual; at Banco Pichincha an indicator with two definitions was a governance problem before it was a DAX problem."
          corpus: [fabric-en-la-practica]
      - nombre: { es: "El ciclo de vida en Microsoft Fabric: desarrollo, prueba y producción separados", en: "The life cycle in Microsoft Fabric: development, test and production kept apart" }
        entradas:
          - { es: "El cambio que se quiere publicar.", en: "The change that is meant to be published." }
          - { es: "El activo vigente y quién depende de él.", en: "The current asset and who depends on it." }
        actividades:
          - es: "Versionar el modelo semántico como proyecto, en un repositorio Git."
            en: "Version the semantic model as a project, in a Git repository."
          - es: "Promover el cambio entre workspaces separados por ambiente con pipelines de despliegue."
            en: "Promote the change between workspaces separated by environment with deployment pipelines."
          - es: "Conciliar la cifra clave: el modelo nuevo, el vigente y la fuente tienen que coincidir."
            en: "Reconcile the key figure: the new model, the current one and the source have to match."
          - es: "Conocer qué personas, procesos o productos dependen del activo antes de cambiarlo."
            en: "Know which people, processes or products depend on the asset before changing it."
        artefactos:
          - { es: "El cambio versionado y su razón.", en: "The versioned change and its reason." }
          - { es: "La conciliación registrada.", en: "The recorded reconciliation." }
        decide: { es: "Quien responde por el activo.", en: "Whoever answers for the asset." }
        control: { es: "Una diferencia que no se explica detiene la publicación.", en: "A difference that cannot be explained stops publishing." }
        nota:
          voz: campo
          texto:
            es: "Microsoft arma el CI/CD de Fabric con la integración con Git y con pipelines de despliegue entre etapas de desarrollo, prueba y producción; como cada uno liga un workspace a un ambiente, aconseja un workspace por ambiente."
            en: "Microsoft builds Fabric CI/CD on Git integration and on deployment pipelines across development, test and production stages; since each of them links one workspace to one environment, it advises one workspace per environment."
          fuentes: [6, 7]
      - nombre: { es: "Observar, optimizar y retirar", en: "Observe, optimize and retire" }
        entradas:
          - { es: "El uso real y la capacidad consumida.", en: "Real use and the capacity consumed." }
          - { es: "Los activos publicados y su linaje.", en: "The published assets and their lineage." }
        actividades:
          - es: "Recorrer el linaje del tablero al modelo, a la tabla y al pipeline que la cargó."
            en: "Walk the lineage from the dashboard to the model, to the table and to the pipeline that loaded it."
          - es: "Intervenir primero en la capa donde nace el desperdicio, no en la última."
            en: "Step in first at the layer where the waste starts, not at the last one."
          - es: "Retirar lo que dejó de responder a una necesidad, avisando a sus consumidores."
            en: "Retire whatever stopped answering a need, telling its consumers."
        artefactos:
          - { es: "El linaje y la decisión de retiro.", en: "The lineage and the retirement decision." }
        decide: { es: "Quien responde por la plataforma.", en: "Whoever answers for the platform." }
        control: { es: "Ningún activo queda vigente en apariencia: o tiene consumidores y responsable, o se retira.", en: "No asset stays current in appearance only: either it has consumers and an owner, or it is retired." }
        nota:
          voz: campo
          texto:
            es: "Fabric reparte el consumo de cada operación en el tiempo —las interactivas en un mínimo de cinco minutos, las de fondo en 24 horas— y, si la capacidad se sobrecarga, primero retrasa 20 segundos las operaciones interactivas nuevas y después las rechaza."
            en: "Fabric spreads each operation’s consumption over time —interactive ones over a minimum of five minutes, background ones over 24 hours— and, if the capacity gets overloaded, it first delays new interactive operations by 20 seconds and then rejects them."
          fuentes: [9]

  # ─── 4 · Las decisiones de diseño ───────────────────────────────────────────
  - n: 4
    decisiones:
      - titulo: { es: "Lo común y lo configurable en la plataforma de datos de Vesting", en: "What is common and what is configurable in Vesting’s data platform" }
        cuandoSi:
          es: "Común: los eventos fundamentales, los identificadores, los estados y las métricas, con definiciones compartidas que permiten comparar."
          en: "Common: the fundamental events, the identifiers, the states and the metrics, with shared definitions that make comparison possible."
        cuandoNo:
          es: "Configurable: los atributos propios de cada cliente o agente, dentro de una estructura que ya sabe recibirlos y sin rediseñar la plataforma."
          en: "Configurable: each client’s or agent’s own attributes, inside a structure that already knows how to take them and without redesigning the platform."
        porQue:
          voz: hice
          texto:
            es: "La plataforma de datos de Vesting se diseñó con el nivel mínimo de estandarización que conservara la agilidad de la startup sin renunciar a la trazabilidad ni a la calidad."
            en: "Vesting’s data platform was designed with the minimum level of standardization that kept the startup’s agility without giving up traceability or quality."
          corpus: [vesting]
        nota:
          voz: posicion
          texto:
            es: "Lo común es la condición de comparar; lo configurable, la condición de no frenar."
            en: "What is common is the condition for comparing; what is configurable, the condition for not slowing down."
      - titulo: { es: "Capas progresivas o un solo paso", en: "Progressive layers or a single step" }
        cuandoSi:
          es: "Capas, cuando hay varias fuentes, reglas de calidad que aplicar y consumidores distintos que deben leer lo mismo."
          en: "Layers, when there are several sources, quality rules to apply and different consumers that must read the same thing."
        cuandoNo:
          es: "Un paso directo, cuando la fuente ya llega limpia, la consume una sola pregunta y otra capa solo agregaría copias y latencia."
          en: "A direct step, when the source already arrives clean, a single question consumes it and another layer would only add copies and latency."
        porQue:
          voz: campo
          texto:
            es: "La documentación de Azure Databricks presenta la arquitectura medallion —bronce, plata y oro— como una práctica recomendada, pero no como un requisito; Microsoft la llama el enfoque de diseño recomendado para Fabric."
            en: "The Azure Databricks documentation presents the medallion architecture —bronze, silver and gold— as a recommended best practice, but not a requirement; Microsoft calls it the recommended design approach for Fabric."
          fuentes: [4, 3]
        nota:
          voz: posicion
          texto:
            es: "Las capas no son un dogma: cada una tiene que agregar valor sin perder trazabilidad, y la que no agrega nada sobra."
            en: "Layers are not dogma: each one has to add value without losing traceability, and the one that adds nothing is surplus."
      - titulo: { es: "Lakehouse, warehouse o los dos", en: "Lakehouse, warehouse or both" }
        cuandoSi:
          es: "Los dos, cuando hay una razón funcional: el lakehouse para conservar y transformar eventos con mucho detalle; el warehouse para relaciones, métricas y consultas predecibles."
          en: "Both, when there is a functional reason: the lakehouse to keep and transform highly detailed events; the warehouse for relationships, metrics and predictable queries."
        cuandoNo:
          es: "Los dos por si acaso, sin una regla sobre dónde ocurre cada transformación ni cuál copia es la referencia."
          en: "Both just in case, without a rule on where each transformation happens or which copy is the reference."
        porQue:
          voz: hice
          texto:
            es: "En Vesting el lakehouse conservaba los eventos de los agentes —sesión, solicitud, respuesta, tiempo, estado, costo— y el warehouse organizaba lo que pedían los tableros de producto y operaciones."
            en: "At Vesting the lakehouse kept the agents’ events —session, request, response, time, state, cost— and the warehouse organized what the product and operations dashboards needed."
          corpus: [fabric-en-la-practica]
        nota:
          voz: campo
          texto:
            es: "En OneLake los motores de Fabric —T-SQL, Spark, Analysis Services— guardan las tablas en Delta Parquet, de modo que el mismo dato se lee con otro motor sin copiarlo."
            en: "In OneLake the Fabric engines —T-SQL, Spark, Analysis Services— store tables in Delta Parquet, so the same data is read by another engine without copying it."
          fuentes: [1]
      - titulo: { es: "Aislar por cliente: un workspace propio o un filtro en el modelo", en: "Isolating by client: a workspace of its own or a filter in the model" }
        cuandoSi:
          es: "Un workspace por cliente, cuando el límite de acceso debe coincidir con el límite del cliente y un cambio en uno no puede tocar a otro."
          en: "One workspace per client, when the access boundary must match the client’s boundary and a change for one cannot touch another."
        cuandoNo:
          es: "Solo un filtro de seguridad por fila, cuando todos los datos tienen un mismo dueño y un filtro mal escrito es un riesgo aceptable."
          en: "Only a row-level security filter, when all the data has a single owner and a badly written filter is an acceptable risk."
        porQue:
          voz: hice
          texto:
            es: "En Vesting el aislamiento entre los 12 clientes se resolvió con workspaces separados sobre las estructuras de eventos comunes: el límite no dependía de un filtro bien escrito."
            en: "At Vesting isolation between the 12 clients was solved with separate workspaces on top of the common event structures: the boundary did not depend on a well-written filter."
          corpus: [vesting]
        nota:
          voz: hice
          texto:
            es: "La seguridad por fila seguía en el modelo, definida como filtros DAX sobre las dimensiones y probada suplantando roles antes de publicar."
            en: "Row-level security stayed in the model, defined as DAX filters on the dimensions and tested by impersonating roles before publishing."
          corpus: [fabric-en-la-practica]
      - titulo: { es: "Copiar el dato o leerlo donde está", en: "Copying the data or reading it where it lives" }
        cuandoSi:
          es: "Leerlo donde está, con un atajo o un espejado, cuando la fuente ya está en un formato abierto o en otro workspace y la frescura importa."
          en: "Reading it where it lives, with a shortcut or mirroring, when the source is already in an open format or in another workspace and freshness matters."
        cuandoNo:
          es: "Copiarlo, cuando la fuente necesita una disposición optimizada para consultas o no cumple lo que se le pide sin copia."
          en: "Copying it, when the source needs a query-optimized layout or cannot meet what is required of it without a copy."
        porQue:
          voz: campo
          texto:
            es: "Microsoft recomienda los atajos para incluir un dato sin copiarlo y propone espejar una fuente una sola vez para que los demás workspaces la consuman con atajos, sin crear otra copia."
            en: "Microsoft recommends shortcuts to include data without copying it and proposes mirroring a source once so the other workspaces consume it through shortcuts, without creating another copy."
          fuentes: [2]
        nota:
          voz: posicion
          texto:
            es: "Cada copia necesita una razón escrita: la copia sin razón es la que mañana dice otra cifra."
            en: "Every copy needs a written reason: the copy without one is the one that will show a different figure tomorrow."
      - titulo: { es: "Direct Lake, importación o DirectQuery", en: "Direct Lake, import or DirectQuery" }
        cuandoSi:
          es: "Direct Lake para lo que debe verse al momento sobre tablas Delta; importación para el histórico agregado; DirectQuery para el detalle que no cabe en memoria y se consulta poco."
          en: "Direct Lake for what must be seen right away on Delta tables; import for the aggregated history; DirectQuery for the detail that does not fit in memory and is rarely queried."
        cuandoNo:
          es: "Un solo modo para todo el modelo, cuando hay preguntas de distinta frescura, volumen y costo."
          en: "A single mode for the whole model, when there are questions with different freshness, volume and cost."
        porQue:
          voz: hice
          texto:
            es: "En Vesting un mismo modelo combinaba los tres modos: Direct Lake para el monitoreo operativo, importación para el histórico y DirectQuery para bajar a los eventos de una sesión."
            en: "At Vesting a single model combined the three modes: Direct Lake for operational monitoring, import for the history and DirectQuery to drill down to a session’s events."
          corpus: [fabric-en-la-practica]
        nota:
          voz: campo
          texto:
            es: "Microsoft separa Direct Lake sobre OneLake, que no recurre a DirectQuery y es la opción recomendada para modelos nuevos, de Direct Lake sobre el punto de conexión SQL, que sí puede caer en DirectQuery y volverse más lento."
            en: "Microsoft separates Direct Lake on OneLake, which does not fall back to DirectQuery and is the recommended option for new models, from Direct Lake on the SQL analytics endpoint, which can fall back to DirectQuery and become slower."
          fuentes: [8]

  # ─── 5 · Lo innovador en 2026 ───────────────────────────────────────────────
  - n: 5
    elementos:
      - titulo: { es: "Una sola copia en OneLake, en Delta o en Iceberg", en: "A single copy in OneLake, in Delta or in Iceberg" }
        queCambia:
          es: "OneLake virtualiza los metadatos entre formatos abiertos: una tabla Iceberg se lee como Delta en Fabric y una Delta se lee con lectores Iceberg, sin conversión manual; cuando una conversión falla o descarta una columna, lo deja en un registro."
          en: "OneLake virtualizes metadata across open formats: an Iceberg table is read as Delta in Fabric and a Delta table is read by Iceberg readers, with no manual conversion; when a conversion fails or drops a column, it is written to a log."
        fuentes: [1, 13]
        nota:
          voz: hice
          texto:
            es: "En Vesting las tablas vivían en Delta sobre OneLake y el modelo las leía desde ahí; Apache Iceberg salió de la lista de herramientas del autor por no haberse usado."
            en: "At Vesting the tables lived in Delta on OneLake and the model read them from there; Apache Iceberg left the author’s list of tools for lack of use."
          corpus: [fabric-en-la-practica, plataforma-y-despliegue]
      - titulo: { es: "Atajos y espejado: leer el dato donde está", en: "Shortcuts and mirroring: reading data where it lives" }
        queCambia:
          es: "Los atajos hacen que datos de otro workspace, de otra nube o de otro lago aparezcan en OneLake sin copiarlos; el espejado replica una base operativa como tablas Delta o sincroniza solo un catálogo externo, y Microsoft propone espejar una vez y consumir en todas partes."
          en: "Shortcuts make data from another workspace, another cloud or another lake show up in OneLake without copying it; mirroring replicates an operational database as Delta tables or synchronizes only an external catalog, and Microsoft proposes mirroring once and consuming everywhere."
        fuentes: [1, 2]
        nota:
          voz: posicion
          texto:
            es: "Antes de copiar, conviene preguntar si un atajo basta: menos copias son menos cifras que pueden contradecirse."
            en: "Before copying, it is worth asking whether a shortcut is enough: fewer copies are fewer figures that can contradict each other."
      - titulo: { es: "Capas declarativas con vistas materializadas del lakehouse", en: "Declarative layers with materialized lake views" }
        queCambia:
          es: "Las vistas materializadas del lakehouse, definidas en Spark SQL o —en versión preliminar y solo con actualización completa— en PySpark, expresan como declaraciones las transformaciones de bronce a plata y a oro: Fabric sigue sus dependencias, las refresca en orden y aplica reglas de calidad en cada etapa; Microsoft advierte que no sirven para lógica que no es SQL ni para flujos que piden actualizaciones de menos de un segundo."
          en: "Materialized lake views, defined in Spark SQL or —in preview, and with full refresh only— in PySpark, express the bronze-to-silver-to-gold transformations as declarative statements: Fabric tracks their dependencies, refreshes them in order and enforces quality rules at every stage; Microsoft warns they do not fit non-SQL logic or streams that need sub-second updates."
        fuentes: [5]
        nota:
          voz: hice
          texto:
            es: "Las reglas de calidad viven dentro de los pipelines: faltantes, tipos inesperados, duplicados y relaciones que no cierran se ven antes de llegar al modelo."
            en: "The quality rules live inside the pipelines: missing values, unexpected types, duplicates and relationships that do not close show up before they reach the model."
          corpus: [fabric-en-la-practica]
      - titulo: { es: "CI/CD de Fabric: Git, pipelines de despliegue y variables por etapa", en: "Fabric CI/CD: Git, deployment pipelines and per-stage variables" }
        queCambia:
          es: "El CI/CD de Fabric junta la integración con Git, los pipelines de despliegue entre desarrollo, prueba y producción, una biblioteca de variables con valores por etapa y un plan de despliegue que fija el orden en que se despliegan los elementos."
          en: "Fabric CI/CD brings together Git integration, deployment pipelines across development, test and production, a variable library with values per stage and a deployment plan that sets the order in which items deploy."
        fuentes: [6]
        nota:
          voz: hice
          texto:
            es: "El modelo semántico se versiona como proyecto —con Tabular Editor o en formato PBIP, en un repositorio Git— para comparar un cambio y volver a la versión anterior sin reconstruir nada a mano."
            en: "The semantic model is versioned as a project —with Tabular Editor or in PBIP format, in a Git repository— to compare a change and go back to the previous version without rebuilding anything by hand."
          corpus: [fabric-en-la-practica]
      - titulo: { es: "El agente de datos de Fabric sobre el modelo gobernado", en: "The Fabric data agent on top of the governed model" }
        queCambia:
          es: "Un agente de datos de Fabric responde en lenguaje natural sobre lakehouses, warehouses, modelos semánticos y bases KQL: genera solo consultas de lectura, con las credenciales y los permisos de quien pregunta, y sus respuestas se limitan a 25 filas y 25 columnas."
          en: "A Fabric data agent answers in natural language over lakehouses, warehouses, semantic models and KQL databases: it only generates read queries, with the credentials and permissions of whoever asks, and its answers are capped at 25 rows and 25 columns."
        fuentes: [10]
        nota:
          voz: hice
          texto:
            es: "Un agente que lee una medida gobernada hereda su definición; uno que lee una tabla cruda hereda la obligación de interpretarla, y esa obligación tiene que estar escrita en alguna parte."
            en: "An agent that reads a governed measure inherits its definition; one that reads a raw table inherits the obligation to interpret it, and that obligation has to be written down somewhere."
          corpus: [fabric-en-la-practica]
      - titulo: { es: "Fabric y Databricks: un puente entre catálogos", en: "Fabric and Databricks: a bridge between catalogs" }
        queCambia:
          es: "Muchas organizaciones registran sus datos en Unity Catalog, dentro de Azure Databricks; Fabric puede espejar ese catálogo sin mover ni replicar los datos —solo copia la estructura y los lee por atajos—, de modo que lee las mismas tablas sin copiarlas, con cambios que pueden tardar de segundos a minutos en verse."
          en: "Many organizations register their data in Unity Catalog, within Azure Databricks; Fabric can mirror that catalog without moving or replicating the data —it only copies the structure and reads the data through shortcuts—, so it reads the same tables without copying them, with changes that can take from seconds to minutes to show up."
        fuentes: [11]
        nota:
          voz: hice
          texto:
            es: "En el perfil del autor, Databricks y Snowflake figuran como prototipo; Microsoft Fabric es la plataforma usada de extremo a extremo, en Vesting."
            en: "On the author’s profile, Databricks and Snowflake are listed as prototype; Microsoft Fabric is the platform used end to end, at Vesting."
          corpus: [plataforma-y-despliegue, vesting]
      - titulo: { es: "El DP-600 que se evalúa a partir del 19 de octubre de 2026", en: "The DP-600 as assessed from October 19, 2026" }
        queCambia:
          es: "La guía del DP-600 pide configurar el control de versiones de un workspace, crear pipelines de despliegue, analizar el impacto sobre lo que depende de un lakehouse o de un modelo y elegir entre Direct Lake sobre OneLake y sobre el punto de conexión SQL."
          en: "The DP-600 guide asks for configuring version control for a workspace, creating deployment pipelines, analyzing the impact on whatever depends on a lakehouse or a model, and choosing between Direct Lake on OneLake and on the SQL analytics endpoint."
        fuentes: [12]
        nota:
          voz: hice
          texto:
            es: "El DP-600 se obtuvo en diciembre de 2024, dentro del rol del autor en Vesting, mientras se construía la plataforma que el temario describe."
            en: "The DP-600 was earned in December 2024, within the author’s role at Vesting, while the platform the syllabus describes was being built."
          corpus: [fabric-en-la-practica, vesting]

  # ─── 6 · Modos de falla y cómo se ven venir ─────────────────────────────────
  - n: 6
    fallas:
      - falla: { es: "Cada integración trae su propia tabla", en: "Every integration brings its own table" }
        senal: { es: "Un cliente o un agente nuevo obliga a reescribir pipelines y métricas que ya existían.", en: "A new client or agent forces rewriting pipelines and metrics that already existed." }
        control: { es: "Contrato de eventos y normalización temprana: lo que ya tiene nombre no se vuelve a modelar.", en: "An event contract and early normalization: whatever already has a name is not modeled again." }
      - falla: { es: "Dos cifras para el mismo indicador", en: "Two figures for the same indicator" }
        senal: { es: "Dos personas llegan a la reunión con resultados distintos para la misma métrica.", en: "Two people arrive at the meeting with different results for the same metric." }
        control: { es: "Una definición acordada con su responsable, convertida en medida del modelo gobernado.", en: "A definition agreed with its owner, turned into a measure of the governed model." }
      - falla: { es: "Una copia sin dueño se vuelve la verdad de alguien", en: "A copy without an owner becomes someone’s truth" }
        senal: { es: "Varias copias del mismo dato y nadie sabe cuál es la referencia.", en: "Several copies of the same data and nobody knows which one is the reference." }
        control: { es: "Una referencia por dato, una razón escrita para cada copia y atajos antes que copias.", en: "One reference per piece of data, a written reason for every copy and shortcuts before copies." }
      - falla: { es: "Un cliente ve datos de otro", en: "One client sees another client’s data" }
        senal: { es: "Un filtro mal escrito o un modelo compartido entre audiencias que no deberían cruzarse.", en: "A badly written filter or a model shared between audiences that should not cross." }
        control: { es: "Un workspace por cliente y seguridad por fila probada suplantando roles antes de publicar.", en: "One workspace per client and row-level security tested by impersonating roles before publishing." }
      - falla: { es: "Un cambio publicado mueve una cifra en silencio", en: "A published change moves a figure silently" }
        senal: { es: "Un despliegue que termina bien y aun así produce otro total.", en: "A deployment that finishes fine and still produces a different total." }
        control: { es: "Conciliación de la cifra clave contra el modelo vigente y la fuente; una diferencia sin explicación detiene la publicación.", en: "Reconciling the key figure against the current model and the source; an unexplained difference stops publishing." }
      - falla: { es: "La capacidad se agota y el tablero se vuelve lento", en: "Capacity runs out and the dashboard gets slow" }
        senal: { es: "Operaciones interactivas retrasadas o rechazadas; consumo que sube sin que suban los usuarios.", en: "Interactive operations delayed or rejected; consumption rising without more users." }
        control: { es: "Intervenir en la capa donde nace el desperdicio antes de comprar más capacidad, y vigilar la capacidad compartida.", en: "Stepping in at the layer where the waste starts before buying more capacity, and watching the shared capacity." }
      - falla: { es: "Un agente reinterpreta una tabla cruda", en: "An agent reinterprets a raw table" }
        senal: { es: "Respuestas con cifras que no coinciden con las medidas oficiales.", en: "Answers with figures that do not match the official measures." }
        control: { es: "El agente consulta la medida gobernada; la tabla cruda, solo con su interpretación escrita.", en: "The agent queries the governed measure; the raw table only with its written interpretation." }
      - falla: { es: "Un activo retirado sigue en uso", en: "A retired asset is still in use" }
        senal: { es: "Reportes y modelos que nadie mantiene pero alguien sigue abriendo.", en: "Reports and models nobody maintains but someone keeps opening." }
        control: { es: "Linaje para conocer a sus consumidores, aviso del cambio y retiro explícito.", en: "Lineage to know its consumers, notice of the change and an explicit retirement." }

