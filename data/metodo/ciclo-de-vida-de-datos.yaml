      - voz: hice
        texto:
          es: "En el perfil del autor, Databricks y Snowflake figuran como prototipo; Airflow y PySpark, en estudio; el 27 de septiembre de 2026 dbt y Apache Iceberg salieron de su lista de herramientas por no haberse usado."
          en: "On the author’s profile, Databricks and Snowflake are listed as prototype; Airflow and PySpark, in study; on September 27, 2026 dbt and Apache Iceberg left the list of tools for lack of use."
        corpus: [plataforma-y-despliegue]
      - voz: hice
        texto:
          es: "Esta publicación no describe experiencia con AWS ni con Redshift: la plataforma de datos de extremo a extremo de la evidencia es Microsoft Fabric, en Vesting."
          en: "This publication does not describe experience with AWS or Redshift: the end-to-end data platform in the evidence is Microsoft Fabric, at Vesting."
        corpus: [vesting]
      - voz: hice
        texto:
          es: "La pieza pública de Fabric con datos abiertos de Colombia sigue en exploración: no se presenta como construida."
          en: "The public Fabric piece with Colombian open data is still in exploration: it is not presented as built."
        corpus: [fabric-en-la-practica]
      - voz: posicion
        texto:
          es: "Lo que conviene hacer distinto hoy: empezar los modelos nuevos con Direct Lake sobre OneLake y dejar DirectQuery solo para el detalle que no cabe en memoria."
          en: "What should be done differently today: start new models with Direct Lake on OneLake and leave DirectQuery only for the detail that does not fit in memory."
      - voz: posicion
        texto:
          es: "Entre Fabric y Databricks no conviene elegir por el motor sino por dónde vive ya el gobierno de la organización y quién lo opera; con el catálogo espejado, la pregunta deja de ser una u otra."
          en: "Between Fabric and Databricks the choice should not follow the engine but where the organization’s governance already lives and who runs it; with the catalog mirrored, the question stops being one or the other."

