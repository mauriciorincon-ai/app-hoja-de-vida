  # ─── 9 · Lo que haría distinto y lo que no he hecho ─────────────────────────
  - n: 9
    limites:
      - voz: hice
        texto:
          es: "Eventhouse y KQL los conoce el autor a nivel de consulta, como SQL —el DP-600 exige trabajar con SQL, KQL y DAX—, no por un proyecto."
          en: "The author knows Eventhouse and KQL at the query level, like SQL —the DP-600 requires working with SQL, KQL and DAX—, not from a project."
