# T8 · «Cómo se debe decidir con modelos» (S19, 2026-10-21).
#
# Publicación de «Métodos» en voz impersonal desde el primer commit: diez bloques fijos, tres voces separadas
# (Evidencia = corpus del sitio, con el proyecto como sujeto · Estado del campo = fuente con título, editor, fecha
# y enlace · Criterio = posición del autor, rotulada). Ninguna cifra sin corpus; nada sube de nivel.
#
# Investigación del 2026-10-21 (21:59 → 22:01): documentación oficial primero —Microsoft Learn (la ciencia de datos en
# Microsoft Fabric, el registro automático con MLflow y MLflow 3, el modelo de madurez de MLOps, la vigilancia de modelos
# de Azure Machine Learning y la guía del examen AI-300)— y arXiv (GIFT-Eval y una reconstrucción de 2026 de los modelos
# fundacionales de series de tiempo; OptiMUS-0.3 y MIPLIB-NL sobre el LLM como asistente de formulación). Solo contenido
# público servido al navegador, sin credenciales ajenas ni endpoints de terceros; ninguna página leída traía texto dirigido
# a agentes. Hallazgos: el glosario de Gartner sobre inteligencia de decisiones respondió 403 (no se forzó; el tema no
# entra, porque ninguna otra fuente oficial lo sostenía). La fecha de cada fuente de Learn es su `ms.date`; la de arXiv, la
# de la versión leída.
#
# La evidencia sale de `analitica-predictiva`, `transmilenio-cm`, `banco-pichincha`, `las-investigaciones`,
# `procesos-y-simulacion`, `cm-operaciones`, `plataforma-y-despliegue` y `certificaciones`. Probeta DS se enlaza a su
# ficha (`/vitrina/apps/ds`), no se reescribe, y va como «Prototipo»: la vitrina la ofrece con lista de espera y su ficha
# está en estado inicial (el cierre del sprint lo lleva como [CONFIRMAR]); no se cita su número de funcionalidades porque
# el corpus (33) y la ficha de hoy no coinciden. Sin caso propio de deriva observada, sin capa prescriptiva en un empleo,
# PyTorch y TensorFlow como exploración, el DP-100 retirado y el AI-300 en curso. El título de la decisión 4 y el de la
# tarjeta de Probeta DS llevan las palabras de las preguntas que el banco exige («formula un problema de optimización»,
# «qué garantiza»). El bloque 7 no lleva cifras propias.

id: T8
slug: decidir-con-modelos
nombre:
  es: "Cómo se debe decidir con modelos"
  en: "How decisions should be made with models"
bloques:
  # ─── 1 · El problema ────────────────────────────────────────────────────────
  - n: 1
    pregunta:
      es: "Decidir con modelos sin engañarse: que cada modelo supere una línea base, se valide como lo enfrentará la operación, llegue con sus límites a quien decide y se vigile después de entregarlo, y que la optimización se formule de modo que su resultado se pueda verificar."
      en: "Making decisions with models without fooling oneself: every model has to beat a baseline, be validated the way operations will face it, reach the decision maker with its limits and be monitored after delivery, and optimization has to be formulated so that its result can be verified."
    respuesta:
      - es: "El problema nace del proceso: qué se anticipa, sobre qué unidad, con cuánta anticipación y qué decisión cambia con el resultado; y antes del algoritmo, la línea base que el modelo tiene que superar."
        en: "The problem starts from the process: what is anticipated, on which unit, how far ahead and which decision changes with the result; and before the algorithm, the baseline the model has to beat."
      - es: "El modelo se valida como lo enfrentará la operación —orden temporal, prueba sin fuga, error por segmento— y llega con su ficha y sus límites a quien decide, que recibe una señal y no una decisión."
        en: "The model is validated the way operations will face it —temporal order, a leak-free test, error by segment— and reaches the decision maker with its card and its limits, as a signal and not a decision."
      - es: "Cuando la pregunta es qué elegir y no qué pasará, el problema se formula como optimización, dos veces, y se simula bajo variabilidad; y todo modelo publicado se vigila, porque la deriva no avisa."
        en: "When the question is what to choose and not what will happen, the problem is formulated as optimization, twice, and simulated under variability; and every published model is monitored, because drift gives no warning."

  # ─── 2 · El mapa ────────────────────────────────────────────────────────────
  - n: 2
    titulo:
      es: "Del problema del proceso a la decisión vigilada"
      en: "From the process problem to a monitored decision"
    resumen:
      es: "El dueño de la decisión define el problema y su horizonte; primero se fija la línea base y después se construyen las variables con lo que existe a tiempo. El modelo candidato se valida en orden temporal y se mide en una prueba sin fuga; sus errores se leen por segmento, se escriben en la ficha del modelo y la predicción se entrega donde se decide. Quien decide recibe una señal; cuando la pregunta es qué elegir, entra la optimización, y la simulación aporta escenarios a lo que se entrega. En operación, la vigilancia de la deriva avisa al dueño de la decisión."
      en: "The decision owner defines the problem and its horizon; the baseline is set first, and then the variables are built from what exists in time. The candidate model is validated in temporal order and measured on a leak-free test; its errors are read by segment and written into the model card, and the prediction is delivered where the decision is made. The decision maker receives a signal; when the question is what to choose, optimization comes in, and simulation adds scenarios to what is delivered. In operation, drift monitoring alerts the decision owner."
    nodos:
      - n: 1
        etiqueta: { es: "Dueño de la decisión", en: "Decision owner" }
        tipo: humano
        col: 0
        fila: 0
        detalle:
          es: "Quien responde por la decisión que el modelo debe mejorar y fija qué error cuesta más."
          en: "Whoever answers for the decision the model has to improve and sets which error costs more."
      - n: 2
        etiqueta: { es: "Problema y horizonte", en: "Problem and horizon" }
        tipo: control
        col: 1
        fila: 0
        detalle:
          es: "Qué se anticipa, sobre qué unidad, con cuánta anticipación y qué decisión puede cambiar con el resultado."
          en: "What is anticipated, on which unit, how far ahead and which decision can change with the result."
      - n: 3
        etiqueta: { es: "Línea base", en: "Baseline" }
        tipo: control
        col: 2
        fila: 0
        detalle:
          es: "Una regla simple, una media histórica o la forma actual de decidir: lo que el modelo tiene que superar."
          en: "A simple rule, a historical average or the current way of deciding: what the model has to beat."
      - n: 4
        etiqueta: { es: "Variables a tiempo", en: "Data known in time" }
        tipo: dato
        col: 3
        fila: 0
        detalle:
          es: "Solo lo que existe en el momento de predecir: nada del futuro filtrado al entrenamiento."
          en: "Only what exists at prediction time: nothing from the future leaked into training."
      - n: 5
        etiqueta: { es: "Modelo candidato", en: "Candidate model" }
        tipo: actor
        col: 4
        fila: 0
        detalle:
          es: "Los modelos compiten con el mismo preprocesamiento y se eligen por su error, no por su novedad."
          en: "Models compete with the same preprocessing and are chosen by their error, not by their novelty."
      - n: 6
        etiqueta: { es: "Orden temporal", en: "Temporal order" }
        tipo: control
        col: 5
        fila: 0
        detalle:
          es: "Se entrena con el pasado y se mide sobre periodos posteriores, como lo enfrentará la operación."
          en: "Training uses the past and measurement uses later periods, the way operations will face it."
      - n: 7
        etiqueta: { es: "Prueba sin fuga", en: "Leak-free test" }
        tipo: control
        col: 5
        fila: 1
        detalle:
          es: "Las métricas salen de datos que el entrenamiento no vio, con el preprocesamiento ajustado solo en entrenamiento."
          en: "The metrics come from data training never saw, with preprocessing fitted on the training data only."
      - n: 8
        etiqueta: { es: "Errores por segmento", en: "Errors per segment" }
        tipo: dato
        col: 4
        fila: 1
        detalle:
          es: "La matriz de confusión, el error por ruta, clase o grupo y lo que cuesta cada tipo de error."
          en: "The confusion matrix, the error by route, class or group and what each kind of error costs."
      - n: 9
        etiqueta: { es: "La ficha del modelo", en: "The model card" }
        tipo: dato
        col: 3
        fila: 1
        detalle:
          es: "Datos, partición, método, métricas, veredicto frente a la línea base y límites, escritos."
          en: "Data, split, method, metrics, verdict against the baseline and limits, written down."
      - n: 10
        etiqueta: { es: "Entrega donde se decide", en: "Delivery at the decision" }
        tipo: actor
        col: 2
        fila: 1
        detalle:
          es: "La predicción llega con su contexto al tablero o al informe que ya se usa, antes de que la decisión se cierre."
          en: "The prediction arrives with its context in the dashboard or report already in use, before the decision closes."
      - n: 11
        etiqueta: { es: "Quien decide", en: "Decision maker" }
        tipo: humano
        col: 1
        fila: 1
        detalle:
          es: "Recibe una señal, no una decisión: prioriza, revisa y responde por la acción."
          en: "Receives a signal, not a decision: prioritizes, reviews and answers for the action."
      - n: 12
        etiqueta: { es: "Vigilancia y deriva", en: "Monitoring and drift" }
        tipo: control
        col: 0
        fila: 1
        detalle:
          es: "Entradas, distribución, desempeño, uso e impacto, vigilados después de publicar y no solo antes."
          en: "Inputs, distribution, performance, use and impact, monitored after publishing and not only before."
      - n: 13
        etiqueta: { es: "Optimización", en: "Optimization" }
        tipo: actor
        col: 1
        fila: 2
        detalle:
          es: "El mismo problema como programación entera y como programación por restricciones: los óptimos deben coincidir."
          en: "The same problem as integer programming and as constraint programming: the optima must match."
      - n: 14
        etiqueta: { es: "Simulación", en: "Simulation" }
        tipo: actor
        col: 2
        fila: 2
        detalle:
          es: "Compara políticas y asignaciones bajo variabilidad antes de intervenir la operación."
          en: "Compares policies and assignments under variability before intervening in operations."
    aristas:
      - { de: 1, a: 2, etiqueta: { es: "define", en: "defines" } }
      - { de: 2, a: 3, etiqueta: { es: "primero", en: "first" } }
      - { de: 3, a: 4, etiqueta: { es: "después", en: "then" } }
      - { de: 4, a: 5, etiqueta: { es: "entrena", en: "trains" } }
      - { de: 5, a: 6, etiqueta: { es: "se valida", en: "is validated" } }
      - { de: 6, a: 7, etiqueta: { es: "se mide", en: "is measured" } }
      - { de: 7, a: 8, etiqueta: { es: "muestra", en: "shows" } }
      - { de: 8, a: 9, etiqueta: { es: "se escribe", en: "is written" } }
      - { de: 9, a: 10, etiqueta: { es: "se entrega", en: "is delivered" } }
      - { de: 10, a: 11, etiqueta: { es: "informa", en: "informs" } }
      - { de: 11, a: 12, etiqueta: { es: "en operación", en: "in operation" } }
