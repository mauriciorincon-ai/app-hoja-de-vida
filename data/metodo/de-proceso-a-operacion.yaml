# T9 · «Cómo se debe convertir un proceso en una operación inteligente» (S18, 2026-10-21).
#
# Publicación de «Métodos» en voz impersonal desde el primer commit: diez bloques fijos, tres voces separadas
# (Evidencia = corpus del sitio, con el proyecto como sujeto · Estado del campo = fuente con título, editor, fecha
# y enlace · Criterio = posición del autor, rotulada). Ninguna cifra sin corpus; nada sube de nivel.
#
# Investigación del 2026-10-21 (19:36 → 19:41): documentación oficial primero —Microsoft Learn (minería de procesos
# y registros centrados en objetos en Power Automate, la guía HEAT y el modelo de madurez de automatización, los flujos
# de escritorio, los flujos de agente y las herramientas de Copilot Studio, los patrones de agentes orientados a flujo),
# la IEC (ISO/IEC 19510, la norma de BPMN) y arXiv (la especificación OCEL 2.0)—. Solo contenido público servido al
# navegador, sin credenciales ajenas ni endpoints de terceros; ninguna página leída traía texto dirigido a agentes.
# Hallazgos: ocel-standard.org no publica fecha (se cita la especificación en arXiv, del 2024-03-04); la página de la
# OMG sobre BPMN 2.0.2 solo dice «enero de 2014», sin día (se cita la ISO/IEC 19510 en la IEC, con fecha completa);
# iso.org no se leyó (en el S16 respondió con un desafío anti-bot). La fecha de cada fuente de Learn es su `ms.date`.
#
# La evidencia sale de `procesos-y-simulacion`, `como-trabajo`, `ceinfes`, `cafam`, `vesting`, `agentes-en-produccion`,
# `las-investigaciones` y `fundacion-ctic`. La RPA y los flujos low-code (Power Automate, Power Apps, Copilot Studio) no
# tienen un caso en ningún documento a fondo: aquí son estado del campo, nunca experiencia, y el cierre del sprint lo
# lleva como [CONFIRMAR]. FORJA se enlaza a T2 (`/metodos/sistema-de-agentes#bloque-4`), no se reescribe. El título de la
# fase 3 y el de la decisión 2 llevan las palabras de la pregunta que el banco exige («decide qué automatizar y con qué
# herramienta»), medidas antes de fijarlos. El bloque 7 no lleva cifras propias.

id: T9
slug: de-proceso-a-operacion
nombre:
  es: "Cómo se debe convertir un proceso en una operación inteligente"
  en: "How a process should be turned into an intelligent operation"
bloques:
  # ─── 1 · El problema ────────────────────────────────────────────────────────
  - n: 1
    pregunta:
      es: "Convertir un proceso en una operación inteligente sin automatizar un proceso malo: modelarlo antes de tocar la tecnología, decidir qué automatizar y con qué herramienta, y dejar a cada decisión el control humano que su riesgo exige."
      en: "Turning a process into an intelligent operation without automating a bad process: modeling it before touching the technology, deciding what to automate and with which tool, and giving each decision the human control its risk calls for."
    respuesta:
      - es: "El proceso va antes que la herramienta: un BPMN con responsables, compuertas, eventos y datos sirve para acordar con el negocio, especificar para tecnología y decidir qué eventos capturar para medir."
        en: "The process comes before the tool: a BPMN with owners, gateways, events and data serves to agree with the business, specify for technology and decide which events to capture in order to measure."
      - es: "La herramienta se elige subiendo una escalera: primero la intervención más sencilla —arreglar el proceso, una regla en código—, después los flujos y, solo donde hace falta interpretar, un agente con límites."
        en: "The tool is chosen by climbing a ladder: first the simplest intervention —fixing the process, a rule in code—, then flows and, only where interpretation is needed, an agent with limits."
      - es: "Cada automatización se mide contra el proceso que reemplaza y se vigila después: el ritmo lo fija la capacidad real, no el cronograma, y la autonomía crece con la evidencia."
        en: "Every automation is measured against the process it replaces and monitored afterwards: the pace is set by real capacity, not by the schedule, and autonomy grows with the evidence."

  # ─── 2 · El mapa ────────────────────────────────────────────────────────────
  - n: 2
    titulo:
      es: "Del proceso acordado a la operación inteligente, peldaño por peldaño"
      en: "From an agreed process to an intelligent operation, rung by rung"
    resumen:
      es: "El dueño del proceso lo modela en BPMN; lo esperado se contrasta con lo ejecutado, que llega del registro de eventos, y el proceso se corrige antes de medir su capacidad real y su restricción. Con esa medida se prioriza qué automatizar y se empieza por el peldaño más sencillo: código y reglas; si no hay API, RPA sobre la interfaz; con conectores, flujos low-code; con la plataforma de datos, flujos de n8n; y solo donde hay que interpretar, un agente con código. El agente actúa dentro de límites, bajo un control humano que depende del tipo de decisión; la operación queda observable, deja su rastro en el registro de eventos y se mide, y las métricas vuelven al dueño del proceso."
      en: "The process owner models it in BPMN; what is expected is checked against what was executed, which comes from the event log, and the process is fixed before its real capacity and its constraint are measured. With that measurement, what to automate is prioritized and the work starts on the simplest rung: code and rules; with no API, RPA on the interface; with connectors, low-code flows; with the data platform, n8n flows; and only where interpretation is needed, an agent in code. The agent acts within limits, under a human control that depends on the type of decision; the operation stays observable, leaves its trace in the event log and is measured, and the metrics go back to the process owner."
    nodos:
      - n: 1
        etiqueta: { es: "Dueño del proceso", en: "Process owner" }
        tipo: humano
        col: 0
        fila: 0
        detalle:
          es: "Quien responde por el resultado del proceso y decide qué se automatiza, con qué herramienta y con cuánto control."
          en: "Whoever answers for the result of the process and decides what is automated, with which tool and with how much control."
      - n: 2
        etiqueta: { es: "El proceso en BPMN", en: "The process in BPMN" }
        tipo: dato
        col: 1
        fila: 0
        detalle:
          es: "Carriles por responsable, compuertas con su regla, eventos que lo disparan y objetos de datos que viajan entre actividades."
          en: "Lanes per owner, gateways with their rule, the events that trigger it and the data objects that travel between activities."
      - n: 3
        etiqueta: { es: "Formal frente a ejecutado", en: "Designed versus executed" }
        tipo: control
        col: 2
        fila: 0
        detalle:
          es: "Dónde lo que el procedimiento dice y lo que la operación hace se separan: decisiones informales, correcciones manuales y excepciones."
          en: "Where what the procedure says and what the operation does drift apart: informal decisions, manual corrections and exceptions."
      - n: 4
        etiqueta: { es: "Capacidad y restricción", en: "Capacity and constraint" }
        tipo: control
        col: 3
        fila: 0
        detalle:
          es: "Tiempo estándar, capacidad efectiva y la estación que fija el ritmo del flujo completo, medidos antes de cambiar nada."
          en: "Standard time, effective capacity and the station that sets the pace of the whole flow, measured before anything changes."
      - n: 5
        etiqueta: { es: "Qué automatizar", en: "What to automate" }
        tipo: control
        col: 4
        fila: 0
        detalle:
          es: "Valor, frecuencia, datos disponibles y riesgo de equivocarse: se automatiza lo estable y lo que vale la pena, no lo que sigue en discusión."
          en: "Value, frequency, available data and the risk of being wrong: what is stable and worth it gets automated, not what is still under discussion."
      - n: 6
        etiqueta: { es: "Registro de eventos", en: "Event log" }
        tipo: dato
        col: 2
        fila: 1
        detalle:
          es: "Qué pasó, cuándo, sobre qué objetos y quién lo hizo: la base para comparar lo esperado con lo ejecutado."
          en: "What happened, when, on which objects and who did it: the basis for comparing what was expected with what was executed."
      - n: 7
        etiqueta: { es: "Código y reglas", en: "Code and rules" }
        tipo: actor
        col: 5
        fila: 1
        detalle:
          es: "Una macro, un script o una consulta que aplica reglas explícitas: el peldaño más sencillo y el primero que se prueba."
          en: "A macro, a script or a query that applies explicit rules: the simplest rung and the first one tried."
      - n: 8
        etiqueta: { es: "RPA sobre la interfaz", en: "RPA on the interface" }
        tipo: actor
        col: 5
        fila: 2
        detalle:
          es: "Un robot que repite clics y tecleo donde el sistema no ofrece API; depende de que la pantalla no cambie."
          en: "A robot that repeats clicks and keystrokes where the system offers no API; it depends on the screen not changing."
      - n: 9
        etiqueta: { es: "Flujos low-code", en: "Low-code flows" }
        tipo: actor
        col: 4
        fila: 2
        detalle:
          es: "Flujos entre aplicaciones con conectores y aprobaciones: deterministas, la misma entrada da la misma salida."
          en: "Flows between applications with connectors and approvals: deterministic, the same input gives the same output."
      - n: 10
        etiqueta: { es: "Flujos n8n con datos", en: "n8n flows with data" }
        tipo: actor
        col: 3
        fila: 2
        detalle:
          es: "Flujos que conectan servicios, reglas y agentes, con una plataforma de datos que guarda cada evento para observarlos."
          en: "Flows that connect services, rules and agents, with a data platform that keeps every event so they can be observed."
      - n: 11
        etiqueta: { es: "Agente con código", en: "Agent in code" }
        tipo: actor
        col: 2
        fila: 2
        detalle:
          es: "Interpreta lenguaje, recupera conocimiento o elige entre opciones dentro de límites, con criterios verificables; entra donde una regla fija no alcanza."
          en: "Interprets language, retrieves knowledge or chooses between options within limits, with verifiable criteria; it comes in where a fixed rule is not enough."
      - n: 12
        etiqueta: { es: "Control humano por decisión", en: "Human control per decision" }
        tipo: control
        col: 1
        fila: 2
        detalle:
          es: "Informar, recomendar o ejecutar: la autonomía depende del costo de equivocarse y de si la acción se puede revertir."
          en: "Inform, recommend or execute: autonomy depends on the cost of being wrong and on whether the action can be reversed."
      - n: 13
        etiqueta: { es: "Operación observable", en: "Observable operation" }
        tipo: dato
        col: 1
        fila: 1
        detalle:
          es: "Cada ejecución con su estado, su tiempo, sus excepciones y su costo, registrada fuera del componente que hace el trabajo."
          en: "Every run with its status, its time, its exceptions and its cost, recorded outside the component that does the work."
      - n: 14
        etiqueta: { es: "Métricas de la automatización", en: "Automation metrics" }
        tipo: control
        col: 0
        fila: 1
        detalle:
          es: "Tiempo de ciclo, retrabajo, errores y trabajo manual que queda, comparados con la línea base del proceso."
          en: "Cycle time, rework, errors and the manual work that remains, compared with the baseline of the process."
    aristas:
      - { de: 1, a: 2, etiqueta: { es: "modela", en: "models" } }
      - { de: 2, a: 3, etiqueta: { es: "lo esperado", en: "expected" } }
      - { de: 6, a: 3, etiqueta: { es: "lo ejecutado", en: "executed" } }
      - { de: 3, a: 4, etiqueta: { es: "se corrige", en: "is fixed" } }
      - { de: 4, a: 5, etiqueta: { es: "prioriza", en: "prioritizes" } }
      - { de: 5, a: 7, etiqueta: { es: "empieza por", en: "starts with" } }
      - { de: 7, a: 8, etiqueta: { es: "sin API", en: "no API" } }
      - { de: 8, a: 9, etiqueta: { es: "con conectores", en: "with connectors" } }
      - { de: 9, a: 10, etiqueta: { es: "con datos", en: "with data" } }
      - { de: 10, a: 11, etiqueta: { es: "hay que interpretar", en: "needs interpreting" } }
      - { de: 11, a: 12, etiqueta: { es: "dentro de límites", en: "within limits" } }
      - { de: 12, a: 13, etiqueta: { es: "opera", en: "operates" } }
