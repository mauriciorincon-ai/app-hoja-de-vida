# Complemento de la ficha técnica de Anonimizador Velo (`anonimizador`, ADR-016). PROCEDENCIA: planeadora —
# pedido 026 de CV Viva (sentada 4a), ejecutado por la planeadora el 2026-10-27 desde una copia aislada de la
# base `origin/main` 5bac57b de app-anonimizador. Sustituye al complemento derivado por CV Viva (2026-09-05).
# `cifras_destacadas` son CLAVES de `metricas[]` del export (un solo cero: el de la promesa, nada sale del
# navegador). El `proceso` corrige el que armó CV Viva («Entregar sin entregar, y recuperar»): mismos actores;
# pasos en lenguaje llano, con la bóveda, la devolución del tercero y la restauración. El `roadmap` se copia
# tal cual del yaml de CV Viva: sus ids son la clave del voto.
schema_version: "1.0.0"
app: anonimizador
procedencia: planeadora
declarado_en: "2026-10-27"
titular: "Entregas tablas con datos de personas sin entregar a nadie: Anonimizador Velo las disfraza dentro de tu navegador, mide el riesgo con cifras exactas y, con tu bóveda cifrada, te devuelve los valores reales cuando el trabajo regresa."
cifras_destacadas: [funcionalidades, filas_procesadas, llamadas_de_red_con_datos, pruebas_unitarias, cobertura_lineas]
limites:
  - "Mide el riesgo de reidentificación y te lo muestra; no lo elimina ni declara anónimo ningún archivo."
  - "Reconoce documentos, contactos, ubicaciones y datos demográficos; un código interno de tu organización puede pasar sin que lo note."
  - "Lee CSV y Excel (hasta 150 MB) y entrega CSV; no lee bases de datos, JSON ni PDF."
  - "Sin tu frase de paso no hay recuperación: ni Anonimizador Velo ni nadie puede abrir la bóveda."
nunca:
  - "Sube tu archivo a un servidor."
  - "Deja copia al cerrar la pestaña."
  - "Usa inteligencia artificial para decidir qué se anonimiza."
  - "Mezcla una cifra estimada con una exacta."
  - "Desvela sin tu bóveda y tu frase de paso."
proceso:
  titulo: "Entregar sin entregar, y recuperar"
  carriles:
    - { id: persona, nombre: "Quien entrega" }
    - { id: velo, nombre: "Anonimizador Velo · en el navegador" }
    - { id: tercero, nombre: "El tercero: consultor, IA o herramienta" }
  pasos:
    - { id: ini, tipo: inicio, carril: persona, texto: "Una tabla con datos de personas" }
    - { id: abre, tipo: tarea, carril: persona, texto: "Suelta el archivo en la pestaña" }
    - { id: delata, tipo: tarea, carril: velo, texto: "Señala qué columnas identifican a alguien" }
    - { id: decide, tipo: tarea, carril: persona, texto: "Decide qué se le hace a cada columna" }
    - { id: vela, tipo: tarea, carril: velo, texto: "Disfraza cada columna según la política" }
    - { id: riesgo, tipo: tarea, carril: velo, texto: "Mide el riesgo antes y después" }
    - { id: acepta, tipo: decision, carril: persona, texto: "¿El riesgo que queda es aceptable?" }
    - { id: certifica, tipo: tarea, carril: velo, texto: "Certifica la entrega con las dos huellas" }
    - { id: boveda, tipo: tarea, carril: persona, texto: "Guarda la bóveda cifrada con su frase" }
    - { id: entrega, tipo: tarea, carril: persona, texto: "Entrega el archivo disfrazado" }
    - { id: trabaja, tipo: tarea, carril: tercero, texto: "Trabaja sobre los datos disfrazados" }
    - { id: devuelve, tipo: tarea, carril: tercero, texto: "Devuelve el archivo trabajado" }
    - { id: carga, tipo: tarea, carril: persona, texto: "Abre la bóveda y carga lo devuelto" }
    - { id: restaura, tipo: tarea, carril: velo, texto: "Restaura los valores reales" }
    - { id: fin, tipo: fin, carril: persona, texto: "El trabajo, con los datos reales" }
  flujos:
    - { de: ini, a: abre }
    - { de: abre, a: delata }
    - { de: delata, a: decide }
    - { de: decide, a: vela }
    - { de: vela, a: riesgo }
    - { de: riesgo, a: acepta }
    - { de: acepta, a: certifica, etiqueta: "sí" }
    - { de: acepta, a: decide, etiqueta: "no · ajusta" }
    - { de: certifica, a: boveda }
    - { de: boveda, a: entrega }
    - { de: entrega, a: trabaja }
    - { de: trabaja, a: devuelve }
    - { de: devuelve, a: carga }
    - { de: carga, a: restaura }
    - { de: restaura, a: fin }
  anotaciones:
    - { paso: vela, texto: "En un hilo aparte del navegador: no hay subida, no hay servidor y no queda copia al cerrar." }
    - { paso: boveda, texto: "Viaja aparte, nunca junto al archivo entregado: solo quien entregó la tiene." }
    - { paso: restaura, texto: "Por valor, no por posición: sobrevive a filas reordenadas, columnas nuevas y valores corregidos." }

# Roadmap votable (2026-09-13): lo que la planeadora entrega como cierre de plan
# de esta app — features disruptivas, no en construcción, sin fechas. PROCEDENCIA:
# cv-viva (la planeadora lo administra; llega por copia y no se edita aquí). Los
# `id` son ESTABLES: el par (app, id) es la clave del voto en la BD.
roadmap:
  - id: puente-a-bases-de-datos
    titulo:
      es: "Conectar directo a tu base de datos"
      en: "Connect straight to your database"
    descripcion:
      es: "Anonimizas desde la fuente, sin exportar un archivo intermedio: eliges la tabla, aplicas la política y el resultado vuelve a tu base local."
      en: "Anonymize at the source, with no intermediate file: pick the table, apply the policy, and the result lands back in your local database."
  - id: api-para-pipelines
    titulo:
      es: "Anonimización sin pantalla, dentro de tus pipelines"
      en: "Screen-free anonymization inside your pipelines"
    descripcion:
      es: "Llamas a Anonimizador Velo desde tus propios procesos y la anonimización ocurre sola, con las mismas políticas y el mismo certificado que hoy obtienes a mano."
      en: "Call Anonimizador Velo from your own processes and anonymization runs on its own, with the same policies and the same certificate you get by hand today."
  - id: privacidad-diferencial
    titulo:
      es: "Privacidad diferencial: garantía matemática, no solo k-anonimato"
      en: "Differential privacy: a mathematical guarantee, not just k-anonymity"
    descripcion:
      es: "Añades ruido calibrado con un presupuesto de privacidad explícito, y el riesgo deja de depender de lo que un atacante ya sepa de tus filas."
      en: "Add calibrated noise under an explicit privacy budget, so the risk no longer depends on what an attacker already knows about your rows."
  - id: generalizacion-optima
    titulo:
      es: "La generalización óptima, no la primera que sirve"
      en: "The optimal generalization, not the first one that works"
    descripcion:
      es: "Anonimizador Velo explora jerarquías completas y elige la que destruye menos utilidad para el mismo nivel de protección que pediste."
      en: "Anonimizador Velo explores full hierarchies and picks the one that destroys the least utility for the protection level you asked for."
  - id: metadatos-de-pdf-e-imagenes
    titulo:
      es: "Limpiar lo que delata un PDF o una foto"
      en: "Scrub what a PDF or a photo gives away"
    descripcion:
      es: "Autor, ubicación, dispositivo y demás metadatos ocultos desaparecen antes de compartir; la aduana deja de limitarse a tablas."
      en: "Author, location, device and other hidden metadata are gone before you share; the checkpoint stops being tables-only."
