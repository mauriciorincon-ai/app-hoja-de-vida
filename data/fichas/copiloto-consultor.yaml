# Complemento de la ficha técnica de AngelGhost (`copiloto-consultor`). PROCEDENCIA: planeadora
# (curado desde VISION v1.5.0 y el brief, 2026-10-11; primera ficha sin línea base de CV Viva).
# Se copia tal cual a data/fichas/copiloto-consultor.yaml de hoja-de-vida junto con el export.
# `cifras_destacadas` son CLAVES de `metricas[]` del export: el export debe traerlas con su fuente.
schema_version: "1.0.0"
app: copiloto-consultor
declarado_en: "2026-10-11"
titular: "Tu propia experiencia en la reunión, en el momento justo, en una ventana que el cliente no ve aunque compartas pantalla: responde desde tu propuesta, tu marco y tu trayectoria, corre entera en tu Mac y al cerrar no queda nada."
cifras_destacadas: [funcionalidades, pruebas_automaticas, bytes_que_salen_del_equipo, costo_operacion_mensual]
limites:
  - "Corre en macOS; Windows llega en el ciclo H2 y el modo presencial cubre entretanto cualquier reunión."
  - "Responde solo con lo que tú le diste: sin corpus propio no hay ficha que mostrar."
  - "El modelo local redacta una sugerencia breve y se puede apagar; no reemplaza tu criterio ni habla por ti."
nunca:
  - "Entra como bot a la reunión ni graba audio o transcripción."
  - "Envía audio, capturas o texto a un servicio externo por defecto."
  - "Se presenta como «indetectable»: la promesa es «nada queda», demostrable con un contador."
  - "Accede, sondea o actúa sobre el computador de la contraparte."
roadmap:
  - id: iphone-presencial
    titulo:
      es: "Tu iPhone en modo presencial"
      en: "Your iPhone in in-person mode"
    descripcion:
      es: "La misma app en el celular, escuchando la sala por su micrófono y mostrándote la ficha; depende de un spike de compilación para iOS."
      en: "The same app on your phone, listening to the room through its mic and showing you the card; depends on an iOS build spike."
  - id: varias-voces
    titulo:
      es: "Varias voces en el mismo canal"
      en: "Several voices on the same channel"
    descripcion:
      es: "Distinguir a dos o más personas del lado del cliente, sin biometría."
      en: "Tell two or more people apart on the client's side, with no biometrics."
  - id: sin-auriculares
    titulo:
      es: "Sin auriculares"
      en: "No headphones needed"
    descripcion:
      es: "Cancelación de eco para usar los parlantes sin que tu propia voz vuelva como del cliente."
      en: "Echo cancellation so you can use speakers without your own voice coming back as the client's."
  - id: streaming-nativo
    titulo:
      es: "Transcripción en streaming nativo"
      en: "Native streaming transcription"
    descripcion:
      es: "Un motor con latencia aún menor, cuando esté medido en Apple Silicon."
      en: "An engine with even lower latency, once measured on Apple Silicon."
  - id: leer-el-dashboard
    titulo:
      es: "Leer el dashboard del cliente como consultor"
      en: "Read the client's dashboard like a consultant"
    descripcion:
      es: "Interpretar gráficos y tablas en pantalla, no solo el texto."
      en: "Interpret charts and tables on screen, not just the text."
  - id: acuerdos-detectados
    titulo:
      es: "Acuerdos detectados"
      en: "Detected commitments"
    descripcion:
      es: "«Quedamos en», «te envío», «para el viernes» se vuelven propuestas de acuerdo que confirmas con un clic."
      en: "“We agreed”, “I'll send you”, “by Friday” become commitment proposals you confirm with one click."
