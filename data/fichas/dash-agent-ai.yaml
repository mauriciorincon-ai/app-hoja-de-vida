# Complemento de la ficha técnica de Dash Agent (`dash-agent-ai`, ADR-016). PROCEDENCIA: planeadora —
# pedido 026 de CV Viva (sentada 4a), ejecutado por la planeadora el 2026-10-27 desde una copia aislada de la
# base `origin/main` f80375f de app-dash-agent-ai. Sustituye al complemento derivado por CV Viva (2026-09-05).
# `cifras_destacadas` son CLAVES de `metricas[]` del export, con un solo cero: el costo de operación, que la
# promesa declara («operarlo cuesta cero»); las llamadas de red en cero siguen en la ficha de detalle.
# El `proceso` corrige el que armó CV Viva («Saber todo de tus agentes»): mismos tres actores; se agrega el
# paso que Dash no da solo (tú pulsas «Indexar ahora») y el plan de limpieza que descargas, y los pasos se
# escriben sin jerga. El `roadmap` se copia tal cual del yaml de CV Viva: sus ids son la clave del voto.
schema_version: "1.0.0"
app: dash-agent-ai
procedencia: planeadora
declarado_en: "2026-10-27"
titular: "Más que contar tokens: Dash revisa lo que tus agentes tienen escrito sobre ti y te señala, con archivo y línea, lo que ya no es cierto, sin IA y sin que nada salga de tu computador."
cifras_destacadas: [funcionalidades, pantallas, pruebas_unitarias, cobertura_lineas, costo_operacion_mensual]
limites:
  - "Hoy lee solo a Claude Code: otros agentes de programación están en su hoja de ruta, no en la app."
  - "Se arranca desde la terminal en tu computador; abrirla con doble clic está en la hoja de ruta."
  - "El auditor busca cinco tipos de problema con reglas fijas: un informe vacío no certifica que todo esté bien."
  - "Compara tu plan contra tarifas de lista, no contra tus límites reales de uso: el proveedor no los publica."
nunca:
  - "Escribe en los archivos de tus agentes, ni siquiera con tu confirmación."
  - "Envía tus datos fuera de tu computador."
  - "Usa IA para juzgar: cada resultado sale de código y cita su evidencia."
  - "Inventa una cifra: si no puede medirla o cotizarla, lo dice."
  - "Suma en un mismo número lo medido y lo estimado."
proceso:
  titulo: "Saber todo de tus agentes"
  carriles:
    - { id: agentes, nombre: "Tus agentes · sus archivos" }
    - { id: dash, nombre: "Dash · en tu computador" }
    - { id: tu, nombre: "Tú" }
  pasos:
    - { id: ini, tipo: inicio, carril: agentes, texto: "Tus agentes trabajan contigo" }
    - { id: escriben, tipo: tarea, carril: agentes, texto: "Dejan registros, memorias e instrucciones" }
    - { id: indexar, tipo: tarea, carril: tu, texto: "Abres Dash y pulsas «Indexar ahora»" }
    - { id: lee, tipo: tarea, carril: dash, texto: "Lee los archivos sin modificarlos" }
    - { id: indexa, tipo: tarea, carril: dash, texto: "Guarda su índice aparte de los originales" }
    - { id: cuesta, tipo: tarea, carril: dash, texto: "Calcula lo que te cuestan, con tarifas fechadas" }
    - { id: saben, tipo: tarea, carril: dash, texto: "Inventaría lo que saben de ti" }
    - { id: caduco, tipo: tarea, carril: dash, texto: "Señala lo que dejó de ser cierto" }
    - { id: revisa, tipo: tarea, carril: tu, texto: "Revisas costos, historial y hallazgos" }
    - { id: corregir, tipo: decision, carril: tu, texto: "¿Corregir?" }
    - { id: plan, tipo: tarea, carril: tu, texto: "Descargas el plan de limpieza" }
    - { id: corrige, tipo: tarea, carril: tu, texto: "Corriges tú la memoria del agente" }
    - { id: fin, tipo: fin, carril: tu, texto: "" }
  flujos:
    - { de: ini, a: escriben }
    - { de: escriben, a: indexar }
    - { de: indexar, a: lee }
    - { de: lee, a: indexa }
    - { de: indexa, a: cuesta }
    - { de: cuesta, a: saben }
    - { de: saben, a: caduco }
    - { de: caduco, a: revisa }
    - { de: revisa, a: corregir }
    - { de: corregir, a: plan, etiqueta: "sí" }
    - { de: corregir, a: fin, etiqueta: "no" }
    - { de: plan, a: corrige }
    - { de: corrige, a: fin }
  anotaciones:
    - { paso: lee, texto: "Solo lectura en cuatro capas: bloqueo de escritura al arrancar, un único punto que lee, índice aparte y pruebas permanentes." }
    - { paso: indexa, texto: "Nada sale de tu computador: no hay servidor, cuenta ni nube." }
    - { paso: corrige, texto: "Dash no borra ni edita nada: el plan es una lista que ejecutas tú, fuera de la app." }

# Roadmap votable (2026-09-13): lo que la planeadora entrega como cierre de plan
# de esta app — features disruptivas, no en construcción, sin fechas. PROCEDENCIA:
# cv-viva (la planeadora lo administra; llega por copia y no se edita aquí). Los
# `id` son ESTABLES: el par (app, id) es la clave del voto en la BD.
roadmap:
  - id: lector-de-otro-agente-de-codigo
    titulo:
      es: "Un segundo agente de código en el mismo panel"
      en: "A second coding agent on the same dashboard"
    descripcion:
      es: "Costo, línea de tiempo y auditor dejan de cubrir un solo agente: cuando adoptes otro, sus tokens medidos entran al mismo panel, sin estimaciones."
      en: "Cost, timeline and auditor stop covering a single agent: when you adopt another one, its measured tokens join the same dashboard, no estimates."
  - id: app-de-doble-clic
    titulo:
      es: "Abrir Dash con doble clic"
      en: "Open Dash with a double click"
    descripcion:
      es: "Deja de ser un servidor que levantas desde la terminal: una app de escritorio que abres como cualquier otra, igual de local y sin enviar nada fuera."
      en: "No more starting a server from the terminal: a desktop app you open like any other, just as local, sending nothing out."
  - id: agentes-sin-registro-de-tokens
    titulo:
      es: "Agentes que no guardan sus tokens, con cifras marcadas como estimación"
      en: "Agents that keep no token log, with figures flagged as estimates"
    descripcion:
      es: "Incorporas herramientas que no persisten consumo: cada cifra llega rotulada como estimación y nunca se mezcla con lo medido."
      en: "Bring in tools that persist no usage data: every figure arrives labeled as an estimate and is never blended with measured values."
