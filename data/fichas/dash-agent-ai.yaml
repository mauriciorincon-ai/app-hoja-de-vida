# Complemento de la ficha técnica de Dash Agent AI (ADR-016). PROCEDENCIA:
# cv-viva — derivado de su export por CV Viva; se retira cuando la app mande el suyo.
schema_version: "1.0.0"
app: dash-agent-ai
procedencia: cv-viva
declarado_en: "2026-09-05"
titular: "Medir tokens ya lo hacen varias herramientas. Lo que no hace nadie es el auditor de memoria: el inventario de lo que tus agentes saben de ti y la detección determinista de lo que dejó de ser cierto."
cifras_destacadas: [funcionalidades, pantallas, llamadas_de_red, cobertura_lineas, costo_operacion_mensual]
limites:
  - "Lee; jamás escribe en los archivos de tus agentes — la garantía de solo lectura tiene cuatro capas."
  - "Vive entera en tu máquina: sin servidor, cuenta ni nube."
  - "Detecta lo que dejó de ser cierto de forma determinista: sin IA que opine."
nunca:
  - "Modifica un archivo de tus agentes."
  - "Saca tus datos de la máquina."
  - "Mezcla el índice con las fuentes."
  - "Inventa un costo que no midió."
proceso:
  titulo: "Saber todo de tus agentes"
  carriles:
    - { id: agentes, nombre: "Tus agentes · sus archivos" }
    - { id: dash, nombre: "Dash · en tu máquina" }
    - { id: tu, nombre: "Tú" }
  pasos:
    - { id: ini, tipo: inicio, carril: agentes, texto: "Tus agentes trabajan" }
    - { id: escriben, tipo: tarea, carril: agentes, texto: "Escriben logs, memoria e instrucciones" }
    - { id: lee, tipo: tarea, carril: dash, texto: "Lee los archivos, solo lectura" }
    - { id: indexa, tipo: tarea, carril: dash, texto: "Indexa fuera de las fuentes" }
    - { id: cuesta, tipo: tarea, carril: dash, texto: "Calcula lo que te cuestan" }
    - { id: saben, tipo: tarea, carril: dash, texto: "Inventaría lo que saben de ti" }
    - { id: caduco, tipo: tarea, carril: dash, texto: "Detecta lo que dejó de ser cierto" }
    - { id: revisa, tipo: tarea, carril: tu, texto: "Revisa el tablero" }
    - { id: corregir, tipo: decision, carril: tu, texto: "¿Corregir?" }
    - { id: corrige, tipo: tarea, carril: tu, texto: "Corrige la memoria del agente" }
    - { id: fin, tipo: fin, carril: tu, texto: "" }
  flujos:
    - { de: ini, a: escriben }
    - { de: escriben, a: lee }
    - { de: lee, a: indexa }
    - { de: indexa, a: cuesta }
    - { de: cuesta, a: saben }
    - { de: saben, a: caduco }
    - { de: caduco, a: revisa }
    - { de: revisa, a: corregir }
    - { de: corregir, a: corrige, etiqueta: "sí" }
    - { de: corregir, a: fin, etiqueta: "no" }
    - { de: corrige, a: fin }
  anotaciones:
    - { paso: lee, texto: "Solo lectura con cuatro capas: permisos de Node, una frontera de módulo única, el índice fuera de las fuentes y pruebas permanentes." }
    - { paso: indexa, texto: "Nada sale de la máquina: no hay servidor, cuenta ni nube." }

# Roadmap votable (2026-09-13): lo que la planeadora entrega como cierre de plan
# de esta app — features disruptivas, no en construcción, sin fechas. PROCEDENCIA:
# cv-viva (la planeadora lo administra; llega por copia y no se edita aquí). Los
# `id` son ESTABLES: el par (app, id) es la clave del voto en la BD.
roadmap:
  - id: lector-de-otro-agente-de-codigo
    titulo:
      es: "Un segundo agente de código en el mismo panel"
      en: "A second coding agent on the same dashboard"
    descripcion:
      es: "Costo, línea de tiempo y auditor dejan de cubrir un solo agente: cuando adoptes otro, sus tokens medidos entran al mismo panel, sin estimaciones."
      en: "Cost, timeline and auditor stop covering a single agent: when you adopt another one, its measured tokens join the same dashboard, no estimates."
  - id: app-de-doble-clic
    titulo:
      es: "Abrir Dash con doble clic"
      en: "Open Dash with a double click"
    descripcion:
      es: "Deja de ser un servidor que levantas desde la terminal: una app de escritorio que abres como cualquier otra, igual de local y sin enviar nada fuera."
      en: "No more starting a server from the terminal: a desktop app you open like any other, just as local, sending nothing out."
  - id: agentes-sin-registro-de-tokens
    titulo:
      es: "Agentes que no guardan sus tokens, con cifras marcadas como estimación"
      en: "Agents that keep no token log, with figures flagged as estimates"
    descripcion:
      es: "Incorporas herramientas que no persisten consumo: cada cifra llega rotulada como estimación y nunca se mezcla con lo medido."
      en: "Bring in tools that persist no usage data: every figure arrives labeled as an estimate and is never blended with measured values."
