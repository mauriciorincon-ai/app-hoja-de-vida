# Complemento de la ficha técnica de Probeta DS (ADR-016). PROCEDENCIA:
# cv-viva — derivado de su export por CV Viva; se retira cuando la app mande el suyo.
schema_version: "1.0.0"
app: ds
procedencia: cv-viva
declarado_en: "2026-09-05"
titular: "Enseña la pantalla en la que su propio producto falla: el veredicto contra el baseline dice «NO supera» cuando no supera, la fuga de datos es imposible por construcción y toda cifra sale del conjunto de prueba."
cifras_destacadas: [funcionalidades, filas_del_usuario_en_la_red, cobertura_lineas, gpu_requerida, costo_operacion_mensual]
limites:
  - "Si el modelo no supera al baseline, lo dice — el incentivo del mercado es el contrario."
  - "El preprocesamiento se ajusta solo con la mitad de entrenamiento; la interfaz no ofrece otro camino."
  - "No es una app local: se sirve desde la web con UNA ruta de servidor — pero el dataset sí lo es: nunca se sube."
nunca:
  - "Sube el dataset a un servidor."
  - "Ajusta el preprocesamiento con datos de prueba."
  - "Necesita una GPU."
  - "Maquilla un veredicto."
proceso:
  titulo: "Un modelo que se pueda defender"
  carriles:
    - { id: persona, nombre: "Quien defiende el modelo" }
    - { id: probeta, nombre: "Probeta · en el navegador" }
  pasos:
    - { id: ini, tipo: inicio, carril: persona, texto: "Un dataset y una pregunta" }
    - { id: carga, tipo: tarea, carril: persona, texto: "Carga el dataset en el navegador" }
    - { id: perfila, tipo: tarea, carril: probeta, texto: "Perfila y sanea los datos" }
    - { id: parte, tipo: tarea, carril: probeta, texto: "Parte en entrenamiento y prueba" }
    - { id: ajusta, tipo: tarea, carril: probeta, texto: "Ajusta el preprocesamiento con entrenamiento" }
    - { id: entrena, tipo: tarea, carril: probeta, texto: "Entrena y compara con el baseline" }
    - { id: supera, tipo: decision, carril: probeta, texto: "¿Supera?" }
    - { id: veredicto, tipo: tarea, carril: persona, texto: "Lee el veredicto honesto" }
    - { id: porque, tipo: tarea, carril: probeta, texto: "Cuenta el porqué, con cifras de prueba" }
    - { id: usa, tipo: tarea, carril: persona, texto: "Usa el modelo y lo defiende" }
    - { id: fin, tipo: fin, carril: persona, texto: "" }
  flujos:
    - { de: ini, a: carga }
    - { de: carga, a: perfila }
    - { de: perfila, a: parte }
    - { de: parte, a: ajusta }
    - { de: ajusta, a: entrena }
    - { de: entrena, a: supera }
    - { de: supera, a: veredicto, etiqueta: "no supera" }
    - { de: veredicto, a: perfila, etiqueta: "vuelve a los datos" }
    - { de: supera, a: porque, etiqueta: "sí" }
    - { de: porque, a: usa }
    - { de: usa, a: fin }
  anotaciones:
    - { paso: carga, texto: "El dataset nunca se sube: perfilado, entrenamiento y scoring corren en el navegador con Pyodide." }
    - { paso: ajusta, texto: "La fuga de datos es imposible por construcción: la interfaz no ofrece otro camino." }

# Roadmap votable (2026-09-13): lo que la planeadora entrega como cierre de plan
# de esta app — features disruptivas, no en construcción, sin fechas. PROCEDENCIA:
# cv-viva (la planeadora lo administra; llega por copia y no se edita aquí). Los
# `id` son ESTABLES: el par (app, id) es la clave del voto en la BD.
roadmap:
  - id: sello-de-defendibilidad
    titulo:
      es: "Un sello que certifica que tu modelo se puede defender"
      en: "A seal certifying your model can be defended"
    descripcion:
      es: "Sales con un reporte compartible que marca, una a una, las condiciones que tu modelo cumplió: sin fuga, partición correcta, supera el baseline, incertidumbre y robustez medidas."
      en: "Walk away with a shareable report that checks, one by one, the conditions your model met: no leakage, proper split, beats the baseline, uncertainty and robustness measured."
  - id: prueba-de-estres
    titulo:
      es: "Prueba de estrés: cuánto aguanta tu modelo"
      en: "Stress test: how much your model can take"
    descripcion:
      es: "Con un botón metes ruido, barajas columnas y simulas cambios en los datos, y ves cuánto cae el acierto antes de confiarle una decisión."
      en: "One button adds noise, shuffles columns and simulates data shifts, and you see how far accuracy drops before you trust it with a decision."
  - id: datos-sinteticos
    titulo:
      es: "Un gemelo sintético de tus datos para compartirlos sin exponerlos"
      en: "A synthetic twin of your data to share without exposing it"
    descripcion:
      es: "Generas un conjunto con la misma forma estadística y sin filas reales, para que otros trabajen sobre él mientras el original nunca sale de tu máquina."
      en: "Generate a set with the same statistical shape and no real rows, so others can work on it while the original never leaves your machine."
  - id: que-pasaria-si-en-dinero
    titulo:
      es: "¿Qué pasaría si…? con el impacto en dinero"
      en: "What if…? with the impact in money"
    descripcion:
      es: "Mueves una variable y la predicción se traduce a pesos: el modelo deja de ser un número y se vuelve una decisión de negocio."
      en: "Move one variable and the prediction is translated into money: the model stops being a number and becomes a business decision."
  - id: vigilancia-de-deriva
    titulo:
      es: "Vigilar el modelo después de publicarlo"
      en: "Watch the model after it ships"
    descripcion:
      es: "Probeta compara los datos nuevos con los de entrenamiento y te avisa cuándo el modelo se degradó y toca reentrenar."
      en: "Probeta compares new data with the training data and tells you when the model has degraded and it's time to retrain."
