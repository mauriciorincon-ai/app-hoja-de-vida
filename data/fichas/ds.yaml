# Complemento de la ficha técnica de Probeta DS (`ds`). PROCEDENCIA: planeadora — pedido 026 de CV Viva
# (sentada 4a de la revisión del H-2), 2026-10-27. Curado desde la base `origin/main` d302949 de app-ds (export
# del S20, 76 funcionalidades), su manual de uso y la VISION v2.1.0. Reemplaza al que derivó CV Viva el 2026-09-05.
# Reentrega 2026-10-28: titular, límites, nunca y proceso comprobados contra 988489c (S21, 77 funcionalidades): siguen
# siendo verdad, sin cambios.
# `cifras_destacadas` son CLAVES de `metricas[]` del export: el export las trae con su fuente.
# El `proceso` es el que armó CV Viva («Un modelo que se pueda defender»), corregido: ver RESPUESTA-026.md.
schema_version: "1.0.0"
app: ds
procedencia: planeadora
declarado_en: "2026-10-27"
titular: "Te muestra la pantalla en la que tu modelo pierde: si no le gana a una regla simple, dice «NO supera» con la cifra exacta; la prueba nunca contamina el entrenamiento y tu tabla no sale de tu navegador."
cifras_destacadas: [funcionalidades, etapas_protocolo, filas_del_usuario_en_la_red, pruebas_unitarias, cobertura_lineas]
limites:
  - "Archivos de hasta 5 MB o 50 000 filas, y todo en CPU dentro del navegador: una liga grande puede tardar minutos."
  - "El chequeo de fuga atrapa los casos evidentes, una columna a la vez: es una ayuda honesta, no una garantía."
  - "No es una app local: se sirve desde la web, con una sola ruta de servidor para la narración con IA, que nunca recibe filas."
  - "Explica qué pesa en el modelo, no qué causa qué: una causa pide un experimento, y el Protocolo se detiene si la buscas."
nunca:
  - "Sube tu tabla a un servidor."
  - "Ajusta el preprocesamiento con las filas de prueba."
  - "Maquilla un veredicto: si no le gana a la regla simple, dice «NO supera»."
  - "Rellena en silencio una columna que falta para poder puntuar."
  - "Necesita una tarjeta gráfica."
proceso:
  titulo: "Un modelo que se pueda defender"
  carriles:
    - { id: persona, nombre: "Quien defiende el modelo" }
    - { id: probeta, nombre: "Probeta · en el navegador" }
  pasos:
    - { id: ini, tipo: inicio, carril: persona, texto: "Un dataset y una pregunta" }
    - { id: carga, tipo: tarea, carril: persona, texto: "Carga el dataset en el navegador" }
    - { id: perfila, tipo: tarea, carril: probeta, texto: "Perfila y sanea los datos" }
    - { id: elige, tipo: tarea, carril: persona, texto: "Elige qué quiere predecir" }
    - { id: parte, tipo: tarea, carril: probeta, texto: "Parte en entrenamiento y prueba" }
    - { id: ajusta, tipo: tarea, carril: probeta, texto: "Ajusta el preprocesamiento con entrenamiento" }
    - { id: entrena, tipo: tarea, carril: probeta, texto: "Entrena y compara con el baseline" }
    - { id: supera, tipo: decision, carril: probeta, texto: "¿Supera?" }
    - { id: veredicto, tipo: tarea, carril: persona, texto: "Lee el veredicto honesto" }
    - { id: porque, tipo: tarea, carril: probeta, texto: "Cuenta el porqué, con cifras de prueba" }
    - { id: usa, tipo: tarea, carril: persona, texto: "Usa el modelo y lo defiende" }
    - { id: fin, tipo: fin, carril: persona, texto: "" }
  flujos:
    - { de: ini, a: carga }
    - { de: carga, a: perfila }
    - { de: perfila, a: elige }
    - { de: elige, a: parte }
    - { de: parte, a: ajusta }
    - { de: ajusta, a: entrena }
    - { de: entrena, a: supera }
    - { de: supera, a: veredicto, etiqueta: "no supera" }
    - { de: veredicto, a: carga, etiqueta: "corrige su tabla" }
    - { de: supera, a: porque, etiqueta: "sí" }
    - { de: porque, a: usa }
    - { de: usa, a: fin }
  anotaciones:
    - { paso: ini, texto: "¿Prefiere el camino lento? Protocolo DS recorre lo mismo en diez etapas con compuertas que no se saltan." }
    - { paso: carga, texto: "El dataset nunca se sube: perfilado, entrenamiento y scoring corren en el navegador con Pyodide." }
    - { paso: ajusta, texto: "La prueba no contamina el entrenamiento: el preprocesamiento aprende solo de él y la interfaz no ofrece otro camino." }
    - { paso: supera, texto: "Cuatro veredictos: ▲ supera, ＝ empata, ▼ NO supera y ⚠ sospechoso, cuando una columna adivina demasiado bien." }

# Roadmap votable (2026-09-13): lo que la planeadora entrega como cierre de plan
