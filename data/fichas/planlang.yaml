# Complemento de la ficha técnica de planlang. PROCEDENCIA: planeadora — pedido 026 de CV Viva
# (vitrina/apps/026/planlang/, 2026-10-27), escrito desde una copia aislada de la base de planlang
# (origin/main 269a68e) y verificado contra su código, su manual y sus pruebas. Reemplaza al que generaba
# `pnpm fichas` (procedencia: app, 2026-10-04); hasta que el generador de la app incluya el `proceso`, este
# archivo manda. El bloque `roadmap:` es copia literal del de CV Viva: lo administra la planeadora y sus `id`
# son la clave del voto.
schema_version: "1.0.0"
app: "planlang"
procedencia: planeadora
declarado_en: "2026-10-27"
titular: "El plan de un agente de IA queda escrito como contrato antes de construirlo, y un verificador sin IA publica, caso por caso, la brecha entre lo planeado y lo ocurrido, con sus fallas a la vista y sus umbrales listos para mover."
cifras_destacadas:
  - "criterios_cumplidos"
  - "decisiones_cruzadas"
  - "casos_sinteticos"
  - "llamadas_a_modelos_en_la_vitrina"
  - "costo_de_una_corrida"
limites:
  - "Es una simulación: no opera casos reales ni decide sobre personas; las decisiones humanas de los demos se simularon con la respuesta conocida."
  - "El entrevistador y las corridas viven en la terminal; el sitio muestra sus resultados, ya calculados y verificados."
  - "Mide lo que el plan declaró: lo que el plan no previó aparece como brecha no prevista, no como veredicto."
  - "El playground recalcula sobre lo que el agente ya hizo; fuera del rango observado, el resultado se marca «no observado»."
nunca:
  - "Usa datos reales: todo caso, afiliado, médico, solicitante y lista de control es sintético."
  - "Deja que un modelo decida si el agente acertó."
  - "Emite una negación completa o un rechazo sin que lo revise una persona."
  - "Llama a un modelo para validar el plan, medir la brecha, recalcular umbrales o dibujar el agente."
  - "Esconde un resultado desfavorable."
proceso:
  titulo: "Del plan a la brecha, con tu agente de IA"
  carriles:
    - { id: tu, nombre: "Tú · quien planea" }
    - { id: planlang, nombre: "planlang" }
    - { id: agente, nombre: "El agente · en lotes" }
    - { id: persona, nombre: "Una persona revisa" }
  pasos:
    - { id: ini, tipo: inicio, carril: tu, texto: "Tienes un proyecto de agentes de IA" }
    - { id: entrevista, tipo: tarea, carril: tu, texto: "Respondes la entrevista del plan" }
    - { id: borrador, tipo: tarea, carril: planlang, texto: "Redacta el borrador y marca contradicciones" }
    - { id: valida, tipo: tarea, carril: planlang, texto: "Valida el plan, sin IA" }
    - { id: medible, tipo: decision, carril: planlang, texto: "¿El plan se puede medir?" }
    - { id: completa, tipo: tarea, carril: tu, texto: "Completas lo que falta" }
    - { id: aprueba, tipo: tarea, carril: tu, texto: "Apruebas el plan y queda sellado" }
    - { id: casos, tipo: tarea, carril: planlang, texto: "Genera casos con respuesta conocida" }
    - { id: decide, tipo: tarea, carril: agente, texto: "Decide cada caso según el plan" }
    - { id: pausa, tipo: decision, carril: agente, texto: "¿El plan exige una persona?" }
    - { id: revisa, tipo: tarea, carril: persona, texto: "Revisa el caso y decide" }
    - { id: traza, tipo: tarea, carril: agente, texto: "Deja la traza de cada decisión" }
    - { id: verifica, tipo: tarea, carril: planlang, texto: "Compara el plan con las trazas, sin IA" }
    - { id: publica, tipo: tarea, carril: planlang, texto: "Publica la brecha, fallas incluidas" }
    - { id: umbrales, tipo: tarea, carril: tu, texto: "Mueves umbrales y ves qué cambia" }
    - { id: ajustar, tipo: decision, carril: tu, texto: "¿Cambias el plan?" }
    - { id: fin, tipo: fin, carril: tu, texto: "Agente medido contra su plan" }
  flujos:
    - { de: ini, a: entrevista }
    - { de: entrevista, a: borrador }
    - { de: borrador, a: valida }
    - { de: valida, a: medible }
    - { de: medible, a: completa, etiqueta: "no" }
    - { de: completa, a: valida }
    - { de: medible, a: aprueba, etiqueta: "sí" }
    - { de: aprueba, a: casos }
    - { de: casos, a: decide }
    - { de: decide, a: pausa }
    - { de: pausa, a: revisa, etiqueta: "sí" }
    - { de: pausa, a: traza, etiqueta: "no" }
    - { de: revisa, a: traza }
    - { de: traza, a: verifica }
    - { de: verifica, a: publica }
    - { de: publica, a: umbrales }
    - { de: umbrales, a: ajustar }
    - { de: ajustar, a: entrevista, etiqueta: "sí, versión nueva" }
    - { de: ajustar, a: fin, etiqueta: "no" }
  anotaciones:
    - { paso: borrador, texto: "Pregunta en orden lo que exige la plantilla del sector, con un ejemplo en cada pregunta; jamás aprueba por ti." }
    - { paso: valida, texto: "Rechaza, con el motivo exacto, criterios sin regla, umbrales sin señal y riesgos graves sin mitigación." }
    - { paso: decide, texto: "Con la suscripción de Claude Code, de a 20 casos y con pausas; si la corrida se corta, retoma sin repetir." }
    - { paso: revisa, texto: "En los demos, esa persona se simula con la respuesta conocida del caso, y cada pantalla lo dice." }
    - { paso: verifica, texto: "Sin ningún modelo: el mismo plan y las mismas trazas dan siempre el mismo informe, en español e inglés." }
    - { paso: umbrales, texto: "Se recalcula en el navegador sobre las decisiones reales; nadie vuelve a llamar al modelo." }

# Roadmap votable: copia literal de `data/fichas/planlang.yaml` de CV Viva (11d8066). PROCEDENCIA: la planeadora
# lo administra; los `id` son ESTABLES (el par app + id es la clave del voto).
roadmap:
  - id: "calibracion-conformal"
    titulo:
      es: "Calibración conformal y cobertura conjunta"
      en: "Conformal calibration and joint coverage"
    descripcion:
      es: "Garantías de cobertura en pipelines de varias etapas y calibración conformal del supuesto de confianza, medidas sobre las trazas."
      en: "Coverage guarantees across multi-stage pipelines and conformal calibration of the confidence assumption, measured on the traces."
  - id: "recorrido-animado-de-un-caso"
    titulo:
      es: "Recorrido animado de un caso por el grafo"
      en: "Animated walk of one case through the graph"
    descripcion:
      es: "Paso a paso por el grafo real: qué señal decidió cada arista, dónde pausó a una persona y qué salió."
      en: "Step by step through the real graph: which signal decided each edge, where it paused for a person and what came out."
