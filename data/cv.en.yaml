            rule could create a queue that did not exist before.
        - titulo: "A mixed team of twenty"
          texto: >-
            I led 14 people from Cafam and 6 from Oracle through about six months of Oracle WMS
            Cloud testing. My job was to translate: an inventory complaint became a reproducible
            scenario, with inputs, steps, an expected result and evidence.
        - titulo: "Instrumenting the implementation"
          texto: >-
            I built the control BI for the project itself for more than 15 users, from directors to
            distribution-center coordinators: coverage, defects, recurrences and retests visible
            every day, not a feeling of progress.
        - titulo: "Integrations with an owner and a limit"
          texto: >-
            I developed VBA integrations with the WMS to replace manual loads. Each peripheral piece
            knew who maintained it, what it depended on and when it would be retired: without those
            three conditions, a bridge becomes a parallel system.
        - titulo: "The 80-20 reconciliation in SQL"
          texto: >-
            At the start, none of the main medicines matched between the WMS and the source system.
            I reconciled them in SQL by volume priority, and every query that found a difference
            stayed as a permanent control.
      impacto:
        - "−25% errors and +15% operational efficiency across the implementation."
        - "+50% precision in operational control, adopted by 15+ users."
        - "+15% automation and −50% data errors with the VBA integrations."
        - "+20% data quality via SQL."
      leccion: >-
        Modernizing does not consist of replacing everything at once, but of designing
        a transition that preserves continuity while progressively reducing
        complexity.
