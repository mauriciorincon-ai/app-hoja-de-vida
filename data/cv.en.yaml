proyectos:
  - slug: "vesting"
    nombre: "A data platform for AI agents — Vesting (2023–2025)"
    resumen: >-
      An automation-agents startup with no data infrastructure: I designed and
      built from scratch its Microsoft Fabric ecosystem (big data + data
      warehouse + distributed processing), the governance to integrate client
      and system data, real-time agent monitoring, and the replicable core
      process to design and ship AI agents. The exact bridge between
      analytics engineering and AI engineering.
    stack: ["Microsoft Fabric", "Data governance", "Real-time monitoring"]
    destacado: true
    casestudy:
      titular: "The data platform of an AI-agent startup, designed from scratch: data for the agents to operate, and data about the agents so they could be trusted."
      contexto: >-
        Vesting, an automation-agents startup, was growing without data
        infrastructure: its AI-agent analytics had nowhere to live and every
        client data integration was handcrafted.
      reto: >-
        Build from scratch a data ecosystem able to support AI-agent analytics
        and monitoring in production — with governance from day one and
        without slowing the startup down.
      cifras:
        - valor: 12
          etiqueta: "clients integrated into the platform"
        - valor: 27
          etiqueta: "agents built with the core process"
        - valor: 23
          etiqueta: "agents monitored at once, in real time"
        - valor: 11
          etiqueta: "stages of the replicable core process"
      capitulos:
        - titulo: "The architecture on Microsoft Fabric"
          texto: >-
            I designed the ecosystem on Microsoft Fabric: big data, data warehouse and distributed
            processing over a lakehouse on OneLake, with pipelines that received the n8n flows
            orchestrating the agents. The key decision was normalizing events at ingestion:
            sessions, requests, responses, times, states and token cost, the same for all 27 agents.
        - titulo: "What is common and what is configurable"
          texto: >-
            A new agent or client could not require a new table for what already had a name on the
            platform, and it could bring its own attributes. The common part was the condition for
            comparing; the configurable part, the condition for not slowing the startup down.
        - titulo: "Governance by design"
          texto: >-
            I defined the governance to integrate client and system data with an event contract
            validated at ingestion. The 12 clients were isolated in separate workspaces: the access
            boundary matched the client boundary and did not depend on a well-written filter.
        - titulo: "Monitoring agents in production"
          texto: >-
            I built real-time monitoring in Power BI, with the session as the unit of analysis and
            four dimensions: operational, usage, economic and functional. The functional one was the
            hardest: an agent can respond without resolving anything.
        - titulo: "The eleven-stage core process"
          texto: >-
            I structured, documented and validated the core process used to build the 27 agents:
            from the use case and the level of autonomy to the definition of done, adoption and
            observable operation. The asset was not one agent, but the ability to build the next one
            without me.
      impacto:
        - "The data ecosystem became operational from scratch on Microsoft Fabric: 12 clients integrated, 120 tables, 20 GB and 1,000 events a day."
        - "27 agents in the inventory and up to 23 monitored at once, in real time."
        - "The replicable core process, in 11 stages, standardized how agents are designed and shipped."
        - "The exact bridge between analytics engineering (DP-600) and AI engineering."
      leccion: >-
        The greater a system's capacity to act, the greater the traceability of its
        data, its behavior and its limits must be.
  - slug: "banco-pichincha"
    nombre: "BI the business actually uses — Banco Pichincha (2023)"
    resumen: >-
      Dashboards adopted by 50+ users (+25% in decision-making), ETL times cut
      by 35%, predictive models above 90% accuracy (scikit-learn), co-led
      governance and a training program that lifted productivity by 20%.
    stack: ["BI", "ETL", "scikit-learn"]
    casestudy:
      titular: "Five months in banking to close the distance between data and decision: dashboards the business actually uses, models in production and people able to sustain them."
      contexto: >-
        The bank's analytics and reporting area produced dashboards the
        business never quite adopted, with slow ETL processes and models that
        stayed out of production.
      reto: >-
        Turn BI into a tool the business uses daily and take predictive
        models to production with reliable accuracy.
      cifras:
        - valor: 50
          sufijo: "+"
          etiqueta: "users adopted the dashboards"
        - valor: 25
          prefijo: "+"
          sufijo: "%"
          etiqueta: "in decision-making"
        - valor: 90
          prefijo: ">"
          sufijo: "%"
          etiqueta: "accuracy of models in production"
        - valor: 12
          etiqueta: "professionals trained in analytics"
      capitulos:
        - titulo: "Designing from the decision"
          texto: >-
            I led a five-person team building decision-oriented dashboards that more than 50
            business users adopted. Each dashboard started from the decision it had to support and
            offered a path from the aggregate to the evidence, built in the semantic model rather
            than on the page.
        - titulo: "One definition per concept"
          texto: >-
            I centralized the measures in DAX and optimized the semantic models with DAX Studio and
            Tabular Editor. A measure defined once is the technical form of a business decision:
            delinquency or churn is calculated in one single way.
        - titulo: "An ETL you can understand"
          texto: >-
            I optimized the Power Query ETL by separating connection, preparation and model tables,
            with early row and column selection and validations before the model. The −35% in
            analysis times came from structural decisions, not from a performance trick.
        - titulo: "Churn, delinquency and risk in production"
          texto: >-
            I trained and deployed churn, delinquency and risk models with scikit-learn, evaluated
            by segment and by what each error costs: calling a client who was not leaving costs a
            call; not calling the one who leaves costs the client.
        - titulo: "Training and governance"
          texto: >-
            I designed a training program for 12 professionals —Power Query, modeling, DAX and
            communication, on their own data— and co-led data governance. The boundary was clear:
            exploring was free; redefining what delinquency is was not.
      impacto:
        - "+25% in decision-making on the adopted dashboards."
        - "−35% in analysis times from the ETL optimization."
        - ">90% accuracy and +35% in predictions from the models in production."
        - "+20% productivity in preparing and using information after the training program."
      leccion: >-
        The sophistication of a solution does not by itself determine its value. What
        matters is the function it fulfills within a decision.
  - slug: "transmilenio-cm"
    nombre: "Data that moves a city — TransMilenio / C&M (2021–2022)"
    resumen: >-
      BI adoption (+35% efficiency, 25+ key users), an ETL that unified
      heterogeneous sources (+70% in precision and speed), demand forecasting
      with scikit-learn (+20% system performance) and strategy sessions with
      SITP leadership (+25% in indicators).
    stack: ["BI", "ETL", "scikit-learn"]
    casestudy:
      titular: "I returned to the same system with a different question: no longer supervising compliance, but explaining how the SITP operated and helping decide how to adjust it."
      contexto: >-
        Post-operational analysis of the TransMilenio system relied on
        heterogeneous sources and manual reports: the city's operation
        produced data faster than it could be analyzed.
      reto: >-
        Unify the sources, speed up the analysis and bring the data to the
        tables where the transit system's operation is decided.
      cifras:
        - valor: 70
          prefijo: "+"
          sufijo: "%"
          etiqueta: "in analysis precision and speed"
        - valor: 25
          sufijo: "+"
          etiqueta: "key users adopted the BI"
        - valor: 25
          prefijo: "+"
          sufijo: "%"
          etiqueta: "in the indicators addressed with the SITP"
        - valor: 10
          etiqueta: "months in use for the demand model"
      capitulos:
        - titulo: "Five sources, one operation"
          texto: >-
            I built the ETL that unified fare collection, fleet and GPS, scheduling, incidents and
            user complaints on common keys: route, service, vehicle, time slot and day. Validations
            lived inside the pipeline, written as rules: a service with no schedule or a bus with
            GPS and no dispatch stayed visible, not silently corrected.
        - titulo: "BI around operational questions"
          texto: >-
            I drove Power BI adoption with more than 25 key users: the people who scheduled and
            decided the service. Each dashboard answered a concrete question, such as which routes
            and time slots saw demand exceed the scheduled supply, or which concessionaires
            concentrated the incidents.
        - titulo: "Evidence, mechanism and consequence"
          texto: >-
            I brought analytics to working sessions with the SITP's concessionaire leadership. Each
            recommendation connected evidence, mechanism and consequence, and the same pipeline kept
            measuring after the action: that is why the +25% could be stated.
        - titulo: "Forecasting demand to schedule"
          texto: >-
            I developed a demand model with scikit-learn by route and time slot, updated monthly and
            validated with RMSE respecting temporal order. It ran for ten months inside the report
            used to decide how many buses to assign and at what times.
        - titulo: "Automating with controls"
          texto: >-
            Scripts cut the time spent on repetitive tasks by 40%, with input validation and visible
            exceptions: a weekly file arriving with a missing column is neither loaded silently nor
            allowed to crash the process. That time went to the model and to the sessions.
      impacto:
        - "+35% efficiency of analytical processes from BI adoption."
        - "+70% in analysis precision and speed with the unified ETL."
        - "+25% in indicators after the SITP strategy sessions."
        - "+20% system performance with demand forecasting."
      leccion: >-
        A reliable decision requires an equally reliable data path.
  - slug: "cafam"
    nombre: "Leading the quality of a WMS — Cafam (2020–2021)"
    resumen: >-
      A team of 20 through implementation testing: −25% errors and +15%
      efficiency; control BI (+50% precision, 15+ users) and VBA integrations
