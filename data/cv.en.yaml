      contexto: >-
        I entered mass transit through the supervision of TransMilenio: about 150
        routes grouped into 10 concession companies. No single source described the
        operation; it had to be rebuilt by cross-referencing fare collection, fleet
        and GPS, scheduling, incidents and user complaints, each with its own
        structure and its own quality.
      reto: >-
        Producing indicators that could withstand the discussion between the authority
        and ten concessionaires with different interests: traceable from the GPS or
        fare record to the figure in the report.
      cifras:
        - valor: 150
          prefijo: "~"
          etiqueta: "routes supervised"
        - valor: 10
          etiqueta: "concession companies"
        - valor: 5
          etiqueta: "sources cross-referenced to rebuild the operation"
        - valor: 40
          prefijo: "−"
          sufijo: "%"
          etiqueta: "processing time, at the very least"
      capitulos:
        - titulo: "Traceability as a condition of legitimacy"
          texto: >-
            When an indicator can support a discount or a penalty, its lineage must be as solid as
            its calculation. Every figure had to be reconstructable down to the operational event
            that produced it; with ten concessionaires across the table, that was the only argument
            that held.
        - titulo: "Performance dashboards and reports"
          texto: >-
            Two weekly reports, a monthly consolidated one and those requested on demand: scheduled
            versus completed services, routes and coverage, headways between buses and compliance. I
            learned to separate outcome indicators from behavior indicators: the headway between
            buses warned earlier than the monthly report.
        - titulo: "The written rule first, then the macro"
          texto: >-
            I automated with Excel, VBA and SQL the extraction, validation and consolidation of the
            concessionaires' weekly files. Input validation —mandatory fields, possible ranges,
            duplicates— was the part that changed most and the one that prevented the most errors.
        - titulo: "The system's statistical memory"
          texto: >-
            I organized the accumulated weekly files in SQLite: the same route and the same headway,
            month after month. It was my first complete data pipeline, and the asset that remained
            when I left in May 2020.
        - titulo: "Two questions that are now research"
          texto: >-
            The data showed two problems I could not solve from supervision: driver–vehicle–route
            assignment and bus bunching. Today they are two of the research pieces I publish in the
            showcase, with their method and their result.
      impacto:
        - "Weekly and monthly performance reports for about 150 routes, traceable from the figure to the record."
        - "At least 40% less processing time with automation in Excel, VBA and SQL."
        - "A statistical memory of the operation that stopped starting from scratch every week."
        - "Two questions from the operation turned, years later, into published research."
      leccion: >-
        Observing a system is much more than producing indicators: it requires
        rebuilding its relationships and preserving evidence of every transformation.
  - slug: "ceinfes"
    nombre: "Running an operation with indicators — Ceinfes (2017–2018)"
    resumen: >-
      Coordinating three fronts —scheduling, digitalization and logistics, about 40
      people— for assessments at more than 100 schools a year: KPIs by area,
      balancing the digitalization line, a VBA macro for scheduling, weekly reports
      to the board and the transition to process-based management with Kanban and
      Scrum.
    stack: ["KPIs", "VBA", "BPMN · Bizagi", "Kanban · Scrum"]
    casestudy:
      titular: "Three areas that worked separately turned into a single flow, observable through indicators and run with evidence before the board of directors."
      contexto: >-
        Ceinfes delivered mock exams to more than 100 schools a year. Teachers,
        materials, exams, transport and information had to be at each school at the
        exact moment: arriving early complicated custody; arriving late put the exam
        at risk.
      reto: >-
        Making scheduling, digitalization and logistics stop operating as independent
        units and work as a single system that could be seen, anticipated and run.
      cifras:
        - valor: 100
          sufijo: "+"
          etiqueta: "schools served per year"
        - valor: 40
          prefijo: "~"
          etiqueta: "people across three fronts"
        - valor: 250
          prefijo: "~"
          etiqueta: "answer sheets digitized per shift"
      capitulos:
        - titulo: "KPIs as gauges along the flow"
          texto: >-
            I built indicators for scheduling, logistics and digitalization, each with its number of
            the day: demand to serve, confirmed resources, material delivered, exams received and
            pending digitization. The intermediate ones were the useful ones: they warned before a
            school felt the delay.
        - titulo: "One shared definition per metric"
          texto: >-
            «Complete delivery» or «validated record» had to mean the same for everyone, and every
            KPI had to be traceable down to the school, the batch or the date that produced it.
            Otherwise, the meeting is spent arguing about the number.
        - titulo: "Digitalization as a production line"
          texto: >-
            I treated digitalization as a line-balancing problem: two scanning stations, about 250
            sheets per shift and close to 10% manual capture. The effective capacity was not the
            scanners', but the validation station's, and that was the one to protect.
        - titulo: "From one person's memory to a rule"
          texto: >-
            Assigning teachers to schools was done by hand in Google Calendar. I designed a VBA
            macro that optimized it with explicit constraints —availability, competence, location,
            the school's window— and the knowledge moved from one person to a rule the team could
            run and discuss.
        - titulo: "The board, every Friday"
          texto: >-
            For the first time I presented weekly reports to the board: an executive summary with a
            traceable base behind it. They led to incentives, better working conditions and the
            redesign of positions, processes and software. I also led the move to process-based
            management with BPMN, Kanban and Scrum.
      impacto:
        - "Three areas turned into a single flow, with daily KPIs for more than 100 schools a year."
        - "Scheduling moved from depending on one person's memory to explicit rules in a VBA macro."
        - "Weekly reports to the board that ended in incentive programs and the redesign of positions, processes and software."
        - "Process-based management with Kanban and Scrum, and a first governance of access to students' results."
      leccion: >-
        Inglopres taught me to structure an operation; Ceinfes taught me to run it
        through information.
  - slug: "inglopres"
    nombre: "Building the data no one had — Inglopres (2016–2017)"
    resumen: >-
      First job as Process Engineer at a heavy-machinery rental and sales company
      (about 120 units): implementation of the Odoo ERP, analysis databases in
      SQLite and SQL, work study with fatigue allowances, supply chain under ISO
      9001:2015 and a team of 12 people with 95% client satisfaction.
    stack: ["Odoo (ERP)", "SQLite · SQL", "BPMN · FlexSim", "ISO 9001:2015"]
    casestudy:
      titular: "My first job: integrating a heavy-machinery operation with an ERP and building the data it needed to be measured."
      contexto: >-
        Inglopres rented, bought and sold heavy machinery, with a fleet of about 120
        units. Every sale or rental depended on which machine was available, in what
        condition, at which site and with what maintenance pending, and that
        information lived in scattered records nobody cross-referenced.
      reto: >-
        Understanding the operation end to end, integrating it into a single system
        and measuring it with reliable indicators, when much of the information needed
        did not even exist.
      cifras:
        - valor: 120
          prefijo: "~"
          etiqueta: "machinery units in the fleet"
        - valor: 12
          etiqueta: "people on the team I led"
        - valor: 95
          sufijo: "%"
          etiqueta: "client satisfaction"
      capitulos:
        - titulo: "An ERP integrates what was already agreed"
          texto: >-
            I led the Odoo implementation so the areas moved from scattered records to a single
            version of the operation. Before configuring anything, I mapped the real process by
            observing and asking, and modeled it in BPMN with Bizagi: an ERP does not integrate an
            organization, it integrates what the organization already agreed on.
        - titulo: "The data that did not exist"
          texto: >-
            To measure, I needed information nobody captured. I designed the analysis database in
            SQLite —entities, relationships and rules that preserved the meaning of each field— and
            queried it in SQL. That is where my path toward data began: as a consequence of the
            problem, not as a change of profession.
        - titulo: "Measuring work without punishing the worker"
          texto: >-
            I carried out a formal time study of the repetitive activities and added the ILO fatigue
            allowances. An observed time is not a standard: without that allowance, the standard is
            met for one week and missed for the rest of the year.
        - titulo: "Supply chain under ISO 9001:2015"
          texto: >-
            I measured response time, service level and fleet availability with the same data, and
            ensured the ISO 9001:2015 requirements. That standard was my first school of
            traceability: work leaves a written trail, and the same structure serves me today with
            ISO/IEC 42001.
        - titulo: "Leading means reducing ambiguity"
          texto: >-
            With twelve operators and technicians, each person knew what result was expected, who
            was accountable for it, what information they had and what done meant. The time standard
            we built was the same one used to assign the task.
      impacto:
        - "An ERP (Odoo) implemented from scratch and an analysis database in SQLite that did not exist before."
        - "Around 20% more operational efficiency —an estimate made today, since the measurement from then was not kept—: less rework and less time between the order and the machine on site."
        - "Time standards with fatigue allowances that the team could meet and defend."
        - "95% client satisfaction with a team of 12 people."
      leccion: >-
        The problem I was solving in 2016 —that the decision needed a piece of data
        nobody had built— is exactly the same one I solve today, with other tools and
        another scale.

