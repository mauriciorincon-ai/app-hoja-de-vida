    stack: ["WMS", "BI", "VBA"]
    casestudy:
      titular: "Changing the system that runs a medicine warehouse without stopping dispatch: six months of testing with the largest team I have led."
      contexto: >-
        Cafam was implementing a WMS across its logistics operation: a
        critical system change where every data error is paid for in the
        warehouse.
      reto: >-
        Assure the quality of the implementation while coordinating the
        largest testing team I've led, without slowing the operation.
      cifras:
        - valor: 20
          etiqueta: "people: 14 from Cafam and 6 from Oracle"
        - valor: 6
          prefijo: "~"
          etiqueta: "months of WMS testing"
        - valor: 25
