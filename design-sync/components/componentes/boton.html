<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Botón — CV Viva</title>
<style>
  :root {
    --paper-0:#fbfaf7; --paper-1:#f5f3ed; --paper-2:#ece9e0; --paper-3:#ddd8cb;
    --ink-0:#121110; --ink-1:#2a2927; --ink-2:#5e5c55; --ink-3:#9c9a90;
    --sage:#cfe3cf; --sage-ink:#3c5a3c; --rose:#f2d6d6; --rose-ink:#7a3f3f;
    --sky:#cedde9; --sky-ink:#2e4e6b; --citron:#e6e3b8; --citron-ink:#5e5a1e;
    --lilac:#ddd3e8; --lilac-ink:#4e3e6b; --peach:#f2dec4; --peach-ink:#6b4820;
    --danger:#c97a7a;
    --sh-1:0 1px 0 rgba(18,17,16,.04), 0 1px 2px rgba(18,17,16,.04);
    --sh-2:0 4px 12px -4px rgba(18,17,16,.08), 0 2px 4px rgba(18,17,16,.04);
    --sh-3:0 12px 32px -8px rgba(18,17,16,.14);
    --ease-out-cubic:cubic-bezier(.21,.61,.35,1);
    --ease-in-out-cubic:cubic-bezier(.65,0,.35,1);
    --display:Fraunces,'Iowan Old Style',Georgia,serif;
    --sans:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:28px; background:var(--paper-0); color:var(--ink-1);
    font-family:var(--sans); font-size:15px; line-height:1.6; }
  h1 { font-family:var(--display); font-size:26px; font-weight:500; letter-spacing:-.02em;
    color:var(--ink-0); margin:0 0 6px; }
  .lede { color:var(--ink-2); margin:0 0 24px; max-width:62ch; }
  .nota { color:var(--ink-2); font-size:13.5px; max-width:70ch; margin-top:20px;
    border-left:2px solid var(--paper-3); padding-left:12px; }
  .rotulo { font-family:var(--mono); font-size:11px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--ink-2); margin:26px 0 10px; }
  code { font-family:var(--mono); font-size:12.5px; background:var(--paper-1);
    border:1px solid var(--paper-2); border-radius:4px; padding:1px 5px; }
  .fila { display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
  .b { font:inherit; font-size:15px; font-weight:500; min-height:44px; padding:0 22px;
    border-radius:6px; border:1px solid transparent; cursor:pointer;
    transition:filter 120ms var(--ease-out-cubic); display:inline-flex; align-items:center; gap:8px; }
  .b:hover { filter:brightness(.97); }
  .b-pri { background:var(--sage); color:var(--sage-ink); box-shadow:var(--sh-1); }
  .b-sec { background:var(--paper-1); color:var(--ink-1); border-color:var(--paper-3); }
  .b-ghost { background:transparent; color:var(--ink-2); }
  .b-ghost:hover { background:var(--paper-1); }
  .b[disabled] { opacity:.55; cursor:not-allowed; }
  .foco { outline:2px solid var(--sky-ink); outline-offset:2px; }
</style>
</head>
<body>

<h1>Botón</h1>
<p class="lede">Tres pesos y ni uno más. El primario gasta el sage; el resto vive de papel.
Área táctil mínima 44px, siempre.</p>
<div class="fila">
  <button class="b b-pri">Avísame cuando abra <span aria-hidden="true">&rarr;</span></button>
  <button class="b b-sec">Ver la ficha completa</button>
  <button class="b b-ghost">Volver</button>
  <button class="b b-pri" disabled>Enviando…</button>
</div>
<p class="rotulo">Foco visible</p>
<div class="fila"><button class="b b-sec foco">Con foco de teclado</button></div>
<p class="nota">El anillo de foco es <code>sky-ink</code> a 2px con 2px de separación: se ve sobre
papel y sobre pastel. Nunca se elimina el <code>outline</code> sin poner otro visible en su
lugar.</p>

</body>
</html>
